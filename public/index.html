function parseBackupToDocs(j) {
  let docs = [];
  const tsToDate = (ts) => {
    if (!ts) return "";
    try {
      if (typeof ts === "string" && ts.includes("-")) return ts.slice(0, 10);
      const d = new Date(Number(ts));
      return isNaN(d.getTime()) ? "" : d.toISOString().slice(0, 10);
    } catch (e) { return ""; }
  };

  const sanitizeStatus = (st, notes = "", name = "") => {
    const valid = ["Actif", "Vendu", "Mort", "Abattu", "Externe", "Donné"];
    if (valid.includes(st)) return st;
    const txt = ((notes || "") + " " + (name || "")).toLowerCase();
    if (txt.includes("mort") || txt.includes("décéd") || txt.includes("crevé") || txt.includes("perte")) return "Mort";
    if (txt.includes("vendu") || txt.includes("vente")) return "Vendu";
    if (txt.includes("abatt") || txt.includes("boucherie")) return "Abattu";
    if (txt.includes("externe")) return "Externe";
    if (txt.includes("donné") || txt.includes("cadeau")) return "Donné";
    return "Actif";
  };

  if (Array.isArray(j.docs) && j.docs.length > 0) {
    docs = j.docs.map(d => {
      if (d.kind === "rabbit") {
        return {
          ...d,
          status: sanitizeStatus(d.status, d.notes, d.name),
          birth: tsToDate(d.birth || d.dateOfBirth) || today(),
          father: d.father ? String(d.father) : (d.fatherId ? String(d.fatherId) : ""),
          mother: d.mother ? String(d.mother) : (d.motherId ? String(d.motherId) : ""),
          photo: d.photo || d.imageUri || ""
        };
      }
      return d;
    });
  } else {
    (j.rabbits || []).forEach((r) => {
      docs.push({
        kind: "rabbit",
        id: String(r.id),
        name: r.name || "Inconnu",
        sex: r.sex === "Female" ? "Female" : (r.sex === "Male" ? "Male" : "Indéterminé"),
        birth: tsToDate(r.dateOfBirth || r.birth) || today(),
        breed: r.breed || "",
        cage: r.cageNumber || r.cage || "",
        status: sanitizeStatus(r.status, r.notes, r.name),
        notes: r.notes || "",
        father: r.fatherId ? String(r.fatherId) : (r.father ? String(r.father) : ""),
        mother: r.motherId ? String(r.motherId) : (r.mother ? String(r.mother) : ""),
        photo: r.imageUri || r.photo || ""
      });
    });

    (j.matingRecords || []).forEach((m) => {
      docs.push({
        kind: "mating",
        id: String(m.id),
        male: String(m.maleId || m.male || ""),
        female: String(m.femaleId || m.female || ""),
        date: tsToDate(m.matingDate || m.date) || today(),
        due: tsToDate(m.expectedBirthDate || m.due) || today(),
        status: m.status || "Accouplé",
        notes: m.notes || ""
      });
    });

    (j.weightRecords || []).forEach((w) => {
      docs.push({
        kind: "weight",
        id: String(w.id),
        rabbit: String(w.rabbitId || w.rabbit || ""),
        kg: Number(w.weight || w.kg) || 0,
        date: tsToDate(w.recordDate || w.date) || today(),
        notes: w.notes || ""
      });
    });

    (j.treatmentRecords || []).forEach((t) => {
      docs.push({
        kind: "treatment",
        id: String(t.id),
        rabbit: t.rabbitId || t.rabbit ? String(t.rabbitId || t.rabbit) : "",
        type: t.type || "Autre soin",
        product: t.designation || t.product || "",
        date: tsToDate(t.date) || today(),
        dosage: t.dosage || "",
        notes: t.notes || "",
        next: tsToDate(t.nextDueDate || t.next),
        withdrawal: Number(t.withdrawalDays || t.withdrawal) || 0
      });
    });

    (j.inventoryItems || []).forEach((item) => {
      docs.push({
        kind: "item",
        id: String(item.id),
        name: item.name || "",
        cat: item.category || item.cat || "Autre",
        qty: Number(item.quantity || item.qty) || 0,
        unit: item.unit || "unité",
        price: Number(item.totalPrice || item.price) || 0,
        date: tsToDate(item.purchaseDate || item.date) || today(),
        notes: item.notes || ""
      });
    });

    (j.dailyFeedLogs || []).forEach((f) => {
      docs.push({
        kind: "feed",
        id: String(f.id),
        grams: Number(f.quantityGrams || f.grams) || 0,
        date: tsToDate(f.feedDate || f.date) || today(),
        notes: f.notes || ""
      });
    });

    (j.reminders || []).forEach((rem) => {
      docs.push({
        kind: "reminder",
        id: String(rem.id),
        title: rem.title || "",
        desc: rem.description || rem.desc || "",
        due: tsToDate(rem.dueDate || rem.due) || today(),
        prio: rem.priority || rem.prio || "Moyenne",
        done: !!(rem.isCompleted || rem.done)
      });
    });

    (j.fatteningBatches || []).forEach((b) => {
      docs.push({
        kind: "batch",
        id: String(b.id),
        code: b.batchCode || b.code || `LOT-${b.id}`,
        mating: b.matingRecordId || b.mating ? String(b.matingRecordId || b.mating) : "",
        weaning: tsToDate(b.weaningDate || b.weaning) || today(),
        initial: Number(b.initialCount || b.initial) || 0,
        current: Number(b.currentCount || b.current) || 0,
        deaths: Number(b.mortalityCount || b.deaths) || 0,
        cage: b.cageLocation || b.cage || "",
        avgWeight: Number(b.averageWeightGrams || b.avgWeight) || 0,
        target: tsToDate(b.targetSaleDate || b.target) || today(),
        status: b.status || "Actif"
      });
    });

    (j.financialTransactions || []).forEach((tx) => {
      docs.push({
        kind: "tx",
        id: String(tx.id),
        type: tx.type === "INCOME" || tx.type === "in" ? "in" : "out",
        cat: tx.category || tx.cat || "Autre",
        amount: Number(tx.amountFcfa || tx.amount) || 0,
        label: tx.description || tx.label || "",
        date: tsToDate(tx.date) || today()
      });
    });
  }

  // De-duplicate rabbit names if any duplicate exists
  const nameCounts = {};
  docs.forEach(d => {
    if (d.kind === "rabbit" && d.name) {
      nameCounts[d.name] = (nameCounts[d.name] || 0) + 1;
    }
  });

  const nameSeen = {};
  docs.forEach(d => {
    if (d.kind === "rabbit" && d.name) {
      if (nameCounts[d.name] > 1) {
        nameSeen[d.name] = (nameSeen[d.name] || 0) + 1;
        d.name = `${d.name} (${nameSeen[d.name]})`;
      }
    }
  });

  return docs;
}

$("#importFile").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const docs = parseBackupToDocs(j);
    if (!docs.length) throw new Error("Aucune fiche trouvée");
    const _counts = {}; docs.forEach((d) => { _counts[d.kind] = (_counts[d.kind] || 0) + 1; });
    const _summary = Object.entries(_counts).map(([k, n]) => `${n} ${k}`).join(", ");
    const _ex = getLocalData(); const _over = docs.filter((d) => _ex[d.kind + "-" + d.id]); const _overCounts = {}; _over.forEach((d) => { _overCounts[d.kind] = (_overCounts[d.kind] || 0) + 1; });
    const _overSummary = Object.entries(_overCounts).map(([k, n]) => `${n} ${k}`).join(", ");
    confirmBox(`Importer ${docs.length} fiche(s) ? (${_summary}) — ${_over.length ? `${_over.length} écraseront des fiches existantes (${_overSummary})` : "aucune fiche existante écrasée"} ; ${docs.length - _over.length} nouvelle(s). Une sauvegarde actuelle sera téléchargée avant l'import.`, "Importer", async () => { toast("Restauration en cours…"); const n = await bulk(docs, "Import"); toast(`✅ ${n} fiche(s) importée(s) avec succès`); render(); });
  } catch (err) {
    console.error("Import error:", err);
    toast("Fichier invalide : choisissez une sauvegarde ABV Farm (.json)");
  }
});

  if (el.dataset.act === "close" && el.tagName === "A") { closeModal(); return; }

});

/* ---------- Nettoyage dynamique du filigrane Netlify ---------- */
function purgeNetlifyWatermark() {
  const selectors = [
    'netlify-drawer',
    '[data-netlify-drawer]',
    '[data-netlify-badge]',
    '#netlify-badge',
    '.netlify-badge',
    'iframe[src*="netlify"]',
    'iframe[id*="netlify"]',
    '[id*="netlify-drawer"]',
    '[class*="netlify-drawer"]',
    '[id*="netlify-badge"]',
    '[class*="netlify-badge"]'
  ];
  selectors.forEach((sel) => {
    document.querySelectorAll(sel).forEach((el) => {
      try { el.remove(); } catch (e) { el.style.display = 'none'; }
    });
  });
}

try {
  const netlifyObserver = new MutationObserver(() => purgeNetlifyWatermark());
  netlifyObserver.observe(document.documentElement, { childList: true, subtree: true });
} catch (e) {}

window.addEventListener("DOMContentLoaded", purgeNetlifyWatermark);
window.addEventListener("load", purgeNetlifyWatermark);
setInterval(purgeNetlifyWatermark, 1000);

// Boot application
try { setTheme(getActiveTheme()); } catch (e) {}
const initialDocs = Object.values(getLocalData());
ingest(initialDocs);
updateUserUI();
updateAlertBadges();
checkAndNotifyUrgentAlerts(false);
setInterval(() => checkAndNotifyUrgentAlerts(false), 15 * 60 * 1000);
initFirebaseSync();
</script>
