/* ---------- Account Modal (Email & Google Auth + Cloud Settings) ---------- */
async function deleteAccount() {
  confirmBox("Supprimer définitivement votre compte et toutes vos données d'élevage ? Une sauvegarde JSON sera d'abord téléchargée. Cette action est irréversible.", "Supprimer mon compte", async () => {
    if (!userSession.isLocalProfile && !isOnline) { toast("⛔ Suppression impossible hors-ligne : le cheptel cloud ne pourrait pas être effacé. Reconnectez-vous au réseau puis réessayez."); return; }
    try {
      const docs = []; for (const [kind, key] of Object.entries(KIND)) S[key].forEach((x) => { const { kind: _k, ...rest } = x; docs.push({ kind, ...rest }); });
      const data = JSON.stringify({ app: "ABV Farm", version: 2, exported: today(), farm: userSession.farmName, docs, settings: backupSettings() }, null, 1); /* P4/F64 : réglages reproduction inclus, comme dans un export manuel. */
      const blob = new Blob([data], { type: "application/json" }); const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = `abvfarm-sauvegarde-avant-suppression-compte-${today()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) { toast("⚠️ Sauvegarde impossible : suppression annulée."); return; }
    if (unsubscribeSnapshot) { try { unsubscribeSnapshot(); } catch (e) {} unsubscribeSnapshot = null; }
    cancelListenerTimers();
    for (const [kind, key] of Object.entries(KIND)) for (const x of S[key].slice()) await removeDoc(kind, x.id);
    let profileErr = "";
    if (!userSession.isLocalProfile && window.firebaseDb && userSession.uid) {
      /* m16 : balayage cloud COMPLET avant la suppression du profil — avant,
         seuls les documents présents dans le cheptel LOCAL étaient supprimés
         (via removeDoc) : tout document cloud absent du local (autre appareil,
         fiche jamais redescendue) survivait à la « suppression du compte »,
         et la suppression du document users/{uid} n'efface pas ses
         sous-collections. */
      try {
        const _cloudDocs = await fsRunQueryCheptel(userSession.uid);
        for (const _cd of _cloudDocs) { const _did = _cd._docId || (_cd.kind && _cd.id ? _cd.kind + "-" + _cd.id : null); if (!_did) continue; try { await fsDeleteCheptelDoc(userSession.uid, _did); } catch (e) { if (!profileErr) profileErr = e.code || e.message || ""; } }
      } catch (e) { if (!profileErr) profileErr = e.code || e.message || ""; }
      try { await fsDeleteProfile(userSession.uid); } catch (e) { profileErr = e.code || e.message || ""; }
    }
    try { localStorage.removeItem(getUserDataKey()); localStorage.removeItem(trashKey()); localStorage.removeItem(activityKey()); localStorage.removeItem(pendingSyncKey()); localStorage.removeItem(cloudIdsKey()); localStorage.removeItem(lastSyncErrorKey()); localStorage.removeItem(conflictsKey()); localStorage.removeItem("abvfarm_cascade_log"); } catch (e) {}
    /* M95 : purge COMPLÈTE — avant, les tombstones du compte et les anciennes
       clés sans suffixe survivaient à la suppression de compte, et rien ne
       nettoyait jamais les clés orphelines. Balayage de toutes les clés
       contenant l'uid supprimé + clés historiques sans suffixe. */
    try { const _purgeUid = userSession.uid; ["abvfarm_pending_sync", "abvfarm_cloud_ids", "abvfarm_last_sync_error", "abvfarm_trash", "abvfarm_activity", "abvfarm_sync_conflicts", LS_DATA_KEY].forEach((k) => localStorage.removeItem(k)); localStorage.removeItem(tombstonesKey()); if (_purgeUid) { const _toDel = []; for (let _i = 0; _i < localStorage.length; _i++) { const _k = localStorage.key(_i); if (_k && _k.includes(_purgeUid)) _toDel.push(_k); } _toDel.forEach((k) => localStorage.removeItem(k)); } } catch (e) {} /* Section 12 P6 adapté aux clés namespacées de la section 3 (file, ids cloud, dernière erreur) + conflits et journal de cascades de la section 4. */
    let authErr = "";
    if (!userSession.isLocalProfile && window.firebaseAuth && window.firebaseAuth.currentUser) {
      try { await window.firebaseAuth.currentUser.delete(); } catch (e) { authErr = e.code || e.message || ""; }
    }
    if (window.firebaseAuth) { await window.firebaseAuth.signOut().catch(() => {}); }
    userSession = { isLoggedIn: false, farmName: "ABV Farm", email: "", managerName: "Éleveur ABV", photoUrl: null, uid: null, isLocalProfile: false, authProvider: null, lastSync: null };
    try { localStorage.removeItem(LS_USER_KEY); } catch (e) {}
    cloudSyncActive = false; cloudSnapshotEver = false; ready = false; S = blank();
    const guestData = getLocalData(); ingest(Object.values(guestData));
    closeModal(); render();
    if (authErr) toast("Compte et données supprimés, sauf l'identifiant de connexion (connexion trop ancienne) : reconnectez-vous puis supprimez à nouveau pour le supprimer." + (profileErr ? " Profil cloud non supprimé : règle Firestore à déployer." : ""));
    else if (profileErr) toast("Cheptel et identifiant supprimés, mais le profil cloud n'a pas pu être supprimé : déployez la règle delete dans Firestore, puis vérifiez.");
    else toast("Compte et données supprimés définitivement.");
  });
}

    confirmBox(`Importer ${docs.length} fiche(s) distincte(s) ? (${_summary}) — ${_over.length ? `${_over.length} écraseront des fiches existantes (${_overSummary}), mises en corbeille avant l'écrasement (corbeille plafonnée à 100)` : "aucune fiche existante écrasée"} ; ${docs.length - _over.length} nouvelle(s).${_warnTxt ? ` ⚠️ ${_warnTxt}.` : ""}${_rejTxt} Une sauvegarde actuelle sera téléchargée avant l'import ; si elle échoue, l'import sera annulé sans modifier aucune fiche.${localDataCorrupt ? " Données locales corrompues : cet import les remplacera (la donnée brute sera téléchargée comme sauvegarde si possible)." : ""}`, "Importer", async () => { toast("Restauration en cours…"); const n = await bulk(docs, "Import"); if (n < 0) { toast("⛔ Import annulé (voir le message ci-dessus) : aucune fiche modifiée."); render(); return; } if (j.settings) restoreBackupSettings(j.settings); /* M39 : restaurer aussi les réglages quand la sauvegarde en contient. */ toast(`✅ ${n} fiche(s) distincte(s) importée(s) avec succès${lastImportRejected.length ? ` — ${lastImportRejected.length} ligne(s) rejetée(s) non importée(s)` : ""}`); render(); });
  } catch (err) {
    console.error("Import error:", err);

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  /* C10 : filet central — avant, une exception ou une promesse rejetee d'un
     handler etait silencieuse (clic sans effet, donnees crues enregistrees).
     Comportement normal inchange : appel synchrone, try/catch + .catch pour
     les handlers async, message visible en cas d'echec. */
  const f = A[el.dataset.act]; if (!f) { console.warn("Action inconnue (data-act) :", el.dataset.act); return; }
  if (ABV_SHARED && (el.dataset.act === "wipe" || el.dataset.act === "import" || el.dataset.act === "export")) { e.preventDefault(); toast("🔒 Action indisponible pendant la consultation d'un élevage partagé."); return; }
  if (ABV_SHARED && ABV_SHARED.level !== "ecriture" && ABV_MUTATION_ACTS.has(el.dataset.act)) { e.preventDefault(); toast("🔒 Lecture seule : vous consultez l'élevage de " + (ABV_SHARED.ownerEmail || "un autre éleveur") + ", modification impossible."); return; }
  if (el.dataset.act === "close" && el.tagName === "A") { closeModal(); return; }
  if (el.dataset.act !== "overlay") e.preventDefault();
  try {
    const _r = f(el, e);
    if (_r && typeof _r.catch === "function") _r.catch((err) => { console.error("Action interrompue :", el.dataset.act, err); try { toast("⚠️ Action interrompue : l'opération n'a pas abouti, réessayez."); } catch (_) {} });
  } catch (err) { console.error("Action interrompue :", el.dataset.act, err); try { toast("⚠️ Action interrompue : l'opération n'a pas abouti, réessayez."); } catch (_) {} }
});

/* ---------- Nettoyage dynamique du filigrane Netlify ---------- */
function purgeNetlifyWatermark() {
  const selectors = [
    'netlify-drawer',
    '[data-netlify-drawer]',
    '[data-netlify-badge]',
    '#netlify-badge',
    '.netlify-badge',
    'iframe[src*="netlify"]',
    'iframe[id*="netlify"]',
    '[id*="netlify-drawer"]',
    '[class*="netlify-drawer"]',
    '[id*="netlify-badge"]',
    '[class*="netlify-badge"]'
  ];
  selectors.forEach((sel) => {
    document.querySelectorAll(sel).forEach((el) => {
      try { el.remove(); } catch (e) { el.style.display = 'none'; }
    });
  });
}

try {
  const netlifyObserver = new MutationObserver(() => purgeNetlifyWatermark());
  netlifyObserver.observe(document.documentElement, { childList: true, subtree: true });
} catch (e) {}

window.addEventListener("DOMContentLoaded", purgeNetlifyWatermark);
window.addEventListener("load", purgeNetlifyWatermark);

// Boot application
try { setTheme(getActiveTheme()); } catch (e) {}
try { migrateLegacyGlobalKeys(); } catch (e) {} /* C4 : rattache les anciennes clés globales (corbeille / journal / conflits) au compte de la session restaurée. */
/* C11 : chaque etape du demarrage est isolee (try/catch + journal) et la
   synchro demarre TOT, juste apres l'ingestion locale : avant, une seule
   exception dans les badges/alertes empechait initFirebaseSync() — plus
   aucune synchro pour la session, sans message. */
let initialDocs = [];
try { initialDocs = Object.values(getLocalData()); } catch (e) { console.error("Boot : lecture des donnees locales impossible :", e); }
try { ingest(initialDocs); } catch (e) { console.error("Boot : ingestion des donnees locales impossible :", e); }
try { runDataRepairP3(); } catch (e) { console.error("Boot : réparation des données P3 impossible :", e); } /* P3 : migration de réparation des portées historiques — asynchrone, gardée par marqueur, ne bloque jamais le démarrage. */
try { runFinanceRepair(); } catch (e) { console.error("Boot : réconciliation finances impossible :", e); } /* FIN-REPAIR : rattacher les achats/ventes importés au journal financier — même garde par marqueur. */
try { initFirebaseSync(); } catch (e) { console.error("Boot : demarrage de la synchronisation impossible :", e); }
try { if (localDataCorrupt) showLocalDataCorruptSheet(); } catch (e) { console.error("Boot : feuille donnees corrompues impossible :", e); }
try { updateUserUI(); } catch (e) { console.error("Boot : mise a jour de l'interface utilisateur impossible :", e); }
try { updateAlertBadges(); } catch (e) { console.error("Boot : mise a jour des badges d'alerte impossible :", e); }
try { checkAndNotifyUrgentAlerts(false); } catch (e) { console.error("Boot : verification des alertes urgentes impossible :", e); }
try { setInterval(() => { try { checkAndNotifyUrgentAlerts(false); } catch (e) { console.error("Alertes urgentes periodiques impossibles :", e); } }, 15 * 60 * 1000); } catch (e) { console.error("Boot : planification des alertes urgentes impossible :", e); }
/* C6 : fiabiliser les alertes locales QUAND l'app est ouverte — reverifier
   des le retour au premier plan (les retards sont ainsi signales a la
   reouverture). Aucun push serveur n'est promis : app fermee, rien n'arrive. */
try { document.addEventListener("visibilitychange", () => { if (!document.hidden) { try { checkAndNotifyUrgentAlerts(false); } catch (e) { console.error("Alertes urgentes au retour au premier plan impossibles :", e); } } }); window.addEventListener("focus", () => { try { checkAndNotifyUrgentAlerts(false); } catch (e) { console.error("Alertes urgentes au focus impossibles :", e); } }); } catch (e) { console.error("Boot : ecoute du retour au premier plan impossible :", e); }
