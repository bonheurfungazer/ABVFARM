[build]
  # Dossier contenant la version Web prête à être déployée
  publish = "public"
  functions = "netlify/functions"
  command = ""

[build.environment]
  NETLIFY_SKIP_COLLABORATIVE_PROMPTS = "true"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
