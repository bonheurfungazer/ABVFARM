/* Production Layout & Palette */
:root {

  --warn: #9A5208; --warn-soft: #FFF1D9;

  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-s: 8px; --r-m: 14px; --r-l: 20px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101512; --surface: #18201B; --surface-2: #212A25; --ink: #E4ECE6; --muted: #A2B3A9; --line: #2E3B34;
  --sage: #7CB88F; --sage-ink: #0E2416; --sage-soft: #233A2B; --sage-soft-ink: #D3EBDB;
  --clay: #EC9E86; --clay-soft: #46271E;
  --ok: #8FD19E; --ok-soft: #1B3423; --warn: #F4B567; --warn-soft: #3A2911; --bad: #FFB0A6; --bad-soft: #4A1D1A;
  --info: #8CCBF7; --info-soft: #0F2D43; --male: #A3CBF3; --male-soft: #16283A; --female: #F4AACB; --female-soft: #35192A;
  --hero: #2C553B; --hero-ink: #EEF6F0; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #101512; --surface: #18201B; --surface-2: #212A25; --ink: #E4ECE6; --muted: #A2B3A9; --line: #2E3B34;
  --sage: #7CB88F; --sage-ink: #0E2416; --sage-soft: #233A2B; --sage-soft-ink: #D3EBDB;
  --clay: #EC9E86; --clay-soft: #46271E;
  --ok: #8FD19E; --ok-soft: #1B3423; --warn: #F4B567; --warn-soft: #3A2911; --bad: #FFB0A6; --bad-soft: #4A1D1A;
  --info: #8CCBF7; --info-soft: #0F2D43; --male: #A3CBF3; --male-soft: #16283A; --female: #F4AACB; --female-soft: #35192A;
  --hero: #2C553B; --hero-ink: #EEF6F0; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }

main { min-width: 0; padding-block: 20px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

@media (min-width: 900px) {

  main { padding-block: 28px 48px; padding-right: max(28px, env(safe-area-inset-right, 0px)); padding-left: 28px; }

}

.brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 16px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }

.nav-a[aria-current="page"] { background: var(--sage-soft); color: var(--sage-soft-ink); font-weight: 700; }

/* User Account & Sync widget in Sidebar */
.side-account { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.user-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); cursor: pointer; text-decoration: none; color: inherit; transition: background .12s ease; }
.user-card:hover { filter: brightness(0.97); }
.user-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--sage); color: var(--sage-ink); font-weight: 700; font-size: .85rem; display: grid; place-items: center; flex: none; overflow: hidden; }
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-meta { min-width: 0; flex: 1; }
.user-meta b { display: block; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.user-meta small { color: var(--muted); font-size: .72rem; display: flex; align-items: center; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 6px rgba(30,107,52,.4); }
.dot.offline { background: var(--warn); }
.dot.local { background: var(--info); }

.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); box-shadow: 0 -2px 10px rgba(0,0,0,.04); }
.bottom a, .bottom button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; text-decoration: none; color: var(--muted); font-size: .7rem; font-weight: 600; background: none; border: 0; cursor: pointer; }
.bottom .pill { width: 54px; height: 30px; display: grid; place-items: center; border-radius: 15px; transition: background .12s ease; }
.bottom [aria-current="page"] { color: var(--ink); }
.bottom [aria-current="page"] .pill { background: var(--sage-soft); color: var(--sage-soft-ink); }
.bottom svg { width: 21px; height: 21px; }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head p { color: var(--muted); margin-top: 2px; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card > .row-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .v { font-family: var(--f-display); font-size: 1.6rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .l { font-size: .78rem; color: var(--muted); font-weight: 600; }
.tile .s { font-size: .78rem; color: var(--muted); }
.tile.warn { background: var(--warn-soft); border-color: transparent; } .tile.warn .v { color: var(--warn); }
.tile.bad { background: var(--bad-soft); border-color: transparent; } .tile.bad .v { color: var(--bad); }

.hero { background: var(--hero); color: var(--hero-ink); border-radius: var(--r-l); padding: 22px; display: grid; gap: 16px; grid-template-columns: 1fr; position: relative; overflow: hidden; }
.hero h1 { font-size: 1.9rem; }
.hero p, .hero .head p { color: inherit; opacity: .86; max-width: 60ch; }
.hero .meta { display: flex; gap: 8px; flex-wrap: wrap; }
.hero .chip { background: rgba(255,255,255,.14); color: var(--hero-ink); }
.hero svg.ears { position: absolute; right: -10px; bottom: -18px; width: 170px; opacity: .13; pointer-events: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 9px 14px; font-weight: 700; font-size: .9rem; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; white-space: nowrap; min-height: 40px; touch-action: manipulation; transition: background .12s ease, transform .08s ease; }
.btn:active { transform: scale(0.98); }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--sage); color: var(--sage-ink); border-color: transparent; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.clay { background: var(--clay); color: var(--surface); border-color: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 11px; font-size: .8rem; border-radius: 10px; min-height: 34px; }
.btn svg { width: 17px; height: 17px; }
.hero .btn { background: var(--hero-ink); color: var(--hero); border-color: transparent; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: .74rem; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.m { background: var(--male-soft); color: var(--male); }
.chip.f { background: var(--female-soft); color: var(--female); }
.chip.clay { background: var(--clay-soft); color: var(--clay); }
.tag { font-family: var(--f-mono); font-size: .72rem; font-weight: 700; letter-spacing: .02em; border: 1.5px solid currentColor; border-radius: 5px; padding: 0 5px; color: var(--muted); white-space: nowrap; }

.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .t { font-weight: 600; }
.li .d { font-size: .82rem; color: var(--muted); }
.ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--muted); }
.ico svg { width: 19px; height: 19px; }
.ico.ok { background: var(--ok-soft); color: var(--ok); } .ico.warn { background: var(--warn-soft); color: var(--warn); }
.ico.bad { background: var(--bad-soft); color: var(--bad); } .ico.info { background: var(--info-soft); color: var(--info); }
.ico.m { background: var(--male-soft); color: var(--male); } .ico.f { background: var(--female-soft); color: var(--female); }
.ico.clay { background: var(--clay-soft); color: var(--clay); }

.rcard { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; border-radius: var(--r-l); padding: 16px; border: 1px solid transparent; transition: transform .15s ease, box-shadow .15s ease; min-width: 0; }
.rcard:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.rcard.m { background: var(--male-soft); } .rcard.f { background: var(--female-soft); } .rcard.u { background: var(--surface-2); }
.rcard.off { background: var(--surface); border-color: var(--line); opacity: .85; }
.rcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.rcard .nm { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; line-height: 1.15; overflow-wrap: anywhere; }
.rcard.m .nm, .rcard.m .sx { color: var(--male); } .rcard.f .nm, .rcard.f .sx { color: var(--female); }
.rcard .facts { display: flex; gap: 14px; font-size: .82rem; color: var(--muted); flex-wrap: wrap; }
.rcard .facts b { color: var(--ink); font-weight: 700; }
.sx { font-size: 1.3rem; line-height: 1; font-weight: 800; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.chip-bar::-webkit-scrollbar { display: none; }
.chip-btn { border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); padding: 5px 11px; border-radius: 999px; font-size: .8rem; font-weight: 700; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .12s ease, color .12s ease, border-color .12s ease; }
.chip-btn:hover { background: var(--surface-2); color: var(--ink); }
.chip-btn[aria-pressed="true"] { background: var(--sage); color: var(--sage-ink); border-color: transparent; }
.chip-btn .badge { background: rgba(0,0,0,0.08); padding: 1px 6px; border-radius: 999px; font-size: .72rem; }
.chip-btn[aria-pressed="true"] .badge { background: rgba(255,255,255,0.28); color: #fff; }
.filter-select { border: 1.5px solid var(--line); border-radius: 11px; background: var(--surface); padding: 7px 10px; font-size: .82rem; font-weight: 600; color: var(--ink); outline: none; cursor: pointer; }
.filter-select:focus { border-color: var(--sage); }
.view-toggle { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 2px; gap: 2px; }
.view-toggle button { border: 0; background: transparent; padding: 6px 9px; border-radius: 8px; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.view-toggle button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.view-toggle svg { width: 16px; height: 16px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 9px; font-weight: 600; font-size: .84rem; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.search { flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.search input { border: 0; background: transparent; padding: 9px 0; width: 100%; outline: none; }
.search svg { width: 17px; height: 17px; color: var(--muted); flex: none; }

/* Gestation track */
.gest { display: flex; flex-direction: column; gap: 8px; }
.track { position: relative; height: 10px; border-radius: 6px; background: var(--surface-2); margin: 16px 0 18px; }
.track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--clay); }
.track .zone { position: absolute; top: 0; bottom: 0; background: var(--info); opacity: .28; }
.track .mk { position: absolute; top: -5px; width: 2px; height: 20px; background: var(--ink); opacity: .45; }
.track .mk span, .track .zone span { position: absolute; top: 22px; transform: translateX(-50%); font-size: .66rem; color: var(--muted); white-space: nowrap; font-weight: 600; }
.track .zone span { top: -18px; left: 50%; }
.track .now { position: absolute; top: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid var(--clay); transform: translateX(-50%); }
.gest .gl { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }

.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
@media (max-width: 600px) { .chart text { font-size: 19px; } }
.empty { text-align: center; padding: 32px 14px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty svg { width: 48px; height: 48px; opacity: .55; }
.empty b { color: var(--ink); font-family: var(--f-display); font-size: 1.1rem; }
.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--info-soft); color: var(--info); border-radius: var(--r-m); padding: 10px 14px; font-size: .88rem; font-weight: 600; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.ok { background: var(--ok-soft); color: var(--ok); }

.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px 18px; }
.kv div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.kv dt { font-size: .74rem; color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

.ped { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center; overflow-x: auto; }
.ped .col { display: flex; flex-direction: column; gap: 8px; justify-content: space-around; height: 100%; }
.pb { border-radius: 10px; padding: 8px 10px; font-size: .82rem; background: var(--surface-2); min-width: 0; text-decoration: none; color: inherit; display: block; }
.pb.m { background: var(--male-soft); } .pb.f { background: var(--female-soft); }
.pb b { display: block; overflow-wrap: anywhere; } .pb small { color: var(--muted); }
.pb.none { border: 1.5px dashed var(--line); background: transparent; color: var(--muted); }

.risk { border-radius: var(--r-m); padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
.risk.ok { background: var(--ok-soft); color: var(--ok); } .risk.warn { background: var(--warn-soft); color: var(--warn); } .risk.bad { background: var(--bad-soft); color: var(--bad); }

/* ---------- PWA Service Worker Registration ---------- */

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn1 = $("#btnInstallPWA");
  const btn2 = $("#btnInstallMobile");
  if (btn1) btn1.style.display = "inline-flex";
  if (btn2) btn2.style.display = "inline-flex";
});

window.addEventListener("appinstalled", () => {
  deferredPrompt = null;
  const btn1 = $("#btnInstallPWA");
  const btn2 = $("#btnInstallMobile");
  if (btn1) btn1.style.display = "none";
  if (btn2) btn2.style.display = "none";

});

function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === "accepted") {
        toast("Installation en cours...");
      }
      deferredPrompt = null;
    });
  } else {
    // Helpful guide for iOS Safari
    const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
    if (isIos) {

      toast("Pour installer : Menu du navigateur (⋮) > « Ajouter à l'écran d'accueil » ou « Installer ».");

}

/* ---------- Utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parse = (s) => new Date(String(s).slice(0, 10) + "T00:00:00");
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const fmtDate = (s) => { if (!s) return "—"; const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtShort = (s) => { if (!s) return "—"; const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const nf0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 });
const fcfa = (n) => nf0.format(Math.round(n || 0)) + " F";
const relDay = (n) => n === 0 ? "aujourd'hui" : n === 1 ? "demain" : n === -1 ? "hier" : n > 0 ? `dans ${n} j` : `il y a ${-n} j`;
function ageLabel(days) {
  if (days < 0) return "—";
  if (days < 60) return `${days} j`;
  if (days < 365) return `${Math.floor(days / 30.44)} mois`;
  const y = Math.floor(days / 365.25), m = Math.floor((days - y * 365.25) / 30.44);
  return `${y} an${y > 1 ? "s" : ""}${m ? ` ${m} m` : ""}`;
}

/* ---------- Farm rules ---------- */

/* ---------- State & Cloud/Local Sync Layer ---------- */
const KIND = { rabbit: "rabbits", mating: "matings", weight: "weights", treatment: "treatments", item: "inventory", feed: "feed", tx: "tx", batch: "batches", reminder: "reminders" };
let S = blank();
function blank() { const o = {}; Object.values(KIND).forEach((k) => (o[k] = [])); return o; }

const LS_DATA_KEY = "abvfarm_production_data_v2";
const LS_USER_KEY = "abvfarm_user_session_v2";

let userSession = loadUserSession();
let isOnline = navigator.onLine;
let ready = false;
let cloudSyncActive = false;

function loadUserSession() {
  try {
    return JSON.parse(localStorage.getItem(LS_USER_KEY) || "null") || {
      isLoggedIn: false,
      farmName: "ABV Farm",
      email: "",
      managerName: "Éleveur ABV",
      photoUrl: null,
      lastSync: null
    };
  } catch (e) {
    return { isLoggedIn: false, farmName: "ABV Farm", email: "", managerName: "Éleveur ABV", photoUrl: null, lastSync: null };
  }
}

function saveUserSession(session) {
  userSession = { ...userSession, ...session };
  try { localStorage.setItem(LS_USER_KEY, JSON.stringify(userSession)); } catch (e) {}
  updateUserUI();
}

function getUserDataKey() {
  return (userSession.isLoggedIn && userSession.uid) ? "abvfarm_data_user_" + userSession.uid : "abvfarm_data_guest";
}

function getLocalData() {
  try {
    const key = getUserDataKey();
    let val = localStorage.getItem(key);
    if (!val && key === "abvfarm_data_guest") {
      const legacy = localStorage.getItem(LS_DATA_KEY);
      if (legacy) {
        val = legacy;
        try { localStorage.setItem(key, legacy); } catch (e) {}
      }
    }
    return JSON.parse(val || "{}");
  } catch (e) {
    return {};
  }
}

function setLocalData(all) {
  try {
    const key = getUserDataKey();
    localStorage.setItem(key, JSON.stringify(all));
  } catch (e) {
    console.warn("Storage notice:", e);
  }
}

function ingest(docs) {

function signInWithGoogle() {
  if (!window.firebaseAuth) {
    toast("Service d'authentification indisponible. Réessayez.");
    return;
  }

  const provider = new firebase.auth.GoogleAuthProvider();
  provider.addScope("profile");
  provider.addScope("email");
  
  toast("Connexion avec Google en cours…");

  window.firebaseAuth.signInWithPopup(provider).then((result) => {
    if (result && result.user) {
      handleUserAuthenticated(result.user, `Connecté avec Google : ${result.user.displayName || result.user.email}`);
      closeModal();
    }
  }).catch((err) => {
    console.warn("Popup notice, handling auth error:", err);
    if (err.code === "auth/unauthorized-domain") {
      unauthorizedDomainModal();
      return;
    }
    if (err.code === "auth/popup-blocked" || err.code === "auth/cancelled-popup-request" || err.code === "auth/popup-closed-by-user") {
      window.firebaseAuth.signInWithRedirect(provider).catch((redirectErr) => {
        if (redirectErr.code === "auth/unauthorized-domain") {
          unauthorizedDomainModal();
        } else {
          toast("Erreur Google : " + (redirectErr.message || redirectErr.code));
        }
      });
    } else {
      toast("Erreur Google : " + (err.message || "Impossible de se connecter"));
    }
  });
}

function weightsOf(id) { return S.weights.filter((w) => w.rabbit === id).sort((a, b) => a.date.localeCompare(b.date)); }

function gmq(id) { const w = weightsOf(id); if (w.length < 2) return null; const a = w[0], b = w[w.length - 1]; const d = diff(a.date, b.date); return d > 0 ? ((b.kg - a.kg) * 1000) / d : null; }
function kgOf(it) {

  switch (it.unit) { case "sac 25 kg": return q * 25; case "sac 50 kg": return q * 50; case "g": return q / 1000; case "kg": return q; default: return 0; }

function feedStock() {
  const bought = S.inventory.filter((i) => i.cat === "Nourriture").reduce((s, i) => s + kgOf(i), 0);
  const used = S.feed.reduce((s, f) => s + (Number(f.grams) || 0), 0) / 1000;

}
function underWithdrawal(id) {
  const t = today();
  return S.treatments.filter((x) => x.rabbit === id && Number(x.withdrawal) > 0 && addDays(x.date, Number(x.withdrawal)) > t)
    .map((x) => addDays(x.date, Number(x.withdrawal))).sort().pop() || null;

function ration() {
  const t = today(); const c = { mal: 0, fem: 0, gest: 0, lact: 0, y1: 0, y2: 0 };
  S.rabbits.filter(isActive).forEach((r) => {
    const a = age(r);
    if (a < 30) return; if (a < 60) { c.y1++; return; } if (a < 120) { c.y2++; return; }
    if (r.sex === "Male") { c.mal++; return; }
    const lact = S.matings.some((m) => m.female === r.id && m.status === "Mise bas" && m.birthDate && diff(m.birthDate, t) <= 40);
    const gest = S.matings.some((m) => m.female === r.id && ["Accouplé", "Gestation confirmée"].includes(m.status) && diff(t, m.due) >= -3);
    if (lact) c.lact++; else if (gest) c.gest++; else c.fem++;
  });
  const fat = S.batches.filter((b) => b.status === "Actif").reduce((s, b) => s + (Number(b.current) || 0), 0);
  const g = c.mal * 120 + c.fem * 120 + c.gest * 180 + c.lact * 280 + c.y1 * 50 + c.y2 * 90 + fat * 110;
  return { grams: g, c, fat };
}

function makeKinship() {
  const memoA = new Map(), memoF = new Map();
  const older = (x, y) => { const a = rab(x), b = rab(y); const da = a?.birth || "9999", dbb = b?.birth || "9999"; return da === dbb ? (x < y) : da < dbb; };
  function F(x, depth) { if (!x) return 0; if (memoF.has(x)) return memoF.get(x); const r = rab(x); const v = r ? 0.5 * A(r.father, r.mother, depth + 1) : 0; memoF.set(x, v); return v; }
  function A(x, y, depth = 0) {
    if (!x || !y || depth > 12) return 0;
    if (x === y) return 1 + F(x, depth);
    const key = x < y ? x + "|" + y : y + "|" + x;
    if (memoA.has(key)) return memoA.get(key);
    let a = x, b = y; if (!older(a, b)) { a = y; b = x; }
    const rb = rab(b);
    const v = rb ? 0.5 * (A(a, rb.father, depth + 1) + A(a, rb.mother, depth + 1)) : 0;
    memoA.set(key, v); return v;
  }
  return { A, F };
}
function offspringF(male, female) { if (!male || !female) return 0; return 0.5 * makeKinship().A(male, female) * 100; }
function riskOf(f) {
  if (f <= 0.0001) return { lvl: "ok", label: "Aucune parenté connue", tip: "Accouplement sûr." };
  if (f < 6.25) return { lvl: "warn", label: "Risque faible", tip: "Parenté éloignée. Acceptable avec surveillance." };
  if (f <= 12.5) return { lvl: "bad", label: "Risque élevé", tip: "Équivaut à des demi-frères/sœurs. À éviter." };
  return { lvl: "bad", label: "Risque critique", tip: "Parenté très proche (frère/sœur, parent/enfant). Déconseillé." };
}

    }

  for (const x of S.treatments) if (x.next) { const n = diff(t, x.next); if (n <= 2 && n >= -14) out.push({ sev: n < 0 ? "bad" : "warn", icon: "syringe", title: `${x.type} : ${x.product || "rappel"}`, sub: `${x.rabbit ? rname(x.rabbit) : "Tout l'élevage"} — ${relDay(n)}` }); }
  for (const b of S.batches) if (b.status === "Actif") { const n = diff(t, b.target); if (n <= 3) out.push({ sev: "ok", icon: "coins", title: `Lot ${b.code} prêt à la vente`, sub: n < 0 ? `Date cible dépassée de ${-n} j` : `Date cible ${relDay(n)}`, act: [["Vendre", "sell", b.id]] }); }
  for (const r of S.reminders) if (!r.done && r.due <= t) out.push({ sev: r.prio === "Haute" ? "bad" : "warn", icon: "bell", title: r.title, sub: `Rappel — ${relDay(diff(t, r.due))}`, act: [["Fait", "remdone", r.id]] });
  const stock = feedStock(), rg = ration().grams;
  if (S.inventory.length && stock < 10) out.push({ sev: stock <= 0 ? "bad" : "warn", icon: "grain", title: stock <= 0 ? "Stock d'aliment épuisé" : `Stock d'aliment faible : ${nf1.format(stock)} kg`, sub: rg ? `Environ ${nf1.format(stock / (rg / 1000))} jours de ration` : "Pensez à réapprovisionner", act: [["Ajouter un achat", "newitem"]] });
  const order = { bad: 0, warn: 1, info: 2, ok: 3 };
  return out.sort((a, b) => order[a.sev] - order[b.sev]);
}

/* ---------- Offline Audio Chime & Vibration Engine ---------- */
function playAlertChime() {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    const ctx = new AudioContextClass();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // Ré 5
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12); // La 5

    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.45);
  } catch (e) {
    // Audio restricted prior to user touch
  }
}

function triggerVibration() {
  try {
    if ("vibrate" in navigator) {
      navigator.vibrate([150, 60, 150]);
    }
  } catch (e) {}
}

const LS_NOTIF_PREFS = "abv_notif_prefs_v1";
const LS_NOTIF_LOG = "abv_notif_log_v1";

function getNotifPrefs() {
  try {
    return JSON.parse(localStorage.getItem(LS_NOTIF_PREFS) || '{"sound":true,"vibrate":true,"autoNotify":true}');
  } catch (e) {
    return { sound: true, vibrate: true, autoNotify: true };
  }
}

function saveNotifPrefs(prefs) {
  try {
    localStorage.setItem(LS_NOTIF_PREFS, JSON.stringify(prefs));
  } catch (e) {}
}

async function requestNotificationPermission() {
  if (!("Notification" in window)) {
    toast("Les notifications système ne sont pas supportées par ce navigateur.");
    return false;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission === "granted") {
      toast("Notifications ABV Farm activées sur cet appareil !");
      playAlertChime();
      triggerVibration();
      sendOfflineNotification("ABV Farm • Notifications actives", {
        body: "Vos alertes de saillies, palpations, nids, mises bas et soins s'afficheront même hors-ligne.",
        tag: "abv-welcome"
      });
      return true;
    } else {
      toast("Autorisation refusée ou en attente.");
      return false;
    }
  } catch (err) {
    console.warn("Notification notice:", err);
    return false;
  }
}

function sendOfflineNotification(title, options = {}) {
  const prefs = getNotifPrefs();
  if (prefs.sound) playAlertChime();
  if (prefs.vibrate) triggerVibration();

  if (!("Notification" in window) || Notification.permission !== "granted") {
    return;
  }

  // 1. Envoi au Service Worker pour affichage fiable même en arrière-plan ou hors-ligne
  if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({
      type: "SHOW_NOTIFICATION",
      title,
      options: {
        body: options.body || "",
        icon: "./icon-192.png",
        badge: "./icon-192.png",
        tag: options.tag || "abv-alert",
        url: options.url || "./#rappels"
      }
    });
  } else if (navigator.serviceWorker && navigator.serviceWorker.ready) {
    navigator.serviceWorker.ready.then((reg) => {
      reg.showNotification(title, {
        body: options.body || "",
        icon: "./icon-192.png",
        badge: "./icon-192.png",
        tag: options.tag || "abv-alert",
        data: { url: options.url || "./#rappels" }
      });
    }).catch(() => {
      try { new Notification(title, { body: options.body, icon: "./icon-192.png" }); } catch (e) {}
    });
  } else {
    // 2. Repli direct Notification API
    try {
      new Notification(title, {
        body: options.body,
        icon: "./icon-192.png"
      });
    } catch (e) {}
  }
}

// Vérification et dispatch périodique des alertes urgentes
function checkAndNotifyUrgentAlerts(force = false) {
  const al = alerts();
  updateAlertBadges(al);

  const prefs = getNotifPrefs();
  if (!prefs.autoNotify && !force) return;
  if (!("Notification" in window) || Notification.permission !== "granted") return;

  const urgent = al.filter((a) => a.sev === "bad" || a.sev === "warn");
  if (!urgent.length) return;

  const todayKey = today();
  let log = {};
  try { log = JSON.parse(localStorage.getItem(LS_NOTIF_LOG) || "{}"); } catch (e) {}

  const toNotify = urgent.filter((a) => {
    const key = `${todayKey}_${a.title}`;
    return force || !log[key];
  });

  if (toNotify.length > 0) {
    const first = toNotify[0];
    const more = toNotify.length - 1;
    const body = more > 0 
      ? `${first.sub} (+ ${more} autre${more > 1 ? "s" : ""} alerte${more > 1 ? "s" : ""})`
      : first.sub;

    sendOfflineNotification(`ABV Farm • ${first.title}`, {
      body,
      tag: `abv-daily-${todayKey}`
    });

    toNotify.forEach((a) => {
      log[`${todayKey}_${a.title}`] = true;
    });
    try { localStorage.setItem(LS_NOTIF_LOG, JSON.stringify(log)); } catch (e) {}
  }
}

function updateAlertBadges(al) {
  if (!al) al = alerts();
  const count = al.length;
  const headerBadge = $("#headerAlertBadge");
  const sideBadge = $("#sideAlertBadge");

  if (headerBadge) {
    if (count > 0) {
      headerBadge.textContent = count > 99 ? "99+" : count;

      headerBadge.style.background = al.some((a) => a.sev === "bad") ? "var(--bad)" : "var(--warn)";

    }

      sideBadge.textContent = count;
      sideBadge.style.display = "inline-flex";
      sideBadge.className = `chip sm ${al.some((a) => a.sev === "bad") ? "bad" : "warn"}`;

      sideBadge.style.display = "none";
    }
  }
}

// Définition des tranches d'âge en cuniculture
const AGE_BRACKETS = [
  { id: "0-1m", label: "0 – 1 mois", desc: "< 30 j (au nid)", minD: 0, maxD: 29 },
  { id: "1-2m", label: "1 – 2 mois", desc: "30 à 59 j (sevrés)", minD: 30, maxD: 59 },
  { id: "2-3m", label: "2 – 3 mois", desc: "60 à 89 j (croissance)", minD: 60, maxD: 89 },

  { id: "1-2y", label: "1 – 2 ans", desc: "12 à 24 m (confirmés)", minD: 365, maxD: 729 },

VIEWS.lapins = () => {
  const q = (ui.q || "").trim().toLowerCase();
  const t = today();

  // Liste de base selon le statut (Actifs, Sortis / Archivés, ou Tous)
  const allAct = S.rabbits.filter(isActive);
  const allArch = S.rabbits.filter((r) => !isActive(r));
  let baseList = ui.st === "archives" ? allArch : ui.st === "all" ? S.rabbits : allAct;

  // Calcul statistique des tranches d'âge sur la base active/affichée
  const ageDistribution = AGE_BRACKETS.map((b) => {
    const rabbitsInB = baseList.filter((r) => {
      const a = age(r);
      return a >= b.minD && a <= b.maxD;
    });
    const males = rabbitsInB.filter((r) => r.sex === "Male").length;
    const females = rabbitsInB.filter((r) => r.sex === "Female").length;
    const indet = rabbitsInB.length - males - females;
    return {
      ...b,
      count: rabbitsInB.length,
      males,
      females,
      indet,
      percent: baseList.length ? Math.round((rabbitsInB.length / baseList.length) * 100) : 0
    };
  });

  // Pré-calcul des compteurs pour les puces rapides d'état
  const counts = {
    all: baseList.length,
    male: baseList.filter((r) => r.sex === "Male").length,
    female: baseList.filter((r) => r.sex === "Female").length,
    gest: baseList.filter((r) => S.matings.some((m) => m.female === r.id && ["Accouplé", "Gestation confirmée"].includes(m.status))).length,
    lact: baseList.filter((r) => S.matings.some((m) => m.female === r.id && m.status === "Mise bas" && m.birthDate && diff(m.birthDate, t) <= 45)).length,
    mature: baseList.filter((r) => age(r) >= MATURE_DAYS).length,
    young: baseList.filter((r) => { const a = age(r); return a >= 0 && a < MATURE_DAYS; }).length,
    treat: baseList.filter((r) => underWithdrawal(r.id) != null).length
  };

  let list = baseList.slice();

  // 1. Filtre par Tranche d'Âge cliquée dans la section répartition
  if (ui.ageBracket && ui.ageBracket !== "all") {
    const br = AGE_BRACKETS.find((b) => b.id === ui.ageBracket);
    if (br) {
      list = list.filter((r) => {
        const a = age(r);
        return a >= br.minD && a <= br.maxD;
      });
    }
  }

  // 2. Filtre par Stade / État physiologique
  if (ui.stage && ui.stage !== "all") {
    list = list.filter((r) => {
      const a = age(r);
      const isGest = S.matings.some((m) => m.female === r.id && ["Accouplé", "Gestation confirmée"].includes(m.status));
      const isLact = S.matings.some((m) => m.female === r.id && m.status === "Mise bas" && m.birthDate && diff(m.birthDate, t) <= 45);
      const isTreat = underWithdrawal(r.id) != null;
      switch (ui.stage) {
        case "male": return r.sex === "Male";
        case "female": return r.sex === "Female";
        case "gest": return isGest;
        case "lact": return isLact;
        case "mature": return a >= MATURE_DAYS;
        case "young": return a >= 0 && a < MATURE_DAYS;
        case "treat": return isTreat;
        default: return true;
      }
    });
  }

  // 3. Filtre par Sexe direct si sélectionné
  if (ui.sex && ui.sex !== "all") {
    list = list.filter((r) => r.sex === ui.sex);
  }

  // 4. Filtre par Race
  if (ui.breed && ui.breed !== "all") {
    list = list.filter((r) => (r.breed || "").trim().toLowerCase() === ui.breed.toLowerCase());
  }

  // 5. Filtre précis par Âge saisi par l'utilisateur (en mois)
  if (ui.minAgeM !== "" && !isNaN(Number(ui.minAgeM))) {
    const minDays = Number(ui.minAgeM) * 30.44;
    list = list.filter((r) => age(r) >= minDays);
  }
  if (ui.maxAgeM !== "" && !isNaN(Number(ui.maxAgeM))) {
    const maxDays = Number(ui.maxAgeM) * 30.44;
    list = list.filter((r) => {
      const a = age(r);
      return a >= 0 && a <= maxDays;
    });
  }

  // 6. Filtre précis par Poids saisi par l'utilisateur (en kg)
  if (ui.minWeight !== "" && !isNaN(Number(ui.minWeight))) {
    const minW = Number(ui.minWeight);
    list = list.filter((r) => {
      const w = lastWeight(r.id);
      return w != null && w >= minW;
    });
  }
  if (ui.maxWeight !== "" && !isNaN(Number(ui.maxWeight))) {
    const maxW = Number(ui.maxWeight);
    list = list.filter((r) => {
      const w = lastWeight(r.id);
      return w != null && w <= maxW;
    });
  }

  // 7. Recherche textuelle (Nom, Cage, Race, Notes)
  if (q) {
    list = list.filter((r) => [r.name, r.cage, r.breed, r.notes].some((v) => String(v || "").toLowerCase().includes(q)));
  }

  // 8. Tri intelligent
  list.sort((a, b) => {
    switch (ui.sort) {
      case "name_desc": return (b.name || "").localeCompare(a.name || "", "fr");
      case "age_desc": return age(b) - age(a);
      case "age_asc": return age(a) - age(b);
      case "weight_desc": return (lastWeight(b.id) || 0) - (lastWeight(a.id) || 0);
      case "weight_asc": return (lastWeight(a.id) || 0) - (lastWeight(b.id) || 0);
      case "cage_asc": return (a.cage || "").localeCompare(b.cage || "", "fr", { numeric: true });
      case "name_asc":
      default:
        return (a.name || "").localeCompare(b.name || "", "fr");
    }
  });

  const allBreeds = Array.from(new Set(S.rabbits.map((r) => (r.breed || "").trim()).filter(Boolean))).sort();
  const hasActiveFilters = (ui.stage && ui.stage !== "all") || (ui.sex && ui.sex !== "all") || (ui.breed && ui.breed !== "all") || ui.st !== "actifs" || (ui.ageBracket && ui.ageBracket !== "all") || ui.minAgeM !== "" || ui.maxAgeM !== "" || ui.minWeight !== "" || ui.maxWeight !== "" || q;

  afterHooks.push(() => {
    const input = $("#q");
    if (input) {
      input.addEventListener("input", () => {
        ui.q = input.value;
        const pos = input.selectionStart;
        render();
        const next = $("#q");
        if (next) { next.focus(); next.setSelectionRange(pos, pos); }
      });
    }
    const breedSel = $("#filterBreed");

    const sortSel = $("#filterSort");
    if (sortSel) sortSel.addEventListener("change", (e) => { ui.sort = e.target.value; render(); });

    // Inputs d'âge et de poids saisis par l'utilisateur
    const inpMinAge = $("#inpMinAge");
    if (inpMinAge) inpMinAge.addEventListener("input", (e) => { ui.minAgeM = e.target.value; render(); });
    const inpMaxAge = $("#inpMaxAge");
    if (inpMaxAge) inpMaxAge.addEventListener("input", (e) => { ui.maxAgeM = e.target.value; render(); });
    const inpMinWeight = $("#inpMinWeight");
    if (inpMinWeight) inpMinWeight.addEventListener("input", (e) => { ui.minWeight = e.target.value; render(); });
    const inpMaxWeight = $("#inpMaxWeight");
    if (inpMaxWeight) inpMaxWeight.addEventListener("input", (e) => { ui.maxWeight = e.target.value; render(); });
  });

  return `
  <div class="head">
    <div>
      <h1>Cheptel cunicole</h1>
      <p><b>${allAct.length}</b> actifs · <b>${allArch.length}</b> archivés / sortis</p>
    </div>
    <div class="actions">
      <button class="btn" data-act="exportpdf">${ICON.fileText}Inventaire PDF</button>
      <button class="btn pri" data-act="newrabbit">${ICON.plus}Ajouter un lapin</button>
    </div>
  </div>

  <!-- Barre d'outils et filtres principaux en haut -->
  <div class="toolbar" style="gap:10px">
    <label class="search" style="flex:1 1 220px">
      ${ICON.search}
      <input id="q" type="search" placeholder="Rechercher par nom, cage, race…" value="${esc(ui.q)}" aria-label="Rechercher">
      ${ui.q ? `<button type="button" data-act="ui" data-k="q" data-v="" style="border:none;background:none;cursor:pointer;color:var(--muted);padding:0" title="Effacer">${ICON.x}</button>` : ""}
    </label>

    <!-- Filtre par Race -->
    <select id="filterBreed" class="filter-select" aria-label="Filtrer par race">
      <option value="all" ${!ui.breed || ui.breed === "all" ? "selected" : ""}>Toutes les races (${counts.all})</option>
      ${allBreeds.map((b) => `<option value="${esc(b)}" ${ui.breed === b ? "selected" : ""}>Race : ${esc(b)}</option>`).join("")}
    </select>

    <!-- Filtre par Statut (Actifs / Archivés) -->
    <div class="seg" role="group">
      <button type="button" data-act="ui" data-k="st" data-v="actifs" aria-pressed="${ui.st === 'actifs'}">Actifs</button>
      <button type="button" data-act="ui" data-k="st" data-v="archives" aria-pressed="${ui.st === 'archives'}">Sortis (${allArch.length})</button>
      <button type="button" data-act="ui" data-k="st" data-v="all" aria-pressed="${ui.st === 'all'}">Tous</button>
    </div>

    <!-- Sélecteur de Tri enrichi (Âge, Poids, Nom, Cage) -->
    <select id="filterSort" class="filter-select" aria-label="Trier la liste">
      <option value="age_desc" ${ui.sort === "age_desc" ? "selected" : ""}>Âge : du + âgé au + jeune</option>
      <option value="age_asc" ${ui.sort === "age_asc" ? "selected" : ""}>Âge : du + jeune au + âgé</option>
      <option value="weight_desc" ${ui.sort === "weight_desc" ? "selected" : ""}>Poids : du + lourd au + léger</option>
      <option value="weight_asc" ${ui.sort === "weight_asc" ? "selected" : ""}>Poids : du + léger au + lourd</option>
      <option value="name_asc" ${ui.sort === "name_asc" ? "selected" : ""}>Nom (A → Z)</option>

    <div class="actions">${statusChip(r.status)}${r.cage ? `<span class="tag">CAGE ${esc(r.cage)}</span>` : ""}<span class="chip ${matur[0]}">${matur[1]}</span>${wd ? `<span class="chip bad">Délai d'attente jusqu'au ${fmtShort(wd)}</span>` : ""}${F > 0 ? `<span class="chip warn">Consanguinité F = ${nf1.format(F)} %</span>` : ""}</div>
    <div class="actions"><button class="btn sm" data-act="newweight" data-id="${id}">${ICON.scale}Pesée</button><button class="btn sm" data-act="newtreat" data-id="${id}">${ICON.syringe}Soin</button>${isActive(r) && r.sex !== "Indéterminé" ? `<button class="btn sm" data-act="newmating" data-id="${id}">${ICON.heart}Saillie</button>` : ""}</div>

  <div class="grid g2">

function pedigree(r) {

  return `<div class="ped"><div class="col"><div class="pb ${sexCls(r)}"><small>Sujet</small><b>${esc(r.name)}</b></div></div>
    <div class="col">${pb(r.father, "Père")}${pb(r.mother, "Mère")}</div>
    <div class="col">${pb(f?.father, "Grand-père pat.")}${pb(f?.mother, "Grand-mère pat.")}${pb(m?.father, "Grand-père mat.")}${pb(m?.mother, "Grand-mère mat.")}</div></div>`;
}
function weightChart(ws) {
  const W = 640, H = 210, L = 44, R = 14, T = 14, B = 28;
  const xs = ws.map((w) => parse(w.date).getTime()), ys = ws.map((w) => w.kg);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const span = y1 - y0 || 1;
  const step = span > 3 ? 1 : span > 1.2 ? 0.5 : span > 0.5 ? 0.25 : 0.1;
  y0 = Math.max(0, Math.floor(y0 / step) * step); y1 = Math.ceil(y1 / step) * step; if (y1 === y0) y1 = y0 + step;
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const X = (t) => L + ((t - x0) / (x1 - x0 || 1)) * (W - L - R), Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const ticks = []; for (let v = y0; v <= y1 + 1e-9; v += step) ticks.push(+v.toFixed(2));
  const pts = ws.map((w, i) => [X(xs[i]), Y(w.kg)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${Y(y0)} L${pts[0][0].toFixed(1)} ${Y(y0)} Z`;
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du poids">

function batchCard(b) {
  const days = diff(b.weaning, today()), total = Math.max(1, diff(b.weaning, b.target)), left = diff(today(), b.target);

  return `<section class="card"><div class="row-h"><div><h2>${esc(b.code)}</h2><span class="hint">${b.mating ? `Portée de ${esc(rname(byId(S.matings, b.mating)?.female))} · ` : ""}${b.cage ? `<span class="tag">${esc(b.cage)}</span>` : ""}</span></div>${b.status === "Quarantaine" ? `<span class="chip bad">Quarantaine</span>` : left <= 0 ? `<span class="chip ok">Prêt à vendre</span>` : `<span class="chip info">J${days} post-sevrage</span>`}</div>

}

VIEWS.finances = () => {
  const inc = S.tx.filter((x) => x.type === "in").reduce((s, x) => s + Number(x.amount || 0), 0);
  const exp = S.tx.filter((x) => x.type === "out").reduce((s, x) => s + Number(x.amount || 0), 0);
  let list = S.tx.slice().sort((a, b) => b.date.localeCompare(a.date)); if (ui.txf !== "all") list = list.filter((x) => x.type === ui.txf);
  const byCat = {}; S.tx.filter((x) => x.type === "out").forEach((x) => (byCat[x.cat] = (byCat[x.cat] || 0) + Number(x.amount || 0)));
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]); const maxC = cats[0]?.[1] || 1;
  return `<div class="head"><div><h1>Gestion Financière</h1><p>Comptabilité de l'élevage en Francs CFA (FCFA)</p></div><div class="actions"><button class="btn" data-act="newtx" data-v="out">Dépense</button><button class="btn pri" data-act="newtx" data-v="in">${ICON.plus}Recette</button></div></div>
  <div class="tiles"><div class="tile"><span class="l">Bénéfice net cumulé</span><span class="v ${inc - exp >= 0 ? "pos" : "neg"}" style="font-size:1.4rem">${inc - exp >= 0 ? "+" : "−"}${fcfa(Math.abs(inc - exp))}</span></div><div class="tile"><span class="l">Recettes totales</span><span class="v pos" style="font-size:1.4rem">${fcfa(inc)}</span></div><div class="tile"><span class="l">Dépenses totales</span><span class="v neg" style="font-size:1.4rem">${fcfa(exp)}</span></div></div>
  <div class="grid g2">
    <section class="card"><div class="row-h"><h2>Évolution (6 derniers mois)</h2><span class="actions"><span class="chip ok">Recettes</span><span class="chip bad">Dépenses</span></span></div>${monthChart()}</section>
    <section class="card"><div class="row-h"><h2>Répartition des charges</h2></div>${cats.length ? `<div class="list">${cats.map(([c, v]) => `<div class="li" style="flex-direction:column;align-items:stretch;gap:6px"><div style="display:flex;justify-content:space-between;gap:8px"><span class="t">${esc(c)}</span><b class="num">${fcfa(v)}</b></div><div class="bar"><i style="width:${(v / maxC) * 100}%;background:var(--clay)"></i></div></div>`).join("")}</div>` : `<p class="hint">Vos dépenses par poste apparaîtront dès la première saisie.</p>`}</section>
  </div>
  <section class="card"><div class="row-h"><h2>Journal des flux de trésorerie</h2><div class="seg" role="group">${[["all", "Toutes"], ["in", "Recettes"], ["out", "Dépenses"]].map(([v, l]) => `<button type="button" data-act="ui" data-k="txf" data-v="${v}" aria-pressed="${ui.txf === v}">${l}</button>`).join("")}</div></div>
    ${list.length ? `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th class="r">Montant</th><th></th></tr></thead><tbody>${list.map((x) => `<tr><td>${fmtDate(x.date)}</td><td>${esc(x.label || "")}</td><td><span class="chip">${esc(x.cat)}</span></td><td class="r ${x.type === "in" ? "pos" : "neg"}">${x.type === "in" ? "+" : "−"}${fcfa(x.amount)}</td><td class="r"><button class="btn sm ghost" data-act="del" data-kind="tx" data-id="${x.id}" aria-label="Supprimer">${ICON.trash}</button></td></tr>`).join("")}</tbody></table></div>` : emptyBox("coins", "Aucune transaction enregistrée", "Ventes d'animaux, achats d'aliments et intrants vétérinaires.")}
  </section>`;
};
function monthChart() {
  const W = 640, H = 220, L = 58, R = 10, T = 12, B = 28; const months = [];
  const d = new Date(); d.setDate(1);
  for (let i = 5; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); months.push({ k: `${x.getFullYear()}-${pad(x.getMonth() + 1)}`, l: MONTHS[x.getMonth()], i: 0, o: 0 }); }
  S.tx.forEach((t) => { const m = months.find((x) => t.date.startsWith(x.k)); if (m) m[t.type === "in" ? "i" : "o"] += Number(t.amount || 0); });
  const max = Math.max(...months.map((m) => Math.max(m.i, m.o)));
  if (!max) return `<p class="hint">Le graphique financier s'affichera dès vos premières entrées/sorties d'argent.</p>`;
  const mag = Math.pow(10, Math.floor(Math.log10(max))); const stepRaw = max / 4; const step = [1, 2, 2.5, 5, 10, 20, 25, 50].map((s) => s * mag / 10).find((s) => s >= stepRaw) || mag;
  const top = Math.ceil(max / step) * step; const Y = (v) => T + (1 - v / top) * (H - T - B); const cw = (W - L - R) / 6, bw = Math.min(22, cw / 3.2);
  const ticks = []; for (let v = 0; v <= top + 1e-6; v += step) ticks.push(v);
  const short = (v) => v >= 1e6 ? nf1.format(v / 1e6) + " M" : v >= 1e3 ? nf0.format(v / 1e3) + " k" : nf0.format(v);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Recettes et dépenses par mois">${ticks.map((v) => `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${short(v)}</text>`).join("")}
    ${months.map((m, i) => { const cx = L + cw * i + cw / 2; return `<rect x="${cx - bw - 2}" y="${Y(m.i)}" width="${bw}" height="${Y(0) - Y(m.i)}" rx="4" fill="var(--ok)"><title>${m.l} : ${fcfa(m.i)}</title></rect><rect x="${cx + 2}" y="${Y(m.o)}" width="${bw}" height="${Y(0) - Y(m.o)}" rx="4" fill="var(--bad)" fill-opacity=".8"><title>${m.l} : ${fcfa(m.o)}</title></rect><text x="${cx}" y="${H - 8}" text-anchor="middle">${m.l}</text>`; }).join("")}</svg>`;
}

/* ---------- PDF Export ---------- */
function exportHerdPDF() {
  try {
    const { jsPDF } = window.jspdf;
    if (!jsPDF) {
      toast("Chargement du générateur PDF... Veuillez patienter.");
      return;
    }
    const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const act = S.rabbits.filter(isActive);
    const males = act.filter((r) => r.sex === "Male").length;
    const fem = act.filter((r) => r.sex === "Female").length;
    const mature = act.filter((r) => age(r) >= MATURE_DAYS).length;
    const gest = S.matings.filter((m) => ["Accouplé", "Gestation confirmée"].includes(m.status));
    const fat = S.batches.filter((b) => b.status === "Actif").reduce((s, b) => s + (Number(b.current) || 0), 0);
    const stock = feedStock();
    const rt = ration();
    const m0 = today().slice(0, 7);
    const monthTx = S.tx.filter((x) => x.date.startsWith(m0));
    const bal = monthTx.reduce((s, x) => s + (x.type === "in" ? 1 : -1) * (Number(x.amount) || 0), 0);

    // Header banner
    doc.setFillColor(62, 90, 71);
    doc.rect(0, 0, 210, 32, "F");

    doc.setTextColor(255, 255, 255);
    doc.setFontSize(18);
    doc.setFont("helvetica", "bold");
    doc.text(`${userSession.farmName.toUpperCase()} • INVENTAIRE DU CHEPTEL`, 14, 16);

    doc.setFontSize(9);
    doc.setFont("helvetica", "normal");
    doc.text(`Registre Cunicole Officiel | Responsable : ${userSession.managerName} | Date : ${fmtDate(today())}`, 14, 25);

    // Summary block
    doc.setTextColor(36, 48, 42);
    doc.setFontSize(12);
    doc.setFont("helvetica", "bold");
    doc.text("1. Synthèse Globale de l'Élevage", 14, 42);

    const statsData = [
      ["Effectif reproducteur actif", `${act.length} sujets (${males} mâles ♂, ${fem} femelles ♀)`],
      ["Reproducteurs aptes (≥ 5 mois)", `${mature} sujets`],
      ["Gestations en cours", `${gest.length} portée(s) attendue(s)`],
      ["Lapins en engraissement", `${fat} lapereaux`],
      ["Stock d'aliment disponible", `${nf1.format(stock)} kg (${rt.grams ? Math.round(stock / (rt.grams / 1000)) : "—"} jours d'autonomie)`],
      ["Trésorerie mensuelle nette", `${bal >= 0 ? "+" : "−"}${fcfa(Math.abs(bal))}`]
    ];

    doc.autoTable({
      startY: 46,
      body: statsData,
      theme: "plain",
      styles: { fontSize: 9.5, cellPadding: 2.2, font: "helvetica" },
      columnStyles: { 0: { fontStyle: "bold", width: 70, textColor: [91, 104, 98] }, 1: { textColor: [36, 48, 42] } },
      margin: { left: 14, right: 14 }
    });

    // Rabbits inventory table
    const startRabbits = doc.lastAutoTable.finalY + 10;
    doc.setFontSize(12);
    doc.setFont("helvetica", "bold");
    doc.setTextColor(36, 48, 42);
    doc.text(`2. Fiches détaillées des reproducteurs (${act.length} sujets)`, 14, startRabbits);

    const rabbitsRows = act.map((r) => {
      const w = lastWeight(r.id);
      const g = gmq(r.id);
      return [
        r.name,
        r.sex === "Male" ? "Mâle" : r.sex === "Female" ? "Femelle" : "Indét.",
        r.breed || "—",
        r.cage || "—",
        fmtShort(r.birth),
        ageLabel(age(r)),
        w != null ? `${nf2.format(w)} kg` : "—",
        g != null ? `${Math.round(g)} g/j` : "—",
        r.status || "Actif"
      ];
    });

    doc.autoTable({
      startY: startRabbits + 4,
      head: [["Nom/Code", "Sexe", "Race", "Cage", "Naiss.", "Âge", "Dernier poids", "GMQ", "Statut"]],
      body: rabbitsRows.length ? rabbitsRows : [["Aucun lapin enregistré", "—", "—", "—", "—", "—", "—", "—", "—"]],
      theme: "striped",
      headStyles: { fillColor: [62, 90, 71], textColor: [255, 255, 255], fontStyle: "bold", fontSize: 8.5 },
      styles: { fontSize: 8, cellPadding: 2.2, font: "helvetica" },
      margin: { left: 14, right: 14 }
    });

    // Matings table
    if (gest.length > 0) {
      const startMatings = doc.lastAutoTable.finalY + 10;
      doc.setFontSize(12);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(36, 48, 42);
      doc.text("3. Suivi des gestations actives", 14, startMatings);

      const matingsRows = gest.map((m) => {
        const left = diff(today(), m.due);
        return [
          rname(m.female),
          rname(m.male),
          fmtDate(m.date),
          fmtDate(m.due),
          left >= 0 ? `Dans ${left} j` : `Retard ${-left} j`,
          m.status
        ];
      });

      doc.autoTable({
        startY: startMatings + 4,
        head: [["Femelle", "Mâle", "Date saillie", "Mise bas prévue", "Échéance", "Statut"]],
        body: matingsRows,
        theme: "striped",
        headStyles: { fillColor: [185, 95, 69], textColor: [255, 255, 255], fontStyle: "bold", fontSize: 8.5 },
        styles: { fontSize: 8, cellPadding: 2.2, font: "helvetica" },
        margin: { left: 14, right: 14 }
      });
    }

    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      doc.setFontSize(8);
      doc.setTextColor(150, 150, 150);
      doc.text(`${userSession.farmName} • Document officiel d'élevage • Page ${i} sur ${pageCount}`, 105, 290, { align: "center" });
    }

    const filename = `Inventaire_${userSession.farmName.replace(/\s+/g, '_')}_${today()}.pdf`;
    doc.save(filename);
    toast("Inventaire PDF téléchargé !");
  } catch (err) {
    console.error("PDF generation error:", err);
    toast("Erreur lors de la génération du PDF.");
  }
}

      if (ok) {
        closeModal();
        alertsCenterModal();
      }
    });
  }

  const btnTest = $("#btnTestNotif");
  if (btnTest) {
    btnTest.addEventListener("click", () => {
      sendOfflineNotification("ABV Farm • Test d'alerte hors-ligne", {
        body: "Le carillon et le système d'alerte fonctionnent parfaitement même sans Internet !",
        tag: "abv-test-" + Date.now()
      });
      toast("Alerte sonore et notification envoyées !");
    });
  }

  const pSound = $("#prefSound");
  const pVib = $("#prefVibrate");
  const pAuto = $("#prefAuto");
  const onPrefChange = () => {
    saveNotifPrefs({
      sound: pSound ? pSound.checked : true,
      vibrate: pVib ? pVib.checked : true,
      autoNotify: pAuto ? pAuto.checked : true
    });
  };
  if (pSound) pSound.addEventListener("change", onPrefChange);
  if (pVib) pVib.addEventListener("change", onPrefChange);
  if (pAuto) pAuto.addEventListener("change", onPrefChange);

function closeModal() { $("#modal").innerHTML = ""; document.body.style.overflow = ""; }
function sheet(title, body) {
  $("#modal").innerHTML = `<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh"><h2>${esc(title)}</h2><button class="btn ghost sm" data-act="close" aria-label="Fermer">${ICON.x}</button></div>${body}</div></div>`;
  document.body.style.overflow = "hidden";
}
function field(f, v) {
  const id = "f_" + f.k; const val = v ?? f.def ?? "";
  let input;
  if (f.type === "select") input = `<select id="${id}" name="${f.k}" ${f.req ? "required" : ""}>${f.opts.map((o) => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(val) ? "selected" : ""}>${esc(ol)}</option>`; }).join("")}</select>`;
  else if (f.type === "textarea") input = `<textarea id="${id}" name="${f.k}">${esc(val)}</textarea>`;
  else if (f.type === "check") return `<label class="check full"><input type="checkbox" id="${id}" name="${f.k}" ${val ? "checked" : ""}>${esc(f.label)}</label>`;
  else if (f.type === "html") return `<div class="full" id="${id}">${f.html || ""}</div>`;
  else input = `<input id="${id}" name="${f.k}" type="${f.type || "text"}" value="${esc(val)}" ${f.req ? "required" : ""} ${f.step ? `step="${f.step}"` : ""} ${f.min != null ? `min="${f.min}"` : ""} ${f.ph ? `placeholder="${esc(f.ph)}"` : ""}>`;
  return `<div class="field ${f.full ? "full" : ""}"><label for="${id}">${esc(f.label)}</label>${input}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ""}</div>`;
}
function form({ title, fields, values = {}, submit = "Enregistrer", onSubmit, onInput }) {
  sheet(title, `<form class="form" id="mform" novalidate>${fields.map((f) => field(f, values[f.k])).join("")}<div class="full actions" style="justify-content:flex-end"><button type="button" class="btn ghost" data-act="close">Annuler</button><button type="submit" class="btn pri">${esc(submit)}</button></div></form>`);
  const fm = $("#mform");
  const read = () => { const o = {}; fields.forEach((f) => { const el = fm.elements[f.k]; if (!el) return; o[f.k] = f.type === "check" ? el.checked : f.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value.trim(); }); return o; };
  if (onInput) { fm.addEventListener("input", () => onInput(read(), fm)); fm.addEventListener("change", () => onInput(read(), fm)); onInput(read(), fm); }
  fm.addEventListener("submit", async (e) => {
    e.preventDefault(); const v = read();
    const miss = fields.find((f) => f.req && (v[f.k] === "" || v[f.k] == null));
    if (miss) { toast(`Renseignez « ${miss.label} ».`); fm.elements[miss.k]?.focus(); return; }
    const btn = fm.querySelector('[type="submit"]'); btn.disabled = true;
    const ok = await onSubmit(v); btn.disabled = false;
    if (ok !== false) closeModal();
  });
  setTimeout(() => fm.querySelector("input:not([type=checkbox]),select")?.focus(), 30);
}

};

$("#importFile").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!Array.isArray(j.docs)) throw new Error("Format invalide");
    toast("Restauration en cours…");
    const n = await bulk(j.docs, "Import");
    toast(`${n} fiche(s) importée(s) avec succès`);
  } catch (err) {
    toast("Fichier invalide : choisissez une sauvegarde ABV Farm (.json)");
  }
});

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const f = A[el.dataset.act]; if (!f) return;
  if (el.dataset.act === "close" && el.tagName === "A") { closeModal(); return; }
  if (el.dataset.act !== "overlay") e.preventDefault();
  f(el, e);
});

document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#modal").innerHTML) closeModal(); });

/* ---------- Nettoyage dynamique du filigrane Netlify ---------- */
function purgeNetlifyWatermark() {
  const selectors = [
    'netlify-drawer',
    '[data-netlify-drawer]',
    '[data-netlify-badge]',
    '#netlify-badge',
    '.netlify-badge',
    'iframe[src*="netlify"]',
    'iframe[id*="netlify"]',
    '[id*="netlify-drawer"]',
    '[class*="netlify-drawer"]',
    '[id*="netlify-badge"]',
    '[class*="netlify-badge"]'
  ];
  selectors.forEach((sel) => {
    document.querySelectorAll(sel).forEach((el) => {
      try { el.remove(); } catch (e) { el.style.display = 'none'; }
    });
  });
}

try {
  const netlifyObserver = new MutationObserver(() => purgeNetlifyWatermark());
  netlifyObserver.observe(document.documentElement, { childList: true, subtree: true });
} catch (e) {}

window.addEventListener("DOMContentLoaded", purgeNetlifyWatermark);
window.addEventListener("load", purgeNetlifyWatermark);
setInterval(purgeNetlifyWatermark, 1000);

// Boot application
const initialDocs = Object.values(getLocalData());
ingest(initialDocs);
updateUserUI();
updateAlertBadges();
checkAndNotifyUrgentAlerts(false);
setInterval(() => checkAndNotifyUrgentAlerts(false), 15 * 60 * 1000);
initFirebaseSync();
</script>
