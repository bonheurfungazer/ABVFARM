details summary { list-style: none; }
/* Correctif captures : les icônes SVG des résumés repliables n'avaient aucune taille
   définie, elles s'affichaient donc en grand et déformaient les cartes
   « Répartition » et « Filtres précis » sur la page Lapins. */
details summary svg:not(.chevron-rot) { width: 20px; height: 20px; flex: none; }
details summary::-webkit-details-marker { display: none; }
.chevron-rot { transition: transform .22s cubic-bezier(0.4, 0, 0.2, 1); color: var(--muted); flex: none; }
details[open] > summary .chevron-rot { transform: rotate(180deg); color: var(--sage); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; font-weight: 800; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--sage); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } /* m104 : texte réservé aux lecteurs d'écran */
.num, .tab { font-variant-numeric: tabular-nums; }

.shell { display: grid; grid-template-columns: 1fr; min-height: 100%; }
.side { display: none; }
.mobile-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
.brand-logo { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; flex: none; background: #fff; border: 1.5px solid var(--line); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.brand-logo.sm { width: 34px; height: 34px; border-radius: 10px; }
.mobile-brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.mobile-brand b { font-family: var(--f-display); font-size: 1.05rem; line-height: 1.1; display: block; }
.mobile-brand small { color: var(--muted); font-size: 0.72rem; }

main { min-width: 0; padding-block: 20px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

@media (min-width: 900px) {
  .shell { grid-template-columns: 256px 1fr; }
  .mobile-header { display: none; }
  .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100dvh; overflow-y: auto; padding: 22px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); background: var(--surface); }
  main { padding-block: 28px 48px; padding-right: max(28px, env(safe-area-inset-right, 0px)); padding-left: 28px; }
  .bottom { display: none !important; }
}

.brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 16px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.brand-mark { width: 42px; height: 42px; border-radius: 12px; background: var(--hero); color: var(--hero-ink); display: grid; place-items: center; flex: none; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: .75rem; }
.nav-a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--muted); text-decoration: none; font-weight: 600; transition: background .12s ease, color .12s ease; }
.nav-a:hover { background: var(--surface-2); color: var(--ink); }
.nav-a[aria-current="page"] { background: var(--sage-soft); color: var(--sage-soft-ink); font-weight: 700; }
.nav-a svg { width: 20px; height: 20px; flex: none; }

/* User Account & Sync widget in Sidebar */
.side-account { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.user-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); cursor: pointer; text-decoration: none; color: inherit; transition: background .12s ease; border: 0; width: 100%; font: inherit; text-align: left; }
.user-card:hover { filter: brightness(0.97); }
.user-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--sage); color: var(--sage-ink); font-weight: 700; font-size: .85rem; display: grid; place-items: center; flex: none; overflow: hidden; }
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-meta { min-width: 0; flex: 1; }
.user-meta b { display: block; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.user-meta small { color: var(--muted); font-size: .72rem; display: flex; align-items: center; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 6px rgba(30,107,52,.4); }
.dot.offline { background: var(--warn); }
.dot.local { background: var(--info); }

.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); box-shadow: 0 -2px 10px rgba(0,0,0,.04); }
.bottom a, .bottom button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; text-decoration: none; color: var(--muted); font-size: .7rem; font-weight: 600; background: none; border: 0; cursor: pointer; }
.bottom .pill { width: 54px; height: 30px; display: grid; place-items: center; border-radius: 15px; transition: background .12s ease; }
.bottom [aria-current="page"] { color: var(--ink); }
.bottom [aria-current="page"] .pill { background: var(--sage-soft); color: var(--sage-soft-ink); }
.bottom svg { width: 21px; height: 21px; }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head p { color: var(--muted); margin-top: 2px; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card > .row-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .v { font-family: var(--f-display); font-size: 1.6rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .l { font-size: .78rem; color: var(--muted); font-weight: 600; }
.tile .s { font-size: .78rem; color: var(--muted); }
.tile.warn { background: var(--warn-soft); border-color: transparent; } .tile.warn .v { color: var(--warn); }
.tile.bad { background: var(--bad-soft); border-color: transparent; } .tile.bad .v { color: var(--bad); }
a.tile { text-decoration: none; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: border-color .15s, transform .1s; } /* Tuiles-liens de l'Accueil : toucher une tuile ouvre l'écran de détail correspondant. */
a.tile:hover { border-color: var(--sage); }
a.tile:active { transform: scale(.985); }
a.tile:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }
a.tile .l::after { content: " ›"; font-weight: 700; opacity: .55; }

.hero { background: var(--hero); color: var(--hero-ink); border-radius: var(--r-l); padding: 22px; display: grid; gap: 16px; grid-template-columns: 1fr; position: relative; overflow: hidden; }
.hero h1 { font-size: 1.9rem; }
.hero p, .hero .head p { color: inherit; opacity: .86; max-width: 60ch; }
.hero .meta { display: flex; gap: 8px; flex-wrap: wrap; }
.hero .chip { background: rgba(255,255,255,.14); color: var(--hero-ink); }
.hero svg.ears { position: absolute; right: -10px; bottom: -18px; width: 170px; opacity: .13; pointer-events: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 11px 14px; font-weight: 700; font-size: .9rem; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; white-space: nowrap; min-height: 44px; touch-action: manipulation; transition: background .12s ease, transform .08s ease; }
.btn:active { transform: scale(0.98); }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--sage); color: var(--sage-ink); border-color: transparent; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.clay { background: var(--clay); color: var(--surface); border-color: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 10px 11px; font-size: .8rem; border-radius: 10px; min-height: 44px; }
.btn svg { width: 17px; height: 17px; }
.hero .btn { background: var(--hero-ink); color: var(--hero); border-color: transparent; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: .74rem; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.m { background: var(--male-soft); color: var(--male); }
.chip.f { background: var(--female-soft); color: var(--female); }
.chip.clay { background: var(--clay-soft); color: var(--clay); }
.tag { font-family: var(--f-mono); font-size: .72rem; font-weight: 700; letter-spacing: .02em; border: 1.5px solid currentColor; border-radius: 5px; padding: 0 5px; color: var(--muted); white-space: nowrap; }

.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .t { font-weight: 600; }
.li .d { font-size: .82rem; color: var(--muted); }

.ico svg { width: 19px; height: 19px; }
.ico.ok { background: var(--ok-soft); color: var(--ok); } .ico.warn { background: var(--warn-soft); color: var(--warn); }
.ico.bad { background: var(--bad-soft); color: var(--bad); } .ico.info { background: var(--info-soft); color: var(--info); }
.ico.m { background: var(--male-soft); color: var(--male); } .ico.f { background: var(--female-soft); color: var(--female); }
.ico.clay { background: var(--clay-soft); color: var(--clay); }

.rcard { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; border-radius: var(--r-l); padding: 16px; border: 1px solid transparent; transition: transform .15s ease, box-shadow .15s ease; min-width: 0; }
.rcard:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.rcard.m { background: var(--male-soft); } .rcard.f { background: var(--female-soft); } .rcard.u { background: var(--surface-2); }

/* Filtres repensés (2026-11-04) : par défaut, une seule barre compacte —
   recherche + bouton Filtres. Tout le reste vit dans la feuille "Filtres",
   et seuls les filtres réellement actifs apparaissent, sous forme de
   pastilles supprimables. Plus de barre horizontale à défiler, plus de
   cartes de filtres permanentes. */
.filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.filter-btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 13px; min-height: 44px; font-weight: 700; font-size: .88rem; cursor: pointer; flex: none; white-space: nowrap; }
.filter-btn svg { width: 17px; height: 17px; }
.filter-btn .badge { background: var(--sage); color: #fff; min-width: 20px; height: 20px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; font-size: .72rem; font-weight: 800; }
.active-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

  try { const _pendNow = JSON.parse(localStorage.getItem(pendingSyncKey(uid)) || "[]"); if (Array.isArray(_pendNow) && !_pendNow.length) localStorage.removeItem(lastSyncErrorKey(uid)); } catch (e) {}
  /* Section 2 (S6) : premier snapshot serveur reçu — le jeu affiché n'est plus
     seulement local. Le sondage REST ne lit que le serveur, jamais un cache. */
  if (cloudFirstSnapshotPending) cloudFirstSnapshotPending = false;
  if (cloudLoginError) cloudLoginError = "";
  const all = getLocalData();
  let updated = false;
  let _seen = []; try { _seen = JSON.parse(localStorage.getItem(cloudIdsKey(uid)) || "[]"); } catch (e) {}
  const _cur = new Set(cloudDocs.filter((d) => d && d.kind && d.id).map((d) => d.kind + "-" + d.id));
  let _pend = []; try { _pend = JSON.parse(localStorage.getItem(pendingSyncKey(uid)) || "[]"); } catch (e) {}
  const _pendKeys = new Set(_pend.map((x) => x.kind + "-" + x.id));
  const _pendMap = {}; _pend.forEach((x) => { _pendMap[x.kind + "-" + x.id] = x; });
  for (const _key of _seen) {
    if (_cur.has(_key)) continue;
    const _kKind = _key.slice(0, _key.indexOf("-")); const _kId = _key.slice(_key.indexOf("-") + 1);
    if (_pendKeys.has(_key)) {
      /* C17 : fiche supprimée dans le cloud pendant que cet appareil
         éditait hors-ligne (entrée « set » en file) : tombstone + conflit,
         pour que le retry / la garde ne la ressuscitent pas au rejeu. */
      const _pl = _pendMap[_key];
      if (_pl && _pl.action === "set") { addTombstone(_kKind, _kId, new Date().toISOString(), uid); queueSyncConflict(_kKind, _kId, (_pl.doc && _pl.doc.updatedAt) || "", "", "set"); }
      continue;
    }
    if (all[_key]) { delete all[_key]; updated = true; addTombstone(_kKind, _kId, new Date().toISOString(), uid); }
  }
  /* C22 : cloudIds n'est PLUS écrit ici : il n'avance qu'après une
     persistance locale réussie (voir le bloc de persistance ci-dessous). */
  cloudDocs.forEach((d) => {
    if (d && d.kind && d.id) {
      const _key = d.kind + "-" + d.id;
      /* S3 — avant, le listener écrasait le local par le cloud dès que le
         cloud était plus récent, MÊME si une modification locale de cette
         fiche attendait dans la file : la modification locale était ensuite
         jetée par le retry (cloud >= local). Maintenant, une fiche en
         attente n'est JAMAIS écrasée par le listener : si le cloud est
         plus récent, c'est un conflit conservé + signalé, et la version
         locale reste en place jusqu'à résolution explicite. */
      if (_pendKeys.has(_key)) { const _pl = _pendMap[_key]; const _localTs = (_pl && ((_pl.doc && _pl.doc.updatedAt) || _pl.deletedAt)) || (all[_key] && all[_key].updatedAt) || ""; /* m94 : pour une suppression en attente, _pl.doc est absent et la fiche locale est déjà effacée : sans deletedAt, la comparaison était vide et le conflit suppression-vs-édition restait invisible. */ if (_localTs && d.updatedAt && syncArbTs(d) > syncTs(_localTs)) queueSyncConflict(d.kind, d.id, _localTs, d.updatedAt, (_pl && _pl.action) || "set"); return; }
      /* C17 : un tombstone local plus récent que la version cloud reçue
         signifie que la suppression connue ici gagne : on ne réinsère pas
         la fiche, le conflit est signalé. */
      const _tb = getTombstone(d.kind, d.id, uid);
      if (_tb && syncArbTs(d) && syncTs(_tb.deletedAt) >= syncArbTs(d)) { queueSyncConflict(d.kind, d.id, _tb.deletedAt, d.updatedAt || "", "delete"); return; }
      const _local = all[_key];
      /* C20 : supériorité STRICTE du cloud exigée (arbitrage sur le temps
         serveur quand il existe, C16) ; un horodatage absent d'un côté
         n'est plus un blanc-seing pour le cloud : conflit signalé, la
         version locale est conservée. */
      if (!_local) { all[_key] = d; updated = true; }
      else if (!syncTs(_local.updatedAt) || !syncArbTs(d)) { queueSyncConflict(d.kind, d.id, _local.updatedAt || "", d.updatedAt || "", "set"); }
      else if (syncArbTs(d) > syncTs(_local.updatedAt)) { all[_key] = d; updated = true; }
    }
  });
  /* C22 : cloudIds n'avance QU'APRÈS un setLocalData réussi. Avant, il
     était réécrit avant la persistance, dont l'échec (quota) était
     ignoré : l'état « déjà vu du cloud » avançait sans les données et
     les suppressions cloud n'étaient plus ré-appliquées correctement. */
  if (updated) { /* M91 : avant, tout snapshot (même sans changement) ré-ingérait et re-rendait tout le cheptel. Aucun changement effectif = on avance seulement cloudIds (branche else). */
    if (setLocalData(all)) {
      try { localStorage.setItem(cloudIdsKey(uid), JSON.stringify([..._cur])); } catch (e) {}
      ingest(Object.values(all));
    } else {
      try { localStorage.setItem(lastSyncErrorKey(uid), "stockage local indisponible (quota)"); } catch (e) {}
      console.warn("Listener : persistance locale impossible — cloudIds non avancé, le snapshot sera rejoué.");
    }
  } else {
    try { localStorage.setItem(cloudIdsKey(uid), JSON.stringify([..._cur])); } catch (e) {}
  }
  /* m95 : avant, lastSync avançait sur TOUT snapshot serveur, même sans
     changement et avec une file non vide (indicateur optimiste). Il
     n'avance que si la file de ce compte est vide. */
  if (!_pend.length) userSession.lastSync = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  updateUserUI();
  try { runDataRepairP3(); } catch (e) {} /* P3 : après une fusion cloud, tenter la migration de réparation (no-op si le marqueur du compte est déjà posé, ou si le jeu est encore vide). */
  try { runFinanceRepair(); } catch (e) {} /* FIN-REPAIR : même principe — rattacher achats et ventes au journal financier après une fusion cloud. */
}

function ensureCloudSyncListener(uid) {
  if (ABV_SHARED) return; /* consultation partagée : ne jamais fusionner MES données dans l'élevage consulté */
  if (unsubscribeSnapshot || !window.firebaseDb || !uid) {
    listenerLastEarlyReturn = { reason: unsubscribeSnapshot ? "déjà installée" : (!window.firebaseDb ? ("no-db" + (window.firebaseDbError ? ": " + window.firebaseDbError : "")) : "no-uid"), at: Date.now() };
    return;
  }
  /* Section 2 (S6, complément) : couvre aussi la restauration de session au
     rechargement, qui passe ici sans repasser par handleUserAuthenticated : tant
     que cloudSyncActive est faux, aucun snapshot serveur n'est encore arrivé. */
  if (!cloudSyncActive) cloudFirstSnapshotPending = true;
  /* Volet C : nouvelle génération pour cette installation ; les rappels des
     installations précédentes seront ignorés silencieusement. */
  listenerGeneration += 1;
  const _listenerGen = listenerGeneration;
  listenerUid = uid;
  try {
    let _pollTimer = null;
    let _pollBusy = false;
    /* Sondage REST (2026-11-08) : remplace l'ancien écouteur temps réel du
       SDK, dont le canal est coupé par les réseaux intermédiaires. Cycle
       immédiat à l'installation, puis toutes les 45 s tant que l'écoute est
       installée. unsubscribeSnapshot conserve le contrat d'arrêt des
       appelants : l'invoquer stoppe le sondage (clearInterval). */
    const _poll = async () => {
      if (_listenerGen !== listenerGeneration) return;
      if (_pollBusy) return;
      _pollBusy = true;
      try {
        const _docs = await fsRunQueryCheptel(uid);
        if (_listenerGen !== listenerGeneration) return;
        processCloudSnapshotDocs(_docs, uid);
      } catch (err) {
        if (_listenerGen !== listenerGeneration) return;
        console.warn("Cloud poll notice:", err);
        /* Une erreur de sondage ne fait pas passer le jeu local pour
           synchronisé ; l'indicateur reste en erreur, comme avec l'ancien
           gestionnaire d'erreur de l'écouteur. Le sondage n'est PAS arrêté
           pour autant : les erreurs réseau sont transitoires et le cycle
           suivant réessaie. */
        cloudLoginError = (err && (err.code || err.message)) || "erreur de synchronisation cloud";
        try { localStorage.setItem(lastSyncErrorKey(), cloudLoginError); } catch (e2) {}
        setListenerLastError(cloudLoginError);
        listenerAttempts += 1;
        updateUserUI();
      } finally { _pollBusy = false; }
    };
    unsubscribeSnapshot = () => { if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; } };
    _poll();
    _pollTimer = setInterval(_poll, 45000);
    listenerInstalledAt = Date.now();
    /* Volet C : chien de garde à 30 s après cette installation réussie. */
    armListenerWatchdog(_listenerGen, listenerLastServerAt, listenerCacheCount);
  } catch (e) {
    console.warn("Cloud listener error:", e);
    cloudLoginError = e.code || e.message || "erreur de synchronisation cloud";
    try { localStorage.setItem(lastSyncErrorKey(), cloudLoginError); } catch (e2) {}
    setListenerLastError(cloudLoginError);
    updateUserUI();
  }
}

async function handleUserAuthenticated(user, msg) {
  if (unsubscribeSnapshot) {
    try { unsubscribeSnapshot(); } catch (e) {}
    unsubscribeSnapshot = null;
  }
  /* Volet C : annule les timers en vol avant la réinstallation de fin de fonction. */
  cancelListenerTimers();
  listenerAttempts = 0; listenerStopped = false; /* m5 : nouvelle connexion = compteur d'écoute neuf. */

  // 1. Récupérer les données existantes avant de basculer
  /* C3 : identité AVANT bascule, mémorisée avant toute mutation de userSession.
     Le secours « mémoire vive » ci-dessous ne doit migrer S que si S appartient
     à l'invité ou à un profil local ; si S est le cheptel d'un AUTRE compte
     Firebase (bascule directe A -> B sans déconnexion), le recopier puis le
     pousser ferait atterrir les données de A dans le cloud de B. Dans ce cas,
     seule la clé invité explicite ci-dessous est migrée. */
  const _prevUid = (userSession.isLoggedIn && userSession.uid) || null;
  const _prevIsGuestOrLocal = !_prevUid || String(_prevUid).startsWith("local_");
  const guestKey = "abvfarm_data_guest";
  let guestData = {};
  try {
    guestData = JSON.parse(localStorage.getItem(guestKey) || "{}");
    if (!Object.keys(guestData).length) {
      guestData = JSON.parse(localStorage.getItem(LS_DATA_KEY) || "{}");
    }
  } catch (e) {}

  /* M98 : lire EXPLICITEMENT la clé du profil local sortant — avant, ses
     données n'étaient migrées que par accident, si elles étaient encore en
     mémoire vive. Les clés déjà présentes (invité explicite) gardent la
     priorité, le profil local ne comble que les manques. */
  if (_prevUid && String(_prevUid).startsWith("local_")) {
    try { const _localOut = JSON.parse(localStorage.getItem("abvfarm_data_user_" + _prevUid) || "{}"); if (_localOut && typeof _localOut === "object" && !Array.isArray(_localOut)) { for (const [_lk, _lv] of Object.entries(_localOut)) { if (!(_lk in guestData)) guestData[_lk] = _lv; } } } catch (e) {}
  }

  // Préserver les données en mémoire vive si présentes (invité / profil local uniquement — voir C3)
  if (S && Object.keys(guestData).length === 0 && _prevIsGuestOrLocal) {
    const memDocs = [
      ...S.rabbits.map(x => ({ ...x, kind: 'rabbit' })),
      ...S.matings.map(x => ({ ...x, kind: 'mating' })),
      ...S.treatments.map(x => ({ ...x, kind: 'treatment' })),
      ...S.weights.map(x => ({ ...x, kind: 'weight' })),
      ...S.feed.map(x => ({ ...x, kind: 'feed' })),
      ...S.inventory.map(x => ({ ...x, kind: 'inventory' })),
      ...S.reminders.map(x => ({ ...x, kind: 'reminder' })),
      ...S.batches.map(x => ({ ...x, kind: 'batch' })),
      ...S.tx.map(x => ({ ...x, kind: 'tx' })),
      ...(S.cages || []).map(x => ({ ...x, kind: 'cage' })) /* m4 : les cages étaient le seul type oublié (9 migrés sur 10). */
    ];
    memDocs.forEach(d => { if (d.id) guestData[d.kind + '-' + d.id] = d; });
  }

  /* S4 : cles invite a effacer APRES confirmation (voir fin de l'etape 4). On ne
     supprime rien ici : la fusion locale puis cloud n'a pas encore eu lieu. */
  const _guestKeys = Object.keys(guestData);

  // 2. Basculer l'identité sur l'UID connecté
  userSession.isLoggedIn = true;
  userSession.isLocalProfile = false;
  userSession.authProvider = (user.providerData && user.providerData[0] && user.providerData[0].providerId) || (user.email ? "password" : "custom");
  userSession.uid = user.uid;
  userSession.email = user.email || userSession.email;
  userSession.managerName = user.displayName || userSession.managerName || (user.email ? user.email.split("@")[0] : "Éleveur");
  userSession.photoUrl = user.photoURL || null;
  saveUserSession(userSession);
  migrateLegacyGlobalKeys(); /* C4 : les anciennes clés globales (corbeille / journal / conflits) partent sous ce compte. */
  if (msg) toast(msg);

  // 3. Charger les données locales de l'utilisateur ou migrer les données existantes
  let userLocalData = getLocalData();
  if (Object.keys(userLocalData).length === 0 && Object.keys(guestData).length > 0) {
    userLocalData = { ...guestData };
    setLocalData(userLocalData);
  } else if (Object.keys(guestData).length > 0) {
    userLocalData = { ...guestData, ...userLocalData };
    setLocalData(userLocalData);
  }

  // Afficher immédiatement les données dans l'application
  /* Section 2 (S6) : à ce stade seul le jeu local est affiché ; la fusion cloud
     n'a pas encore eu lieu. L'indicateur reste visible jusqu'au premier snapshot
     serveur (voir ensureCloudSyncListener), il ne présente pas ce jeu comme définitif. */
  cloudFirstSnapshotPending = true;
  cloudSnapshotEver = false;
  cloudSyncActive = false;
  cloudLoginError = "";
  /* Volet B : listenerLastError n'est PAS effacé ici — seule une snapshot
     serveur réussie l'efface (voir ensureCloudSyncListener). */
  ingest(Object.values(userLocalData));
  updateUserUI();

  // 4. Synchroniser avec Cloud Firestore
  if (window.firebaseDb && user.uid) {
    // Créer ou mettre à jour le profil utilisateur
    /* m15 : createdAt n'est écrit qu'à la CRÉATION du profil — avant, le
       set(merge) le réécrivait avec serverTimestamp() à chaque connexion,
       donc la « date de création » du compte changeait à chaque login. */
    (async () => {
      try {
        /* REST : pas d'équivalent direct de l'ancien set(merge) — on relit le
           profil existant, on fusionne en JS (createdAt seulement s'il est
           absent, comme avant), puis on réécrit le document complet. */
        const _profEx = await fsGetProfile(user.uid);
        const _prof = {
          ...(_profEx || {}),
          userId: user.uid,
          email: user.email || "",
          displayName: String(userSession.managerName || "").slice(0, 200),
          farmName: String(userSession.farmName || "ABV Farm").slice(0, 200),
          updatedAt: new Date().toISOString()
        };
        if (!_profEx) _prof.createdAt = new Date().toISOString();
        await fsSetProfile(user.uid, _prof);
      } catch (err) { console.warn("UserProfile sync notice:", err); }
    })();

    // Sauvegarder les fiches existantes dans le cloud Firestore
    const docsToPush = Object.values(userLocalData);
    if (docsToPush.length > 0) {
      let _cloudMap = null; let _cloudReadErr = null; let _seenSet = new Set();
      try { const _docs = await fsRunQueryCheptel(user.uid); _cloudMap = {}; _docs.forEach((_cd) => { if (_cd && _cd.kind && _cd.id) _cloudMap[_cd.kind + "-" + _cd.id] = _cd.updatedAt || ""; }); } catch (e) { _cloudMap = null; _cloudReadErr = e; }
      try { _seenSet = new Set(JSON.parse(localStorage.getItem(cloudIdsKey()) || "[]")); } catch (e) {}
      /* Fusion sections 2+3 : si la lecture serveur a échoué, _cloudMap est null et l'état
         du cloud est INCONNU. On ne pousse RIEN (version section 3 ci-dessous, en else) :
         on met en file les fiches d'origine, sans re-horodatage, via la file namespacée
         de la section 3, on enregistre l'erreur (clé namespacée), on affiche un état honnête. */
      if (_cloudMap === null) {
        cloudLoginError = (_cloudReadErr && (_cloudReadErr.code || _cloudReadErr.message)) || "lecture serveur impossible";
        try { localStorage.setItem(lastSyncErrorKey(), cloudLoginError); } catch (e2) {}
        docsToPush.forEach((d) => { if (d && d.kind && d.id) queuePendingSync({ action: "set", kind: d.kind, id: d.id, doc: cleanForCloud(d) }); });
        toast("⚠️ Cloud non vérifié à la connexion : aucune fiche poussée, vos données locales sont conservées et seront renvoyées plus tard.");
        updateUserUI();
      } else {
      const _pushResults = docsToPush.map((d) => {
        if (d && d.kind && d.id) {
          const _key = d.kind + "-" + d.id;
          /* Correctif synchro constante (2026-11-02) : à la connexion, ne pas écraser
             une fiche cloud plus récente (ex. correction faite depuis un autre appareil)
             par la version locale plus ancienne, sinon les corrections sont perdues à
             chaque ouverture de l'appli. Si le cloud a déjà vu cette fiche et qu'elle
             n'y est plus, c'est une suppression cloud, on ne la ressuscite pas. */
          if (_cloudMap) {
            if (_cloudMap[_key] && d.updatedAt && syncTs(_cloudMap[_key]) >= syncTs(d.updatedAt)) return Promise.resolve("skipped"); /* M49 : comparaison via syncTs (ms), pas en chaînes brutes. */
            if (!_cloudMap[_key] && _seenSet.has(_key)) return Promise.resolve("skipped");
          }
          /* M89 : conserver l'updatedAt D'ORIGINE au push de connexion — avant,
             il était réécrit à « maintenant » : une vieille copie locale
             devenait imbattable pour les autres appareils. Le temps serveur
             (withServerTs) porte l'arbitrage, pas un faux horodatage local. */
          return fsSetCheptelDoc(user.uid, _key, withServerTs(cleanForCloud({ ...d }))).then(() => { clearPendingFor(d.kind, d.id); return "pushed"; }).catch((err) => { console.warn("Push doc notice:", err); queuePendingSync({ action: "set", kind: d.kind, id: d.id, doc: cleanForCloud({ ...d }) }); return "failed"; });
        }
        return Promise.resolve("skipped");
      });
      /* S4 : effacer la cle invite SEULEMENT quand la fusion est confirmee, sinon
         une prochaine connexion re-fusionnerait les anciennes fiches invite (dont
         celles supprimees du cloud) et les ressusciterait. Confirmation = chaque
         fiche d'origine invite est poussee, ou ecartée a raison (cloud plus recent
         ou deja vu puis supprime du cloud), ET chaque cle invite est relue sous
         la cle utilisateur. Un seul echec invite => on garde la cle invite (les
         fiches en echec sont deja en file namespacee) pour une re-fusion ulterieure.
         On efface aussi la cle historique LS_DATA_KEY : sinon getLocalData /
         handleUserAuthenticated la reliraient comme invite au prochain login. */
      Promise.allSettled(_pushResults).then((_results) => {
        if (!userSession.isLoggedIn || userSession.uid !== user.uid) return;
        let _guestFailed = false;
        _results.forEach((_r, _i) => {
          const _d = docsToPush[_i];
          if (_d && _d.kind && _d.id && _guestKeys.includes(_d.kind + "-" + _d.id) && (_r.status !== "fulfilled" || _r.value === "failed")) _guestFailed = true;
        });
        if (_guestFailed) return;
        let _mergedOk = true;
        try { const _check = getLocalData(); for (const _k of _guestKeys) { if (!_check[_k]) { _mergedOk = false; break; } } } catch (e) { _mergedOk = false; }
        if (_mergedOk) { try { localStorage.removeItem(guestKey); localStorage.removeItem(LS_DATA_KEY); } catch (e) {} }
      });
      } /* fin else Section 2 (S2) : push normal uniquement si la lecture serveur a réussi */
    }

    // Écouter les mises à jour cloud en temps réel
    ensureCloudSyncListener(user.uid);
  }

  /* S4 (hors-ligne / base non initialisee) : aucune confirmation cloud n'est
     possible a ce login. La fusion locale verifiee suffit a effacer la cle invite,
     car les fiches restent sous la cle utilisateur et seront poussees a la prochaine
     connexion / Synchroniser ; on les met en plus en file namespacee pour que le
     rattrapage les envoie des le retour du cloud. Sans cette branche, un login
     hors-ligne n'effacait jamais la cle invite. */
  if (!window.firebaseDb && _guestKeys.length) {
    let _mergedOk = true;
    try { const _check = getLocalData(); for (const _k of _guestKeys) { if (!_check[_k]) { _mergedOk = false; break; } } } catch (e) { _mergedOk = false; }
    if (_mergedOk && userSession.isLoggedIn && userSession.uid === user.uid) {
      for (const _k of _guestKeys) { const _d = userLocalData[_k]; if (_d && _d.kind && _d.id) queuePendingSync({ action: "set", kind: _d.kind, id: _d.id, doc: cleanForCloud(_d) }); }
      try { localStorage.removeItem(guestKey); localStorage.removeItem(LS_DATA_KEY); } catch (e) {}
    }
  }
}

// Network events
window.addEventListener("online", () => {
  isOnline = true;
  /* C25 : si Firebase n'a jamais pu demarrer (premier lancement hors-ligne,
     SDK non charge), le retour du reseau le reinitialise — avant, seuls le
     retry et le listener etaient relances, la synchro restait morte jusqu'au
     rechargement manuel. Garde : uniquement si firebaseAuth est absent, donc
     aucun risque de double initialisation ni de double ecouteur d'auth. */
  if (!window.firebaseAuth) { try { initFirebaseSync(); } catch (e) { console.warn("Reinitialisation Firebase au retour du reseau impossible :", e); } }
  toast("Connexion Internet rétablie. Synchronisation active.");
  updateUserUI();
  retryPendingSync();
  /* Volet C : réinstallation gardée (ne réinstalle jamais si currentUser null
     ou uid différent ; l'early-return bloque si déjà installée). */
  const _onlineUid = (userSession.isLoggedIn && userSession.uid) || (window.firebaseAuth && window.firebaseAuth.currentUser && window.firebaseAuth.currentUser.uid);
  if (_onlineUid && canReinstallListener(_onlineUid)) ensureCloudSyncListener(_onlineUid);
});
window.addEventListener("offline", () => {
  isOnline = false;
  toast("Mode Hors-Ligne : vos données continuent d'être enregistrées en local.");
  updateUserUI();
});
/* M96 : reprise au retour au premier plan — avant, seuls les événements réseau
   relançaient la synchro ; après une longue veille avec l'app ouverte, rien ne
   rejouait la file ni ne vérifiait l'écoute au retour. */
document.addEventListener("visibilitychange", () => { if (!document.hidden) { isOnline = navigator.onLine; if (isOnline && !window.firebaseAuth) { try { initFirebaseSync(); } catch (e) {} } if (isOnline) retryPendingSync(); const _vUid = (userSession.isLoggedIn && userSession.uid) || null; if (_vUid && canReinstallListener(_vUid)) ensureCloudSyncListener(_vUid); } });
window.addEventListener("pageshow", () => { if (navigator.onLine) retryPendingSync(); });
/* m98 : rejeu périodique de la file (5 min) — un échec transitoire en restant
   en ligne ne bloque plus la file jusqu'à la prochaine sauvegarde, bascule
   réseau ou clic manuel. retryPendingSync est verrouillé (anti-rafale). */
setInterval(() => { if (isOnline && userSession.isLoggedIn) retryPendingSync(); }, 5 * 60 * 1000);

function updateUserUI() {
  const nameEl = $("#userName");
  const avatarEl = $("#userAvatar");
  const avatarHeaderEl = $("#userAvatarHeader");
  const syncEl = $("#userSyncStatus");
  const mobSub = $("#mobileSyncSub");

  const displayName = userSession.farmName || userSession.managerName || "ABV Farm";
  const initial = displayName.charAt(0).toUpperCase();

  if (nameEl) nameEl.textContent = displayName;
  if (avatarEl) {
    if (userSession.photoUrl) {
      avatarEl.innerHTML = `<img src="${esc(safeHttpsUrl(userSession.photoUrl))}" alt="Avatar" referrerpolicy="no-referrer">`;
    } else {
      avatarEl.textContent = initial;
    }
  }
  if (avatarHeaderEl) {
    if (userSession.photoUrl) {
      avatarHeaderEl.innerHTML = `<img src="${esc(safeHttpsUrl(userSession.photoUrl))}" alt="Avatar" style="width:100%;height:100%;border-radius:50%;object-fit:cover" referrerpolicy="no-referrer">`;
    } else {
      avatarHeaderEl.textContent = initial;
    }
  }

  let statusHtml = "";
  let subText = "";

  if (userSession.isLoggedIn) {
    const provName = userSession.isLocalProfile ? "Mode Local" : (userSession.authProvider === "google.com" ? "Google Cloud" : "Email Cloud");
    if (userSession.isLocalProfile) {
      statusHtml = `<span class="dot local"></span><span>Profil local (${esc(userSession.email || "actif")})</span>`;
      subText = "Mode local • Enregistré";
    } else if (!cloudSnapshotEver) {
      /* Section 2 (S6) : tant que le premier snapshot serveur n'est pas arrivé, le
         jeu affiché est le jeu local seul — il ne doit pas s'afficher « Synchronisé ».
         Plan B (2026-11-04) : la pastille utilise cloudSnapshotEver, vrai uniquement
         après un snapshot serveur et jamais remis à faux par une navigation, au lieu
         de cloudFirstSnapshotPending qui repassait à vrai après navigation et figeait
         la pastille. Une fois le premier snapshot reçu, on retombe sur le statut
         honnête getSyncStatus() ci-dessous, comme l'écran Compte et la vue Données. */
      statusHtml = `<span class="dot offline"></span><span style="color:var(--warn)">Fusion cloud en attente${cloudLoginError ? " — échec de lecture cloud" : ""}</span>`;
      subText = listenerStopped ? "Données locales affichées • Écoute arrêtée"
        : (listenerLastError ? `Données locales affichées • Erreur d'écoute : ${listenerLastError.text}`
        : (listenerCacheCount > 0 ? `Données locales affichées • ${listenerCacheCount} instantané(s) cache, 0 serveur`
        : (listenerLastEarlyReturn ? `Données locales affichées • Écoute absente (${listenerLastEarlyReturn.reason})`
        : (cloudLoginError ? "Données locales affichées • Envoi cloud en attente" : "Données locales affichées • Fusion cloud en attente"))));
    } else if (isOnline) {
      /* S3 — statut honnête : l'ancien affichage disait « Synchronisé » dès
         que connecté + en ligne, même avec une file non vide ou un échec.
         Maintenant la file, les conflits et la dernière erreur priment. */
      const _st = getSyncStatus();
      if (_st.conflicts > 0) {
        statusHtml = `<span class="dot offline"></span><span style="color:var(--warn)">${provName} · ${_st.conflicts} conflit(s) à résoudre</span>`;
        subText = `${_st.conflicts} conflit(s) • voir Données & Export`;
      } else if (_st.pending > 0) {
        statusHtml = `<span class="dot local"></span><span style="color:var(--warn)">${provName} · ${_st.pending} fiche(s) en attente</span>`;
        subText = `${_st.pending} fiche(s) en attente${_st.lastError ? " • dernière erreur : " + _st.lastError : ""}`;
      } else if (_st.lastError) {
        statusHtml = `<span class="dot local"></span><span style="color:var(--warn)">${provName} · Synchronisation en échec</span>`;
        subText = `Dernière erreur : ${_st.lastError}`;
      } else {
        statusHtml = `<span class="dot on"></span><span style="color:var(--ok)">${provName} Synchronisé</span>`;
        subText = `${provName} actif`;
      }
    } else {
      /* m108 : avant, ce statut masquait l'identité du compte et la file
         d'attente hors-ligne, et contredisait l'écran Compte. */
      const _stOff = getSyncStatus();
      statusHtml = `<span class="dot offline"></span><span style="color:var(--warn)">Hors-ligne · ${esc(userSession.email || provName)}${_stOff.pending ? ` · ${_stOff.pending} en attente` : ""}${_stOff.conflicts ? ` · ${_stOff.conflicts} conflit(s)` : ""}</span>`;
      subText = `Hors-ligne • Enregistré${_stOff.pending ? ` • ${_stOff.pending} fiche(s) en attente d'envoi` : ""}`;
    }
  } else {
    statusHtml = isOnline 
      ? `<span class="dot local"></span><span>Stockage local actif</span>`
      : `<span class="dot offline"></span><span>Mode Hors-ligne</span>`;
    subText = "Élevage cunicole pro";
  }

  if (syncEl) syncEl.innerHTML = statusHtml;
  if (mobSub) mobSub.textContent = subText;
  /* Correctif cosmétique (2026-11-04) : la ligne « Écoute cloud » de l'accueil
     vit dans #main, que updateUserUI() ne re-rendait jamais — elle restait figée
     au premier render(). Mise à jour par textContent uniquement (listenerStatusText
     ne retourne que du texte brut), sans render() : ni fermeture de modale, ni
     perte de défilement. Les deux branches d'accueil sont exclusives, donc cet
     identifiant n'existe qu'une fois dans le DOM à la fois. */
  const homeListenerEl = $("#homeListenerStatus");
  if (homeListenerEl) homeListenerEl.textContent = `Écoute cloud : ${listenerStatusText()}`;
  /* Même motif pour la sonde : updateUserUI() ne re-rend pas #main, donc la
     ligne de sonde de Données n'affichait « vérification en cours… » qu'après
     navigation/rechargement. Mise à jour par textContent du seul <span>. */
  const probeEl = $("#probeServerStatus");
  if (probeEl) probeEl.textContent = probeLineText();
}

/* ---------- Google & Email Authentication Layer ---------- */
function getGoogleProvider(forceSelect = false) {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.addScope("profile");
  provider.addScope("email");
  if (forceSelect) {
    provider.setCustomParameters({
      prompt: "select_account"
    });
  }
  return provider;
}

function handleAuthError(err) {
  if (!err) return;
  console.error("Auth notice/error:", err);

  const diag = $("#authDiagnosticBox");
  let msg = "Impossible de se connecter avec Google.";
  let detail = err.message || err.code || "";

  if (err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request") {
    if (diag) {
      diag.style.display = "block";
      diag.innerHTML = `
        <div style="font-weight:700;margin-bottom:6px">La fenêtre pop-up Google s'est refermée ou a été bloquée.</div>
        <div style="margin-bottom:8px"><b>Solution PWA :</b> Utilisez le bouton blanc officiel Google en haut (Google One-Tap direct sans pop-up), ou la connexion par e-mail dans le 1er onglet.</div>
      `;
    }
    toast("Pop-up fermée. Utilisez le bouton officiel Google ou la connexion par e-mail.");
    return;
  }

  if (err.code === "auth/popup-blocked") {
    msg = "La fenêtre pop-up Google a été bloquée par votre navigateur.";
    if (diag) {
      diag.style.display = "block";
      diag.innerHTML = `<b>Pop-up bloquée :</b> Votre navigateur ou smartphone a bloqué la fenêtre pop-up Google.<br>Utilisez le bouton officiel blanc ci-dessus ou basculez sur l'onglet <b>Par Email</b>.`;
    }
    toast(msg);
    return;
  }

  if (err.code === "auth/unauthorized-domain") {
    const currentHost = window.location.hostname || "domaine actuel";
    msg = `Domaine Firebase à vérifier : ${currentHost}`;
    if (diag) {
      diag.style.display = "block";
      diag.innerHTML = `<b>Domaine :</b> Si votre domaine est déjà renseigné dans Firebase, vérifiez qu'il correspond exactement à <code>${esc(currentHost)}</code> (sans https:// ni / à la fin).<br><span style="font-size:0.8rem;color:var(--muted)">Vos données d'élevage sont conservées et 100% sécurisées sur cet appareil.</span>`;
    }
    unauthorizedDomainModal();
    return;
  }

  if (err.code === "auth/operation-not-allowed") {
    msg = "Le fournisseur Google n'est pas activé dans la console Firebase (Authentication > Sign-in method > Google > Activer).";
  } else if (err.code === "auth/network-request-failed") {
    msg = "Erreur de réseau : vérifiez votre connexion Internet.";
  } else if (detail) {
    msg = "Notice Google : " + detail;
  }

  if (diag) {
    diag.style.display = "block";
    diag.textContent = msg;
  }
  toast(msg);
}

function signInWithGoogle(mode = "auto", forceSelect = false) {
  if (!window.firebaseAuth) {
    if (typeof firebase !== "undefined" && firebase.auth) {
      initFirebaseSync();
    }
  }
  if (!window.firebaseAuth) {
    toast("Service Firebase en cours de chargement... Réessayez dans un instant.");
    return;
  }

  const provider = getGoogleProvider(forceSelect);

  if (mode === "redirect") {
    try {
      sessionStorage.setItem("abv_auth_pending", "google");
      localStorage.setItem("abv_auth_pending_time", Date.now().toString());
    } catch(e) {}
    toast("Redirection vers Google en cours…");
    window.firebaseAuth.signInWithRedirect(provider).catch((err) => {
      sessionStorage.removeItem("abv_auth_pending");
      localStorage.removeItem("abv_auth_pending_time");
      handleAuthError(err);
    });
    return;
  }

  toast("Connexion avec Google en cours…");
  let popupFinished = false;
  const timeoutId = setTimeout(() => {
    if (!popupFinished && !userSession.isLoggedIn) {
      const diag = $("#authDiagnosticBox");
      if (diag) {
        diag.style.display = "block";
        diag.innerHTML = `
          <div style="font-weight:700;margin-bottom:6px">⚠️ Information Mobile & PWA :</div>
          <div style="font-size:0.83rem;line-height:1.4">
            Sur mobile Android, Chrome isole les fenêtres pop-up et bloque la transmission du compte vers l'application.<br><br>
            <b>Solutions directes :</b><br>
            • Utilisez l'onglet <b>« Par Email »</b> (100% garanti sur mobile PWA)<br>
            • Ou autorisez votre URL dans Google Cloud pour utiliser le bouton Google 1-clic direct ci-dessus.
          </div>
        `;
      }
    }
  }, 12000);

  window.firebaseAuth.signInWithPopup(provider).then(async (result) => {
    popupFinished = true;
    clearTimeout(timeoutId);
    if (result && result.user) {
      /* m3 : attendre la fin de handleUserAuthenticated avant de fermer la
         modale — avant, elle se fermait pendant la migration/synchro et des
         états transitoires (cheptel invité, indicateurs) restaient visibles. */
      await handleUserAuthenticated(result.user, `Connecté avec Google : ${result.user.displayName || result.user.email}`);
      closeModal();
    }
  }).catch((err) => {
    popupFinished = true;
    clearTimeout(timeoutId);
    handleAuthError(err);
  });
}

/* m18 : GIS ne doit être initialisé qu'une fois par session — avant,
   renderGoogleSignInButton() ré-initialisait GIS à chaque bascule d'onglet
   et ré-affichait le bouton sans vider le conteneur (boutons empilés). */
let _gisInitDone = false;
function renderGoogleSignInButton(containerId = "g_id_signin_container") {
  const container = document.getElementById(containerId);
  if (!container) return;

  if (window.google && window.google.accounts && window.google.accounts.id) {
    container.dataset.gisAttempt = "0";
    try {
      if (!_gisInitDone) { _gisInitDone = true;
      google.accounts.id.initialize({
        client_id: "921975845975-snhp3hpml9kngq6vlij40blhanb3n167.apps.googleusercontent.com",
        callback: (res) => {
          if (res && res.credential) {
            toast("Authentification Google sécurisée…");
            if (window.firebaseAuth && typeof firebase !== "undefined") {
              const cred = firebase.auth.GoogleAuthProvider.credential(res.credential);
              window.firebaseAuth.signInWithCredential(cred).then(async (result) => {
                if (result && result.user) {
                  await handleUserAuthenticated(result.user, `Connecté avec Google : ${result.user.displayName || result.user.email}`); /* m3 */
                  closeModal();
                }
              }).catch((err) => {
                handleAuthError(err);
              });
            } else {
              /* M1 : avant, Firebase non prêt = callback muet (ni toast, ni diagnostic). */
              toast("Connexion Google impossible : Firebase n'est pas encore chargé. Réessayez ou utilisez l'onglet e-mail.");
              const _diagM1 = $("#googleDiagResultBox") || $("#authEmailDiagnosticBox");
              if (_diagM1) { _diagM1.style.display = "block"; _diagM1.innerHTML = "<b>Firebase non prêt</b> — rechargez la page, ou connectez-vous par e-mail (onglet e-mail)."; }
            }
          } else {
            /* M1 : aucun credential reçu = échec silencieux avant ce correctif. */
            toast("Connexion Google interrompue : aucun jeton reçu. Réessayez ou utilisez l'onglet e-mail.");
            const _diagM1b = $("#googleDiagResultBox") || $("#authEmailDiagnosticBox");
            if (_diagM1b) { _diagM1b.style.display = "block"; _diagM1b.innerHTML = "<b>Aucun jeton Google reçu</b> — réessayez la connexion Google, ou utilisez l'onglet e-mail."; }
          }
        },
        auto_select: false,
        use_fedcm_for_prompt: true
      });
      }
      /* C29 : largeur responsive — avant 280 px fixes, deborde/tronque sur
         les telephones <= 360 px. On borne par la largeur reelle du
         conteneur (repli sur la fenetre si le conteneur est masque). */
      const _gisWidth = Math.max(160, Math.min(280, container.clientWidth || Math.min(280, window.innerWidth - 72)));
      container.innerHTML = ""; /* m18 : vider le conteneur avant de re-rendre le bouton, sinon ils s'empilent. */
      google.accounts.id.renderButton(container, {
        type: "standard",
        theme: "outline",
        size: "large",
        text: "continue_with",
        shape: "rectangular",
        logo_alignment: "left",
        width: _gisWidth
      });
    } catch (e) {
      console.warn("GIS renderButton notice:", e);
    }
  } else {
    /* C5 : avant, un seul retry à 300 ms puis conteneur vide et muet — sur
       connexion lente, la connexion Google était impossible sans explication.
       Maintenant : retries bornés à backoff croissant (300 ms → ~5 s) avec un
       état « chargement… » visible, puis bouton de repli branché sur
       signInWithGoogle('redirect') (la voie popup/redirect n'était reliée à
       aucun bouton), avec rappel de l'onglet e-mail. */
    if (!container.dataset.gisBound) {
      container.dataset.gisBound = "1";
      container.addEventListener("click", (ev) => {
        const _fb = ev.target && ev.target.closest ? ev.target.closest("[data-gis-fallback]") : null;
        if (_fb) signInWithGoogle("redirect");
      });
    }
    const _attempt = Number(container.dataset.gisAttempt || 0);
    if (_attempt < 6) {
      container.dataset.gisAttempt = String(_attempt + 1);
      container.innerHTML = `<p class="hint" style="margin:6px 0">Chargement du bouton Google…</p>`;
      setTimeout(() => {
        const c = document.getElementById(containerId);
        if (c) renderGoogleSignInButton(containerId);
      }, Math.min(300 * Math.pow(2, _attempt), 5000));
    } else {
      container.innerHTML = `<button type="button" class="btn" style="width:100%" data-gis-fallback="1">Continuer avec Google</button><p class="hint" style="margin:6px 0">Le bouton Google officiel ne s'est pas chargé (connexion lente ?). Ce bouton utilise la redirection Google ; sinon, utilisez l'onglet « Par Email ».</p>`;
    }
  }
}

/* ---------- Email & Password Authentication ---------- */
async function signInWithEmail(email, password) {
  if (!email || !password) {
    toast("Veuillez saisir votre adresse e-mail et votre mot de passe.");
    return;
  }
  if (!window.firebaseAuth) {
    if (typeof firebase !== "undefined" && firebase.auth) initFirebaseSync();
  }
  if (!window.firebaseAuth) {
    toast("Service Firebase non disponible. Utilisez le mode local.");
    return;
  }
  toast("Connexion par e-mail en cours…");
  try {
    const cred = await window.firebaseAuth.signInWithEmailAndPassword(email.trim(), password);
    if (cred && cred.user) {
      await handleUserAuthenticated(cred.user, `Bienvenue ! Connecté avec : ${cred.user.email}`); /* m3 */
      closeModal();
    }
  } catch (err) {
    console.error("Email login error:", err);
    handleEmailAuthError(err, email);
  }
}

async function registerWithEmail(email, password, farmName, managerName) {
  if (!email || !password) {
    toast("Veuillez saisir un e-mail et un mot de passe (6 caractères min.).");
    return;
  }
  if (password.length < 6) {
    toast("Le mot de passe doit comporter au moins 6 caractères.");
    return;
  }
  if (!window.firebaseAuth) {
    if (typeof firebase !== "undefined" && firebase.auth) initFirebaseSync();
  }
  if (!window.firebaseAuth) {
    toast("Service Firebase non disponible.");
    return;
  }
  toast("Création de votre compte en cours…");
  try {
    const cred = await window.firebaseAuth.createUserWithEmailAndPassword(email.trim(), password);
    if (cred && cred.user) {
      try {
        await cred.user.updateProfile({
          displayName: managerName || farmName || email.split("@")[0]
        });
      } catch (e) {}
      if (farmName) userSession.farmName = farmName;
      if (managerName) userSession.managerName = managerName;
      saveUserSession(userSession);
      await handleUserAuthenticated(cred.user, `Compte créé avec succès ! Bienvenue ${userSession.managerName}`); /* m3 */
      closeModal();
    }
  } catch (err) {
    console.error("Email registration error:", err);
    handleEmailAuthError(err, email, farmName, managerName);
  }
}

async function sendPasswordReset(email) {
  if (!email) {
    toast("Veuillez renseigner votre adresse e-mail.");
    return;
  }
  /* m2 : tenter d'initialiser Firebase comme connexion/inscription — avant,
     un firebaseAuth pas encore prêt faisait échouer la réinitialisation
     alors que la connexion, elle, initialisait au même moment. */
  if (!window.firebaseAuth) {
    if (typeof firebase !== "undefined" && firebase.auth) initFirebaseSync();
  }
  if (!window.firebaseAuth) {
    toast("Service Firebase non disponible.");
    return;
  }
  try {
    await window.firebaseAuth.sendPasswordResetEmail(email.trim());
    toast(`E-mail de réinitialisation envoyé à ${email}. Vérifiez votre boîte de réception.`);
  } catch (err) {
    console.error("Password reset error:", err);
    if (err.code === "auth/user-not-found") {
      toast("Aucun compte n'est enregistré avec cette adresse e-mail.");
    } else {
      toast("Notice réinitialisation : " + (err.message || err.code));
    }
  }
}

function signInLocalProfile(email, farmName, managerName) {
  /* C2 : capturer les données de la clé COURANTE (invité, le plus souvent)
     AVANT de basculer l'uid : getLocalData() lit la clé du nouvel uid, donc
     une lecture après bascule ne recopierait que l'espace vide du nouveau
     profil et le cheptel saisi en invité deviendrait invisible (clé orpheline). */
  const guestData = getLocalData();
  userSession.isLoggedIn = true;
  userSession.isLocalProfile = true;
  userSession.authProvider = "local";
  userSession.email = email || userSession.email || "eleveur@abvfarm.local";
  /* M6 : avant, uid = 16 premiers caractères base64 de l'e-mail (deux adresses
     proches partageaient le même espace) et btoa plantait sur les caractères
     non-Latin1. Hachage complet de l'adresse normalisée (FNV-1a x2, 16 hex) ;
     les données du profil courant ont été capturées avant la bascule (C2),
     elles sont donc réécrites sous le nouvel uid. */
  const _emM6 = String(userSession.email || "").trim().toLowerCase();
  let _h1M6 = 0x811c9dc5, _h2M6 = 0x01000193;
  for (let _iM6 = 0; _iM6 < _emM6.length; _iM6++) { const _cM6 = _emM6.charCodeAt(_iM6); _h1M6 = Math.imul(_h1M6 ^ _cM6, 0x01000193) >>> 0; _h2M6 = Math.imul(_h2M6 ^ (_cM6 + _iM6), 0x85ebca6b) >>> 0; }
  userSession.uid = "local_" + _h1M6.toString(16).padStart(8, "0") + _h2M6.toString(16).padStart(8, "0");
  userSession.farmName = farmName || userSession.farmName || "ABV Farm";
  userSession.managerName = managerName || userSession.managerName || (email ? email.split("@")[0] : "Éleveur ABV");
  userSession.photoUrl = null;
  userSession.lastSync = "Mode local autonome";
  saveUserSession(userSession);
  migrateLegacyGlobalKeys(); /* C4 : les anciennes clés globales partent sous ce profil local. */
  
  // Conserver ou migrer les données capturées ci-dessus dans l'espace utilisateur local
  const userKey = getUserDataKey();
  try { localStorage.setItem(userKey, JSON.stringify(guestData)); } catch(e) {}
  ingest(Object.values(guestData));
  toast(`Profil local activé pour ${userSession.email} !`);
  closeModal();
  render();
}

/* ---------- Offline Audio Chime & Vibration Engine ---------- */
function playAlertChime() {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    const ctx = new AudioContextClass();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // Ré 5
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12); // La 5

    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.45);
  } catch (e) {
    // Audio restricted prior to user touch
  }
}

function triggerVibration() {
  try {
    if ("vibrate" in navigator) {
      navigator.vibrate([150, 60, 150]);
    }
  } catch (e) {}
}

async function requestNotificationPermission() {
  if (!("Notification" in window)) {
    toast("Les notifications système ne sont pas supportées par ce navigateur.");
    return false;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission === "granted") {
      toast("Notifications ABV Farm activées sur cet appareil !");
      playAlertChime();
      triggerVibration();
      sendOfflineNotification("ABV Farm • Notifications actives", {
        body: "Vos alertes de saillies, palpations, nids, mises bas et soins s'afficheront quand l'application est ouverte, même sans connexion.",
        tag: "abv-welcome"

      return true;
    } else {
      toast("Autorisation refusée ou en attente.");
      return false;
    }
  } catch (err) {
    console.warn("Notification notice:", err);
    return false;
  }
}

function sendOfflineNotification(title, options = {}) {
  const prefs = getNotifPrefs();
  if (prefs.sound) playAlertChime();
  if (prefs.vibrate) triggerVibration();

  if (!("Notification" in window) || Notification.permission !== "granted") {
    return;
  }

  // 1. Envoi au Service Worker pour l'affichage quand l'app est ouverte (ou
  // recemment utilisee) — pas d'alerte garantie une fois l'app fermee (C6)
  if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({
      type: "SHOW_NOTIFICATION",
      title,
      options: {
        body: options.body || "",
        icon: "./icon-192.png",
        badge: "./icon-192.png",
        tag: options.tag || "abv-alert",
        /* m8 : la préférence vibration est transmise au SW — avant, il
           vibrait toujours ([200,100,200] en dur) même pref désactivée. */
        vibrate: prefs.vibrate,
        url: options.url || "./#rappels"
      }
    });
  } else if (navigator.serviceWorker && navigator.serviceWorker.ready) {
    navigator.serviceWorker.ready.then((reg) => {
      /* m24 : promesse retournée pour que le .catch ci-dessous rattrape
         aussi un échec d'affichage, pas seulement l'attente du SW. */
      return reg.showNotification(title, {
        body: options.body || "",
        icon: "./icon-192.png",
        badge: "./icon-192.png",
        tag: options.tag || "abv-alert",
        vibrate: prefs.vibrate ? [200, 100, 200] : [],
        data: { url: options.url || "./#rappels" }

  } else {

    try {
      new Notification(title, {
        body: options.body,
        icon: "./icon-192.png"
      });
    } catch (e) {}
  }
}

// Vérification et dispatch périodique des alertes urgentes
function checkAndNotifyUrgentAlerts(force = false) {
  const al = alerts();
  updateAlertBadges(al);

  const prefs = getNotifPrefs();
  if (!prefs.autoNotify && !force) return;
  if (!("Notification" in window) || Notification.permission !== "granted") return;

  const urgent = al.filter((a) => a.sev === "bad" || a.sev === "warn");
  if (!urgent.length) return;

  const todayKey = today();
  let log = {};
  try { const _lg = JSON.parse(localStorage.getItem(LS_NOTIF_LOG) || "{}"); if (_lg && typeof _lg === "object" && !Array.isArray(_lg)) log = _lg; } catch (e) {}
  /* m109 : avant, abv_notif_log_v1 croissait sans borne (une clé par alerte et
     par jour, jamais purgée). Seules les clés du jour courant servent la
     déduplication : les jours passés sont purgés à chaque vérification. */
  for (const _lk of Object.keys(log)) { if (!_lk.startsWith(todayKey)) delete log[_lk]; }

  /* M11 : avant, déduplication par TITRE seul — plusieurs alertes de même
     titre étaient fusionnées, une seule montrée, toutes journalisées
     « notifiées ». Clé par (titre + détail, qui porte le lapin/la date) et
     corps regroupé listant chaque alerte. */
  const _alertKey = (a) => `${todayKey}_${a.title}|${a.sub || ""}`;
  const toNotify = urgent.filter((a) => force || !log[_alertKey(a)]);

  if (toNotify.length > 0) {
    const first = toNotify[0];
    const body = toNotify.slice(0, 4).map((a) => a.sub).join(" • ") + (toNotify.length > 4 ? ` (+ ${toNotify.length - 4} autres alertes)` : "");

    /* P2/B26 : UNE notification par alerte urgente, avec un tag DISTINCT par alerte (avant : tag unique par jour, chaque notification écrasait la précédente). */
    toNotify.forEach((a, _ni) => { const _tag = ("abv-" + todayKey + "-" + String(a.title + "|" + (a.sub || "")).toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 50) + "-" + _ni); sendOfflineNotification(`ABV Farm • ${a.title}`, { body: a.sub || "", tag: _tag }); });

   recherche saccadée sur téléphone. La saisie n'est appliquée qu'après
   ~200 ms de pause ; le re-rendu et la restauration du curseur restent
   ceux d'avant, simplement différés. */
const _searchTimers = {};
function debounceSearch(key, fn) { clearTimeout(_searchTimers[key]); _searchTimers[key] = setTimeout(fn, 200); }
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("lapin-")) return { name: "lapin", id: h.slice(6) };
  if (h.startsWith("portee-")) return { name: "portee", id: h.slice(7) };
  if (h === "cages") return { name: "donnees" }; /* M51 : accès direct au registre des cages */
  return { name: NAV.some((n) => n.id === h) ? h : "accueil" };
}
function go(h) { if (location.hash.slice(1) === h) render(); else { curEntryIsSheet = false; location.hash = h; } }
window.addEventListener("hashchange", () => { closeModal(); render(); window.scrollTo(0, 0); });
/* Retour progressif (2026-11-10, demande Mr Robot ; mécanisme corrigé le
   même jour après son test réel) : le bouton retour du téléphone ne doit
   plus quitter l'écran d'un coup. Chaque feuille ouverte (formulaire,
   filtres, menu…) pousse une entrée d'historique dédiée (sheet()). Un
   appui sur Retour ferme d'abord la feuille et reste sur l'écran courant ;
   l'appui suivant revient à l'écran précédent via le hash. closeModal()
   ne touche JAMAIS à l'historique : l'ancien history.back() de fermeture,
   asynchrone, entrait en course avec le toucher suivant et faisait sauter
   un écran (retour brutal vers la liste filtrée). Si la feuille a été
   fermée par l'interface, son entrée dédiée est traversée en transparence
   ci-dessous, grâce au suivi de l'entrée courante (curEntryIsSheet). */
window.addEventListener("popstate", (e) => {
  const wasSheet = curEntryIsSheet;
  curEntryIsSheet = !!(e.state && e.state.abvSheet); /* état de l'entrée sur laquelle on vient d'atterrir */
  if ($("#modal").innerHTML) { closeModal(); return; } /* Retour avec une feuille ouverte : on la ferme, sans changer d'écran. Le garde-fou « saisie non enregistrée » reste respecté. */
  if (wasSheet) history.back(); /* on vient de reculer depuis l'entrée d'une feuille déjà fermée par l'interface : on la traverse en transparence, un seul appui doit mener à l'écran précédent. */
});
/* Toute navigation par lien d'ancre fait sortir de l'entrée de feuille. */
document.addEventListener("click", (e) => { const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null; if (a) curEntryIsSheet = false; }, true);

function renderNav() {
  const r = route(); const cur = r.name === "lapin" ? "lapins" : r.name;
  $("#sidenav").innerHTML = NAV.map((n) => `<a class="nav-a" href="#${n.id}" ${cur === n.id ? 'aria-current="page"' : ""}>${ICON[n.icon]}<span>${n.label}</span></a>`).join("");
  const inMore = !BOTTOM.includes(cur);
  $("#bottomnav").innerHTML = BOTTOM.map((id) => { const n = NAV.find((x) => x.id === id); const short = { lapins: "Cheptel", saillies: "Repro.", rappels: "Rappels" }[id] || n.label; return `<a href="#${id}" aria-label="${n.label}" ${cur === id ? 'aria-current="page"' : ""}><span class="pill">${ICON[n.icon]}</span>${short}</a>`; }).join("")
    + `<button type="button" data-act="more" ${inMore ? 'aria-current="page"' : ""}><span class="pill">${ICON.more}</span>Plus</button>`;
}

let _renderCache = null;
function render() {
  _renderCache = { alerts: null, stock: null, alloc: null, ration: null, weights: null };
  try {
    renderNav();
    updateUserUI();
    updateAlertBadges();
    if (!ready) return;
    const r = route(); const v = VIEWS[r.name] || VIEWS.accueil;
    $("#main").innerHTML = `<div class="wrap">${ABV_SHARED ? abvSharedBanner() : ""}${v(r)}</div>`;
    afterRender();
    if (location.hash === "#cages") { const _cg = document.getElementById("registre-cages"); if (_cg) _cg.scrollIntoView(); } /* M51 */
    purgeNetlifyWatermark();
  } catch (err) {
    console.error("Render error:", err);
    try { $("#main").innerHTML = `<div class="wrap"><div class="card"><h2>\u26a0\ufe0f Affichage interrompu</h2><p class="hint">Cette vue n'a pas pu s'afficher (${esc(err && err.message ? err.message : "erreur inconnue")}). Vos données ne sont pas modifiées : changez de rubrique ou rechargez la page, et signalez l'erreur si elle persiste.</p><div class="actions"><a class="btn pri" href="#accueil">Retour à l'accueil</a></div></div></div>`; } catch (e2) {}
  } finally {
    _renderCache = null;
  }
}
let afterHooks = [];
function afterRender() { a11yTables($("#main")); const h = afterHooks; afterHooks = []; h.forEach((f) => { try { f(); } catch (e) { console.warn("afterRender : hook de vue en échec (vue conservée) :", e); } }); } /* m20 : hooks isolés un par un — avant, un hook qui levait remontait dans render() et faisait remplacer toute la vue par l'écran d'erreur. */

/* ---------- Small renderers ---------- */

const mstChip = (s) => { const c = s === "Mise bas" ? "ok" : s === "Gestation confirmée" ? "info" : s === "Échoué" ? "bad" : "warn"; return `<span class="chip ${c}">${esc(s)}</span>`; };

const sevIco = (a) => `<span class="ico ${a.sev}">${ICON[a.icon]}</span>`;
function gestTrack(m) {
  const d = Math.max(0, Math.min(GESTATION, diff(m.date, today())));
  const pc = (x) => (x / GESTATION) * 100;
  return `<div class="track" role="img" aria-label="Jour ${d} sur ${GESTATION} de gestation">
    <div class="fill" style="width:${pc(d)}%"></div>
    <div class="zone" style="left:${pc(PALP_START)}%;width:${pc(Math.max(1, PALP_END - PALP_START))}%"><span>Palpation J${PALP_START}–${PALP_END}</span></div>
    <!-- Correctif captures : « Nid J28 » (centré sur J28) et « J31 » (bord droit)
         se chevauchaient sur mobile. Les deux libellés sont maintenant alignés
         vers la gauche de leur repère, ils ne se touchent plus. -->
    <div class="mk" style="left:${pc(GESTATION - 3)}%"><span style="transform:translateX(-100%);padding-right:2px">Nid J${GESTATION - 3}</span></div>
    <div class="mk mk-end" style="left:calc(100% - 2px)"><span style="transform:translateX(-100%)">J${GESTATION}</span></div>
    <div class="now" style="left:${pc(d)}%"></div></div>`;
}
function gestCard(m) {

  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du poids">
    ${ticks.map((v) => `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${nf2.format(v)}</text>`).join("")}
    <text x="${L}" y="${H - 8}">${fmtShort(ws[0].date)}</text><text x="${W - R}" y="${H - 8}" text-anchor="end">${fmtShort(ws[ws.length - 1].date)}</text>

    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="var(--sage)"/><text x="${Math.min(last[0], W - R - 4)}" y="${Math.max(last[1] - 12, 12)}" text-anchor="end" style="fill:var(--ink);font-weight:700">${nf2.format(ws[ws.length - 1].kg)} kg</text></svg>`;

function monthChart() {
  const W = window.innerWidth < 640 ? 380 : 640, H = 220, L = 58, R = 10, T = 30, B = 28; /* M3 : viewBox mobile étroit + marge haute pour les étiquettes */ const months = [];
  const d = new Date(); d.setDate(1);
  for (let i = 5; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); months.push({ k: `${x.getFullYear()}-${pad(x.getMonth() + 1)}`, l: MONTHS[x.getMonth()], i: 0, o: 0 }); }
  S.tx.forEach((t) => { const m = months.find((x) => (t.date || "").startsWith(x.k)); if (m) m[t.type === "in" ? "i" : "o"] += Number(t.amount || 0); });
  const max = Math.max(...months.map((m) => Math.max(m.i, m.o)));
  if (!max) return `<p class="hint">Le graphique financier s'affichera dès vos premières entrées/sorties d'argent.</p>`;
  const mag = Math.pow(10, Math.floor(Math.log10(max))); const stepRaw = max / 4; const step = [1, 2, 2.5, 5, 10, 20, 25, 50].map((s) => s * mag / 10).find((s) => s >= stepRaw) || mag;
  const top = Math.ceil(max / step) * step; const Y = (v) => T + (1 - v / top) * (H - T - B); const cw = (W - L - R) / 6, bw = Math.min(30, cw / 2.6); /* m82 : barres plus larges sur mobile */
  const ticks = []; for (let v = 0; v <= top + 1e-6; v += step) ticks.push(v);
  const short = (v) => v >= 1e6 ? nf1.format(v / 1e6) + "M" : v >= 1e3 ? nf0.format(v / 1e3) + "k" : nf0.format(v);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Recettes et dépenses par mois">${ticks.map((v) => `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${short(v)}</text>`).join("")}
    ${months.map((m, i) => { const cx = L + cw * i + cw / 2; return `<rect x="${cx - bw - 2}" y="${Y(m.i)}" width="${bw}" height="${Y(0) - Y(m.i)}" rx="4" fill="var(--ok)"><title>${m.l} : ${fcfa(m.i)}</title></rect><rect x="${cx + 2}" y="${Y(m.o)}" width="${bw}" height="${Y(0) - Y(m.o)}" rx="4" fill="var(--bad)" fill-opacity=".8"><title>${m.l} : ${fcfa(m.o)}</title></rect><text x="${cx - 4}" y="${Y(m.i) - 4}" text-anchor="end" style="font-weight:700">${m.i ? short(m.i) : ""}</text><text x="${cx + 4}" y="${Y(m.o) - 4}" text-anchor="start" style="font-weight:700">${m.o ? short(m.o) : ""}</text><text x="${cx}" y="${H - 8}" text-anchor="middle">${m.l}</text>`; }).join("")}</svg>`;
}

    doc.autoTable({
      startY: 46,

      columnStyles: { 0: { fontStyle: "bold", width: 70, textColor: [91, 104, 98] }, 1: { textColor: [36, 48, 42] } },

    doc.text(`2. Fiches détaillées des lapins actifs (${act.length} sujets)`, 14, startRabbits); /* P4/F75 : ce tableau liste TOUS les actifs (jeunes et non sexés compris), pas seulement les reproducteurs. */

    const rabbitsRows = act.map((r) => {
      const w = lastWeight(r.id);
      const g = gmq(r.id);
      return [
        r.name,
        r.sex === "Male" ? "Mâle" : r.sex === "Female" ? "Femelle" : "Indét.",
        r.breed || "—",
        r.cage || "—",
        fmtShort(r.birth),
        ageLabel(age(r), r.birth, (isDeparted(r) && r.exitDate ? r.exitDate : today())),
        w != null ? `${nf2.format(w)} kg` : "—",

    doc.autoTable({

      theme: "striped",
      headStyles: { fillColor: [62, 90, 71], textColor: [255, 255, 255], fontStyle: "bold", fontSize: 8.5 },
      styles: { fontSize: 8, cellPadding: 2.2, font: "helvetica" },
      margin: { left: 14, right: 14 }
    });

    // Matings table
    if (gest.length > 0) {
      const startMatings = doc.lastAutoTable.finalY + 10;
      doc.setFontSize(12);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(36, 48, 42);
      doc.text("3. Suivi des gestations actives", 14, startMatings);

      const matingsRows = gest.map((m) => {
        const left = diff(today(), m.due);
        return [
          rname(m.female),
          rname(m.male),
          fmtDate(m.date),
          fmtDate(m.due),
          left >= 0 ? `Dans ${left} j` : `Retard ${-left} j`,
          m.status
        ];
      });

      doc.autoTable({
        startY: startMatings + 4,
        head: [["Femelle", "Mâle", "Date saillie", "Mise bas prévue", "Échéance", "Statut"]],
        body: matingsRows,
        theme: "striped",
        headStyles: { fillColor: [185, 95, 69], textColor: [255, 255, 255], fontStyle: "bold", fontSize: 8.5 },
        styles: { fontSize: 8, cellPadding: 2.2, font: "helvetica" },
        margin: { left: 14, right: 14 }
      });
    }

    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      doc.setFontSize(8);
      doc.setTextColor(150, 150, 150);
      doc.text(`${_farmPdf} • Document officiel d'élevage • Page ${i} sur ${pageCount}`, 105, 290, { align: "center" });
    }

    const filename = `Inventaire_${_farmFile}_${today()}.pdf`;
    doc.save(filename);
    toast("Inventaire PDF téléchargé !");
  } catch (err) {
    console.error("PDF generation error:", err);
    toast("Erreur lors de la génération du PDF.");
  }
}

/* ---------- Theme Management & Modal ---------- */
function getActiveTheme() {
  /* m110 : accès protégé — un stockage bloqué ne doit pas casser le démarrage. */
  try { return localStorage.getItem("abv_theme") || "sage"; } catch (e) { return "sage"; }
}

function setTheme(theme) {
  /* m40 : garde — un identifiant de thème inconnu est ignoré (avant, il était
     appliqué et persisté tel quel, laissant l'app sans thème valide). */
  if (!["sage", "dark", "terracotta", "emerald"].includes(theme)) { console.warn("Thème inconnu ignoré :", theme); return; }
  document.documentElement.setAttribute("data-theme", theme);
  /* m110 : accès protégé — avant, un stockage bloqué faisait échouer setTheme
     et cassait la modale Thème (fermeture/re-rendu interrompus). Le thème
     visuel s'applique quand même pour la session. */
  try { localStorage.setItem("abv_theme", theme); } catch (e) { console.warn("Thème non persisté (stockage bloqué) :", e); }
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) {
    if (theme === "dark") metaTheme.content = "#101512";
    else if (theme === "terracotta") metaTheme.content = "#B45309";
    else if (theme === "emerald") metaTheme.content = "#15803D";
    else metaTheme.content = "#3E5A47";
  }
  toast(`Thème appliqué : ${themeLabel(theme)}`);
}

function themeLabel(theme) {
  switch (theme) {
    case "dark": return "🌙 Nuit Éleveur (Sombre)";
    case "terracotta": return "🌾 Terre & Argile";
    case "emerald": return "🌲 Forêt Émeraude";
    default: return "🌿 Nature Sauge (Clair)";
  }
}
