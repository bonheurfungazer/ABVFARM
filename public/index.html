<style>
/* Production Layout & Palette */
:root {
  --bg: #F6F5EF;
  --surface: #FFFFFF;
  --surface-2: #EFEDE5;
  --ink: #24302A;
  --muted: #5B6862;
  --line: #DCD8CD;
  --sage: #3E5A47;

  --sage-soft: #E2EDE4;
  --sage-soft-ink: #233527;
  --clay: #B95F45;
  --clay-soft: #F6E3DB;
  --ok: #1E6B34;   --ok-soft: #E3F1E5;
  --warn: #9A5208; --warn-soft: #FFF1D9;
  --bad: #B3261E;  --bad-soft: #FDE5E2;
  --info: #0B629A; --info-soft: #E1F0FA;
  --male: #1F5FA6; --male-soft: #E0ECF8;
  --female: #A92F63; --female-soft: #F9E3ED;
  --hero: #3E5A47; --hero-ink: #F3F7F2;
  --shadow: 0 1px 2px rgba(36,48,42,.06), 0 4px 14px rgba(36,48,42,.05);

  --r-s: 8px; --r-m: 14px; --r-l: 20px;
}
:root, :root[data-theme="sage"], :root[data-theme="light"] {
  --bg: #F6F5EF; --surface: #FFFFFF; --surface-2: #EFEDE5; --ink: #24302A; --muted: #5B6862; --line: #DCD8CD;
  --sage: #3E5A47; --sage-ink: #FFFFFF; --sage-soft: #E2EDE4; --sage-soft-ink: #233527;
  --clay: #B95F45; --clay-soft: #F6E3DB;
  --ok: #1E6B34; --ok-soft: #E3F1E5; --warn: #9A5208; --warn-soft: #FFF1D9; --bad: #B3261E; --bad-soft: #FDE5E2;
  --info: #0B629A; --info-soft: #E1F0FA; --male: #1F5FA6; --male-soft: #E0ECF8; --female: #A92F63; --female-soft: #F9E3ED;
  --hero: #3E5A47; --hero-ink: #F3F7F2; --shadow: 0 1px 2px rgba(36,48,42,.06), 0 4px 14px rgba(36,48,42,.05);

}
:root[data-theme="dark"] {
  --bg: #101512; --surface: #18201B; --surface-2: #212A25; --ink: #E4ECE6; --muted: #A2B3A9; --line: #2E3B34;
  --sage: #7CB88F; --sage-ink: #0E2416; --sage-soft: #233A2B; --sage-soft-ink: #D3EBDB;
  --clay: #EC9E86; --clay-soft: #46271E;
  --ok: #8FD19E; --ok-soft: #1B3423; --warn: #F4B567; --warn-soft: #3A2911; --bad: #FFB0A6; --bad-soft: #4A1D1A;
  --info: #8CCBF7; --info-soft: #0F2D43; --male: #A3CBF3; --male-soft: #16283A; --female: #F4AACB; --female-soft: #35192A;

:root[data-theme="terracotta"] {
  --bg: #F9F6F0; --surface: #FFFFFF; --surface-2: #F2ECE1; --ink: #2E241D; --muted: #786558; --line: #E2D7C8;
  --sage: #B45309; --sage-ink: #FFFFFF; --sage-soft: #FEF3C7; --sage-soft-ink: #78350F;

:root[data-theme="emerald"] {
  --bg: #F0FDF4; --surface: #FFFFFF; --surface-2: #DCFCE7; --ink: #14532D; --muted: #497259; --line: #BBF7D0;
  --sage: #15803D; --sage-ink: #FFFFFF; --sage-soft: #D1FAE5; --sage-soft-ink: #064E3B;
  --clay: #D97706; --clay-soft: #FEF3C7;
  --ok: #16A34A; --ok-soft: #DCFCE7; --warn: #CA8A04; --warn-soft: #FEF9C3; --bad: #DC2626; --bad-soft: #FEE2E2;
  --info: #0284C7; --info-soft: #E0F2FE; --male: #2563EB; --male-soft: #DBEAFE; --female: #DB2777; --female-soft: #FCE7F3;

}
details summary { list-style: none; }

.chevron-rot { transition: transform .22s cubic-bezier(0.4, 0, 0.2, 1); color: var(--muted); flex: none; }
details[open] > summary .chevron-rot { transform: rotate(180deg); color: var(--sage); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }

:focus-visible { outline: 2.5px solid var(--sage); outline-offset: 2px; }
.num, .tab { font-variant-numeric: tabular-nums; }

.shell { display: grid; grid-template-columns: 1fr; min-height: 100%; }
.side { display: none; }
.mobile-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
.brand-logo { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; flex: none; background: #fff; border: 1.5px solid var(--line); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.brand-logo.sm { width: 34px; height: 34px; border-radius: 10px; }
.mobile-brand { display: flex; align-items: center; gap: 10px; }
.mobile-brand b { font-family: var(--f-display); font-size: 1.05rem; line-height: 1.1; display: block; }
.mobile-brand small { color: var(--muted); font-size: 0.72rem; }

main { min-width: 0; padding-block: 20px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

@media (min-width: 900px) {
  .shell { grid-template-columns: 256px 1fr; }
  .mobile-header { display: none; }
  .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; padding: 22px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); background: var(--surface); }
  main { padding-block: 28px 48px; padding-right: max(28px, env(safe-area-inset-right, 0px)); padding-left: 28px; }
  .bottom { display: none !important; }
}

.brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 16px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.brand-mark { width: 42px; height: 42px; border-radius: 12px; background: var(--hero); color: var(--hero-ink); display: grid; place-items: center; flex: none; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: .75rem; }
.nav-a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--muted); text-decoration: none; font-weight: 600; transition: background .12s ease, color .12s ease; }
.nav-a:hover { background: var(--surface-2); color: var(--ink); }
.nav-a[aria-current="page"] { background: var(--sage-soft); color: var(--sage-soft-ink); font-weight: 700; }
.nav-a svg { width: 20px; height: 20px; flex: none; }

/* User Account & Sync widget in Sidebar */
.side-account { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.user-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); cursor: pointer; text-decoration: none; color: inherit; transition: background .12s ease; }
.user-card:hover { filter: brightness(0.97); }
.user-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--sage); color: var(--sage-ink); font-weight: 700; font-size: .85rem; display: grid; place-items: center; flex: none; overflow: hidden; }
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-meta { min-width: 0; flex: 1; }
.user-meta b { display: block; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.user-meta small { color: var(--muted); font-size: .72rem; display: flex; align-items: center; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 6px rgba(30,107,52,.4); }
.dot.offline { background: var(--warn); }
.dot.local { background: var(--info); }

.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); box-shadow: 0 -2px 10px rgba(0,0,0,.04); }
.bottom a, .bottom button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; text-decoration: none; color: var(--muted); font-size: .7rem; font-weight: 600; background: none; border: 0; cursor: pointer; }
.bottom .pill { width: 54px; height: 30px; display: grid; place-items: center; border-radius: 15px; transition: background .12s ease; }
.bottom [aria-current="page"] { color: var(--ink); }
.bottom [aria-current="page"] .pill { background: var(--sage-soft); color: var(--sage-soft-ink); }
.bottom svg { width: 21px; height: 21px; }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head p { color: var(--muted); margin-top: 2px; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card > .row-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .v { font-family: var(--f-display); font-size: 1.6rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .l { font-size: .78rem; color: var(--muted); font-weight: 600; }
.tile .s { font-size: .78rem; color: var(--muted); }
.tile.warn { background: var(--warn-soft); border-color: transparent; } .tile.warn .v { color: var(--warn); }
.tile.bad { background: var(--bad-soft); border-color: transparent; } .tile.bad .v { color: var(--bad); }

.hero { background: var(--hero); color: var(--hero-ink); border-radius: var(--r-l); padding: 22px; display: grid; gap: 16px; grid-template-columns: 1fr; position: relative; overflow: hidden; }
.hero h1 { font-size: 1.9rem; }
.hero p, .hero .head p { color: inherit; opacity: .86; max-width: 60ch; }
.hero .meta { display: flex; gap: 8px; flex-wrap: wrap; }
.hero .chip { background: rgba(255,255,255,.14); color: var(--hero-ink); }
.hero svg.ears { position: absolute; right: -10px; bottom: -18px; width: 170px; opacity: .13; pointer-events: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 9px 14px; font-weight: 700; font-size: .9rem; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; white-space: nowrap; min-height: 40px; touch-action: manipulation; transition: background .12s ease, transform .08s ease; }
.btn:active { transform: scale(0.98); }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--sage); color: var(--sage-ink); border-color: transparent; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.clay { background: var(--clay); color: var(--surface); border-color: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 11px; font-size: .8rem; border-radius: 10px; min-height: 34px; }
.btn svg { width: 17px; height: 17px; }
.hero .btn { background: var(--hero-ink); color: var(--hero); border-color: transparent; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: .74rem; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.m { background: var(--male-soft); color: var(--male); }
.chip.f { background: var(--female-soft); color: var(--female); }
.chip.clay { background: var(--clay-soft); color: var(--clay); }
.tag { font-family: var(--f-mono); font-size: .72rem; font-weight: 700; letter-spacing: .02em; border: 1.5px solid currentColor; border-radius: 5px; padding: 0 5px; color: var(--muted); white-space: nowrap; }

.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .t { font-weight: 600; }
.li .d { font-size: .82rem; color: var(--muted); }
.ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--muted); }
.ico svg { width: 19px; height: 19px; }
.ico.ok { background: var(--ok-soft); color: var(--ok); } .ico.warn { background: var(--warn-soft); color: var(--warn); }
.ico.bad { background: var(--bad-soft); color: var(--bad); } .ico.info { background: var(--info-soft); color: var(--info); }
.ico.m { background: var(--male-soft); color: var(--male); } .ico.f { background: var(--female-soft); color: var(--female); }
.ico.clay { background: var(--clay-soft); color: var(--clay); }

.rcard { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; border-radius: var(--r-l); padding: 16px; border: 1px solid transparent; transition: transform .15s ease, box-shadow .15s ease; min-width: 0; }
.rcard:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.rcard.m { background: var(--male-soft); } .rcard.f { background: var(--female-soft); } .rcard.u { background: var(--surface-2); }
.rcard.off { background: var(--surface); border-color: var(--line); opacity: .85; }
.rcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.rcard .nm { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; line-height: 1.15; overflow-wrap: anywhere; }
.rcard.m .nm, .rcard.m .sx { color: var(--male); } .rcard.f .nm, .rcard.f .sx { color: var(--female); }
.rcard .facts { display: flex; gap: 14px; font-size: .82rem; color: var(--muted); flex-wrap: wrap; }
.rcard .facts b { color: var(--ink); font-weight: 700; }
.sx { font-size: 1.3rem; line-height: 1; font-weight: 800; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.chip-bar::-webkit-scrollbar { display: none; }
.chip-btn { border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); padding: 5px 11px; border-radius: 999px; font-size: .8rem; font-weight: 700; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .12s ease, color .12s ease, border-color .12s ease; }
.chip-btn:hover { background: var(--surface-2); color: var(--ink); }
.chip-btn[aria-pressed="true"] { background: var(--sage); color: var(--sage-ink); border-color: transparent; }
.chip-btn .badge { background: rgba(0,0,0,0.08); padding: 1px 6px; border-radius: 999px; font-size: .72rem; }
.chip-btn[aria-pressed="true"] .badge { background: rgba(255,255,255,0.28); color: #fff; }
.filter-select { border: 1.5px solid var(--line); border-radius: 11px; background: var(--surface); padding: 7px 10px; font-size: .82rem; font-weight: 600; color: var(--ink); outline: none; cursor: pointer; }
.filter-select:focus { border-color: var(--sage); }
.view-toggle { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 2px; gap: 2px; }
.view-toggle button { border: 0; background: transparent; padding: 6px 9px; border-radius: 8px; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.view-toggle button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.view-toggle svg { width: 16px; height: 16px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 9px; font-weight: 600; font-size: .84rem; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.search { flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.search input { border: 0; background: transparent; padding: 9px 0; width: 100%; outline: none; }
.search svg { width: 17px; height: 17px; color: var(--muted); flex: none; }

/* Gestation track */
.gest { display: flex; flex-direction: column; gap: 8px; }
.track { position: relative; height: 10px; border-radius: 6px; background: var(--surface-2); margin: 16px 0 18px; }
.track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--clay); }
.track .zone { position: absolute; top: 0; bottom: 0; background: var(--info); opacity: .28; }
.track .mk { position: absolute; top: -5px; width: 2px; height: 20px; background: var(--ink); opacity: .45; }
.track .mk span, .track .zone span { position: absolute; top: 22px; transform: translateX(-50%); font-size: .66rem; color: var(--muted); white-space: nowrap; font-weight: 600; }
.track .zone span { top: -18px; left: 50%; }
.track .now { position: absolute; top: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid var(--clay); transform: translateX(-50%); }

/* ---------- PWA Service Worker Registration ---------- */

let deferredPrompt = null;

  e.preventDefault();
  deferredPrompt = e;
});

window.addEventListener("appinstalled", () => {
  deferredPrompt = null;
  toast("Application ABV Farm installée avec succès sur votre téléphone !");
});

function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === "accepted") {
        toast("Installation en cours...");
      }
      deferredPrompt = null;

  } else {
    // Helpful guide for iOS Safari
    const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
    if (isIos) {
      toast("Sur iPhone : Touchez le bouton Partager puis « Sur l'écran d'accueil » pour l'installer.");

const $ = (s, r = document) => r.querySelector(s);

const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parse = (s) => new Date(String(s).slice(0, 10) + "T00:00:00");
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const fmtDate = (s) => { if (!s) return "—"; const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };

const nf0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });

/* ---------- Farm rules ---------- */

/* ---------- State & Cloud/Local Sync Layer ---------- */
const KIND = { rabbit: "rabbits", mating: "matings", weight: "weights", treatment: "treatments", item: "inventory", feed: "feed", tx: "tx", batch: "batches", reminder: "reminders", cage: "cages" };
let S = blank();
function blank() { const o = {}; Object.values(KIND).forEach((k) => (o[k] = [])); return o; }

const LS_DATA_KEY = "abvfarm_production_data_v2";
const LS_USER_KEY = "abvfarm_user_session_v2";

let userSession = loadUserSession();
let isOnline = navigator.onLine;
let ready = false;
let cloudSyncActive = false;

function loadUserSession() {
  try {
    return JSON.parse(localStorage.getItem(LS_USER_KEY) || "null") || {
      isLoggedIn: false,
      farmName: "ABV Farm",
      email: "",
      managerName: "Éleveur ABV",
      photoUrl: null,
      lastSync: null
    };
  } catch (e) {
    return { isLoggedIn: false, farmName: "ABV Farm", email: "", managerName: "Éleveur ABV", photoUrl: null, lastSync: null };
  }
}

function saveUserSession(session = {}) {
  userSession = { ...userSession, ...session };
  try { localStorage.setItem(LS_USER_KEY, JSON.stringify(userSession)); } catch (e) {}
  updateUserUI();
}

function getUserDataKey() {
  return (userSession.isLoggedIn && userSession.uid) ? "abvfarm_data_user_" + userSession.uid : "abvfarm_data_guest";
}

function getLocalData() {
  try {
    const key = getUserDataKey();
    let val = localStorage.getItem(key);
    if (!val && key === "abvfarm_data_guest") {
      const legacy = localStorage.getItem(LS_DATA_KEY);
      if (legacy) {
        val = legacy;
        try { localStorage.setItem(key, legacy); } catch (e) {}
      }
    }
    return JSON.parse(val || "{}");
  } catch (e) {
    return {};
  }
}

function setLocalData(all) {
  try {
    const key = getUserDataKey();
    localStorage.setItem(key, JSON.stringify(all));
  } catch (e) {
    console.warn("Storage notice:", e);
  }
}

function ingest(docs) {
  const s = blank();
  for (const d of docs) {
    const k = KIND[d.kind];
    if (k) s[k].push(d);
  }
  S = s;
  ready = true;
  render();
}

function logActivity(action, label) { try { const _a = JSON.parse(localStorage.getItem("abvfarm_activity") || "[]"); _a.unshift({ at: new Date().toISOString(), action, label: String(label || "") }); localStorage.setItem("abvfarm_activity", JSON.stringify(_a.slice(0, 200))); } catch (e) {} }
async function retryPendingSync() {
  if (!userSession.isLoggedIn || !isOnline || !window.firebaseDb || !userSession.uid) return;
  let _q = []; try { _q = JSON.parse(localStorage.getItem("abvfarm_pending_sync") || "[]"); } catch (e) {}
  if (!_q.length) return;
  const _col = window.firebaseDb.collection("users").doc(userSession.uid).collection("cheptel");
  const _left = [];
  for (const _it of _q) { try { if (_it.action === "delete") await _col.doc(_it.kind + "-" + _it.id).delete(); else await _col.doc(_it.kind + "-" + _it.id).set(_it.doc); } catch (e) { _left.push(_it); } }
  try { localStorage.setItem("abvfarm_pending_sync", JSON.stringify(_left)); if (_left.length < _q.length) toast(`Synchronisation rattrapée : ${_q.length - _left.length} fiche(s) envoyée(s).`); } catch (e) {}
}
async function save(kind, obj) {
  if (!obj.id) obj.id = uid();
  const all = getLocalData();
  const doc = { ...obj, kind, updatedAt: new Date().toISOString() };
  all[kind + "-" + obj.id] = doc;
  setLocalData(all);
  ingest(Object.values(all));

  // Push to Cloud Firestore if signed in
  if (userSession.isLoggedIn && isOnline && window.firebaseDb && userSession.uid) {
    try {
      await window.firebaseDb.collection("users").doc(userSession.uid).collection("cheptel").doc(kind + "-" + obj.id).set(doc);
      userSession.lastSync = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      saveUserSession();
      retryPendingSync();
    } catch (err) {
      console.warn("Cloud push notice:", err);
      try { const _q = JSON.parse(localStorage.getItem("abvfarm_pending_sync") || "[]"); _q.push({ action: "set", kind, id: obj.id, doc }); localStorage.setItem("abvfarm_pending_sync", JSON.stringify(_q)); toast("⚠️ Non synchronisé : sera renvoyé à la prochaine connexion."); } catch (e) {}
    }
  }
  logActivity("Enregistré", `${kind} ${obj.name || obj.label || obj.title || obj.id}`);
  return true;
}

async function removeDoc(kind, id) {
  const all = getLocalData();
  const _del = all[kind + "-" + id];
  if (_del) { try { const _t = JSON.parse(localStorage.getItem("abvfarm_trash") || "[]"); _t.unshift({ kind, id, doc: _del, deletedAt: new Date().toISOString() }); localStorage.setItem("abvfarm_trash", JSON.stringify(_t.slice(0, 100))); logActivity("Supprimé", `${kind} ${_del.name || _del.label || _del.title || id}`); } catch (e) {} }
  delete all[kind + "-" + id];
  setLocalData(all);
  ingest(Object.values(all));

  if (userSession.isLoggedIn && isOnline && window.firebaseDb && userSession.uid) {
    try {
      await window.firebaseDb.collection("users").doc(userSession.uid).collection("cheptel").doc(kind + "-" + id).delete();
      userSession.lastSync = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      saveUserSession();
    } catch (err) {
      console.warn("Cloud delete notice:", err);
      try { const _q = JSON.parse(localStorage.getItem("abvfarm_pending_sync") || "[]"); _q.push({ action: "delete", kind, id }); localStorage.setItem("abvfarm_pending_sync", JSON.stringify(_q)); } catch (e) {}
    }
  }
  return true;
}

let unsubscribeSnapshot = null;

function ensureCloudSyncListener(uid) {
  if (unsubscribeSnapshot || !window.firebaseDb || !uid) return;
  try {
    unsubscribeSnapshot = window.firebaseDb.collection("users").doc(uid).collection("cheptel").onSnapshot((snap) => {
      cloudSyncActive = true;
      const cloudDocs = snap.docs.map((d) => d.data());
      const all = getLocalData();
      let updated = false;
      cloudDocs.forEach((d) => {
        if (d && d.kind && d.id) {
          const _local = all[d.kind + "-" + d.id];
          if (!_local || !_local.updatedAt || !d.updatedAt || d.updatedAt >= _local.updatedAt) { all[d.kind + "-" + d.id] = d; updated = true; }
        }
      });
      if (updated || Object.keys(all).length > 0) {
        setLocalData(all);
        ingest(Object.values(all));
      }
      userSession.lastSync = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      updateUserUI();
    }, (err) => {
      console.warn("Cloud snapshot notice:", err);
    });
  } catch (e) {
    console.warn("Cloud listener error:", e);
  }
}

function handleUserAuthenticated(user, msg) {
  if (unsubscribeSnapshot) {
    try { unsubscribeSnapshot(); } catch (e) {}
    unsubscribeSnapshot = null;
  }

  // 1. Récupérer les données existantes avant de basculer
  const guestKey = "abvfarm_data_guest";
  let guestData = {};
  try {
    guestData = JSON.parse(localStorage.getItem(guestKey) || "{}");
    if (!Object.keys(guestData).length) {
      guestData = JSON.parse(localStorage.getItem(LS_DATA_KEY) || "{}");
    }
  } catch (e) {}

  // Préserver les données en mémoire vive si présentes
  if (S && Object.keys(guestData).length === 0) {
    const memDocs = [
      ...S.rabbits.map(x => ({ ...x, kind: 'rabbit' })),
      ...S.matings.map(x => ({ ...x, kind: 'mating' })),
      ...S.treatments.map(x => ({ ...x, kind: 'treatment' })),
      ...S.weights.map(x => ({ ...x, kind: 'weight' })),
      ...S.feed.map(x => ({ ...x, kind: 'feed' })),
      ...S.inventory.map(x => ({ ...x, kind: 'inventory' })),
      ...S.reminders.map(x => ({ ...x, kind: 'reminder' })),
      ...S.batches.map(x => ({ ...x, kind: 'batch' })),
      ...S.tx.map(x => ({ ...x, kind: 'tx' }))
    ];
    memDocs.forEach(d => { if (d.id) guestData[d.kind + '-' + d.id] = d; });
  }

  // 2. Basculer l'identité sur l'UID connecté
  userSession.isLoggedIn = true;
  userSession.isLocalProfile = false;
  userSession.authProvider = (user.providerData && user.providerData[0] && user.providerData[0].providerId) || (user.email ? "password" : "custom");
  userSession.uid = user.uid;
  userSession.email = user.email || userSession.email;
  userSession.managerName = user.displayName || userSession.managerName || (user.email ? user.email.split("@")[0] : "Éleveur");
  userSession.photoUrl = user.photoURL || null;
  saveUserSession(userSession);
  if (msg) toast(msg);

  // 3. Charger les données locales de l'utilisateur ou migrer les données existantes
  let userLocalData = getLocalData();
  if (Object.keys(userLocalData).length === 0 && Object.keys(guestData).length > 0) {
    userLocalData = { ...guestData };
    setLocalData(userLocalData);
  } else if (Object.keys(guestData).length > 0) {
    userLocalData = { ...guestData, ...userLocalData };
    setLocalData(userLocalData);
  }

  // Afficher immédiatement les données dans l'application
  ingest(Object.values(userLocalData));
  updateUserUI();

  // 4. Synchroniser avec Cloud Firestore
  if (window.firebaseDb && user.uid) {
    // Créer ou mettre à jour le profil utilisateur
    window.firebaseDb.collection("users").doc(user.uid).set({
      userId: user.uid,
      email: user.email || "",
      displayName: userSession.managerName || "",
      farmName: userSession.farmName || "ABV Farm",
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch((err) => console.warn("UserProfile sync notice:", err));

    // Sauvegarder les fiches existantes dans le cloud Firestore
    const docsToPush = Object.values(userLocalData);
    if (docsToPush.length > 0) {
      docsToPush.forEach((d) => {
        if (d && d.kind && d.id) {
          window.firebaseDb.collection("users").doc(user.uid).collection("cheptel").doc(d.kind + "-" + d.id).set({
            ...d,
            updatedAt: new Date().toISOString()
          }, { merge: true }).catch((err) => console.warn("Push doc notice:", err));
        }
      });
    }

    // Écouter les mises à jour cloud en temps réel
    ensureCloudSyncListener(user.uid);
  }
}

/* ---------- Google & Email Authentication Layer ---------- */
function getGoogleProvider(forceSelect = false) {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.addScope("profile");
  provider.addScope("email");
  if (forceSelect) {
    provider.setCustomParameters({
      prompt: "select_account"
    });
  }
  return provider;
}

function handleAuthError(err) {
  if (!err) return;
  console.error("Auth notice/error:", err);

  const diag = $("#authDiagnosticBox");
  let msg = "Impossible de se connecter avec Google.";
  let detail = err.message || err.code || "";

  if (err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request") {
    if (diag) {
      diag.style.display = "block";
      diag.innerHTML = `
        <div style="font-weight:700;margin-bottom:6px">La fenêtre pop-up Google s'est refermée ou a été bloquée.</div>
        <div style="margin-bottom:8px"><b>Solution PWA :</b> Utilisez le bouton blanc officiel Google en haut (Google One-Tap direct sans pop-up), ou la connexion par e-mail dans le 1er onglet.</div>
      `;
    }
    toast("Pop-up fermée. Utilisez le bouton officiel Google ou la connexion par e-mail.");
    return;
  }

  if (err.code === "auth/popup-blocked") {
    msg = "La fenêtre pop-up Google a été bloquée par votre navigateur.";
    if (diag) {
      diag.style.display = "block";
      diag.innerHTML = `<b>Pop-up bloquée :</b> Votre navigateur ou smartphone a bloqué la fenêtre pop-up Google.<br>Utilisez le bouton officiel blanc ci-dessus ou basculez sur l'onglet <b>Par Email</b>.`;
    }
    toast(msg);
    return;
  }

  if (err.code === "auth/unauthorized-domain") {
    const currentHost = window.location.hostname || "domaine actuel";
    msg = `Domaine Firebase à vérifier : ${currentHost}`;
    if (diag) {
      diag.style.display = "block";
      diag.innerHTML = `<b>Domaine :</b> Si votre domaine est déjà renseigné dans Firebase, vérifiez qu'il correspond exactement à <code>${esc(currentHost)}</code> (sans https:// ni / à la fin).<br><span style="font-size:0.8rem;color:var(--muted)">Vos données d'élevage sont conservées et 100% sécurisées sur cet appareil.</span>`;
    }
    unauthorizedDomainModal();
    return;
  }

  if (err.code === "auth/operation-not-allowed") {
    msg = "Le fournisseur Google n'est pas activé dans la console Firebase (Authentication > Sign-in method > Google > Activer).";
  } else if (err.code === "auth/network-request-failed") {
    msg = "Erreur de réseau : vérifiez votre connexion Internet.";
  } else if (detail) {
    msg = "Notice Google : " + detail;
  }

  if (diag) {
    diag.style.display = "block";
    diag.textContent = msg;
  }
  toast(msg);
}

function signInWithGoogle(mode = "auto", forceSelect = false) {
  if (!window.firebaseAuth) {
    if (typeof firebase !== "undefined" && firebase.auth) {
      initFirebaseSync();
    }
  }
  if (!window.firebaseAuth) {
    toast("Service Firebase en cours de chargement... Réessayez dans un instant.");
    return;
  }

  const provider = getGoogleProvider(forceSelect);

  if (mode === "redirect") {
    try {
      sessionStorage.setItem("abv_auth_pending", "google");
      localStorage.setItem("abv_auth_pending_time", Date.now().toString());
    } catch(e) {}
    toast("Redirection vers Google en cours…");
    window.firebaseAuth.signInWithRedirect(provider).catch((err) => {
      sessionStorage.removeItem("abv_auth_pending");
      localStorage.removeItem("abv_auth_pending_time");
      handleAuthError(err);
    });
    return;
  }

  toast("Connexion avec Google en cours…");
  let popupFinished = false;
  const timeoutId = setTimeout(() => {
    if (!popupFinished && !userSession.isLoggedIn) {
      const diag = $("#authDiagnosticBox");
      if (diag) {
        diag.style.display = "block";
        diag.innerHTML = `
          <div style="font-weight:700;margin-bottom:6px">⚠️ Information Mobile & PWA :</div>
          <div style="font-size:0.83rem;line-height:1.4">
            Sur mobile Android, Chrome isole les fenêtres pop-up et bloque la transmission du compte vers l'application.<br><br>
            <b>Solutions directes :</b><br>
            • Utilisez l'onglet <b>« Par Email »</b> (100% garanti sur mobile PWA)<br>
            • Ou autorisez votre URL dans Google Cloud pour utiliser le bouton Google 1-clic direct ci-dessus.
          </div>
        `;
      }
    }
  }, 12000);

  window.firebaseAuth.signInWithPopup(provider).then((result) => {
    popupFinished = true;
    clearTimeout(timeoutId);
    if (result && result.user) {
      handleUserAuthenticated(result.user, `Connecté avec Google : ${result.user.displayName || result.user.email}`);
      closeModal();
    }
  }).catch((err) => {
    popupFinished = true;
    clearTimeout(timeoutId);
    handleAuthError(err);
  });
}

async function signInWithEmail(email, password) {
  if (!email || !password) {
    toast("Veuillez saisir votre adresse e-mail et votre mot de passe.");
    return;
  }
  if (!window.firebaseAuth) {
    if (typeof firebase !== "undefined" && firebase.auth) initFirebaseSync();

      </button>

  } else if (err.code === "auth/email-already-in-use") {
    msg = "Cette adresse e-mail est déjà inscrite. Veuillez vous connecter.";
  } else if (err.code === "auth/weak-password") {
    msg = "Mot de passe trop court (6 caractères minimum).";

    msg = "Format d'adresse e-mail invalide.";

    msg = "Connexion réseau impossible. Vérifiez votre connexion Internet.";

      <button type="button" class="btn sm pri" style="margin-top:8px;width:100%" id="btnQuickLocalProfile">

/* ---------- Derived data ---------- */
const byId = (list, id) => list.find((x) => x.id === id);
const rab = (id) => byId(S.rabbits, id);
const isActive = (r) => r && (r.status || "Actif") === "Actif";
const age = (r) => r?.birth ? diff(r.birth, today()) : -1;
const sexCls = (r) => r?.sex === "Male" ? "m" : r?.sex === "Female" ? "f" : "u";
const sexSym = (r) => r?.sex === "Male" ? "♂" : r?.sex === "Female" ? "♀" : "?";
const rname = (id) => rab(id)?.name || "Inconnu";
function weightsOf(id) { return S.weights.filter((w) => w.rabbit === id).sort((a, b) => a.date.localeCompare(b.date)); }
function lastWeight(id) { const w = weightsOf(id); return w.length ? w[w.length - 1].kg : null; }
function gmq(id) { const w = weightsOf(id); if (w.length < 2) return null; const a = w[0], b = w[w.length - 1]; const d = diff(a.date, b.date); return d > 0 ? ((b.kg - a.kg) * 1000) / d : null; }
function kgOf(it) {
  const q = Number(it.qty) || 0;
  switch (it.unit) { case "sac 25 kg": return q * 25; case "sac 50 kg": return q * 50; case "g": return q / 1000; case "kg": return q; default: return 0; }
}
function feedStock() {
  const bought = S.inventory.filter((i) => i.cat === "Nourriture").reduce((s, i) => s + kgOf(i), 0);
  const used = S.feed.reduce((s, f) => s + (Number(f.grams) || 0), 0) / 1000;
  return Math.max(0, bought - used);
}
function underWithdrawal(id) {
  const t = today();
  return S.treatments.filter((x) => x.rabbit === id && Number(x.withdrawal) > 0 && addDays(x.date, Number(x.withdrawal)) > t)
    .map((x) => addDays(x.date, Number(x.withdrawal))).sort().pop() || null;
}
function ration() {
  const t = today(); const c = { mal: 0, fem: 0, gest: 0, lact: 0, y1: 0, y2: 0 };
  S.rabbits.filter(isActive).forEach((r) => {
    const a = age(r);
    if (a < 30) return; if (a < 60) { c.y1++; return; } if (a < 120) { c.y2++; return; }
    if (r.sex === "Male") { c.mal++; return; }
    const lact = S.matings.some((m) => m.female === r.id && m.status === "Mise bas" && m.birthDate && diff(m.birthDate, t) <= 40);
    const gest = S.matings.some((m) => m.female === r.id && ["Accouplé", "Gestation confirmée"].includes(m.status) && diff(t, m.due) >= -3);
    if (lact) c.lact++; else if (gest) c.gest++; else c.fem++;
  });
  const fat = S.batches.filter((b) => b.status === "Actif").reduce((s, b) => s + (Number(b.current) || 0), 0);
  const g = c.mal * 120 + c.fem * 120 + c.gest * 180 + c.lact * 280 + c.y1 * 50 + c.y2 * 90 + fat * 110;
  return { grams: g, c, fat };
}

function makeKinship() {
  const memoA = new Map(), memoF = new Map();
  const older = (x, y) => { const a = rab(x), b = rab(y); const da = a?.birth || "9999", dbb = b?.birth || "9999"; return da === dbb ? (x < y) : da < dbb; };
  function F(x, depth) { if (!x) return 0; if (memoF.has(x)) return memoF.get(x); const r = rab(x); const v = r ? 0.5 * A(r.father, r.mother, depth + 1) : 0; memoF.set(x, v); return v; }
  function A(x, y, depth = 0) {
    if (!x || !y || depth > 12) return 0;
    if (x === y) return 1 + F(x, depth);
    const key = x < y ? x + "|" + y : y + "|" + x;
    if (memoA.has(key)) return memoA.get(key);
    let a = x, b = y; if (!older(a, b)) { a = y; b = x; }
    const rb = rab(b);
    const v = rb ? 0.5 * (A(a, rb.father, depth + 1) + A(a, rb.mother, depth + 1)) : 0;
    memoA.set(key, v); return v;
  }
  return { A, F };
}
function offspringF(male, female) { if (!male || !female) return 0; return 0.5 * makeKinship().A(male, female) * 100; }
function riskOf(f) {
  if (f <= 0.0001) return { lvl: "ok", label: "Aucune parenté connue", tip: "Accouplement sûr." };
  if (f < 6.25) return { lvl: "warn", label: "Risque faible", tip: "Parenté éloignée. Acceptable avec surveillance." };
  if (f <= 12.5) return { lvl: "bad", label: "Risque élevé", tip: "Équivaut à des demi-frères/sœurs. À éviter." };
  return { lvl: "bad", label: "Risque critique", tip: "Parenté très proche (frère/sœur, parent/enfant). Déconseillé." };
}

/* ---------- Alerts ---------- */
function alerts() {
  const t = today(), out = [];
  for (const m of S.matings) {
    const d = diff(m.date, t), toBirth = diff(t, m.due), f = rname(m.female);
    if (m.status === "Accouplé" && d >= 10 && d <= 14) out.push({ sev: "info", icon: "hand", title: `Palper ${f}`, sub: `J${d} après saillie — fenêtre de palpation J10 à J14`, act: [["Gestation confirmée", "mst", m.id, "Gestation confirmée"], ["Vide", "mst", m.id, "Échoué"]] });
    if (["Accouplé", "Gestation confirmée"].includes(m.status) && toBirth >= 1 && toBirth <= 3) out.push({ sev: "warn", icon: "nest", title: `Boîte à nid pour ${f}`, sub: `Mise bas prévue ${relDay(toBirth)} (${fmtShort(m.due)})` });
    if (["Accouplé", "Gestation confirmée"].includes(m.status) && toBirth <= 0 && toBirth >= -6) out.push({ sev: "bad", icon: "baby", title: `Mise bas attendue : ${f}`, sub: toBirth === 0 ? "Prévue aujourd'hui" : `En retard de ${-toBirth} j`, act: [["Enregistrer la mise bas", "kindle", m.id]] });
    if (m.status === "Mise bas" && m.birthDate) {
      const a = diff(m.birthDate, t);
      if (a >= WEANING - 2 && a <= WEANING + 10 && !S.batches.some((b) => b.mating === m.id)) out.push({ sev: "info", icon: "layers", title: `Sevrer la portée de ${f}`, sub: `Lapereaux âgés de ${a} j`, act: [["Créer un lot", "newbatch", m.id]] });
    }
  }
  for (const x of S.treatments) if (x.next) { const n = diff(t, x.next); if (n <= 2 && n >= -14) out.push({ sev: n < 0 ? "bad" : "warn", icon: "syringe", title: `${x.type} : ${x.product || "rappel"}`, sub: `${x.rabbit ? rname(x.rabbit) : "Tout l'élevage"} — ${relDay(n)}` }); }
  for (const b of S.batches) if (b.status === "Actif") { const n = diff(t, b.target); if (n <= 3) out.push({ sev: "ok", icon: "coins", title: `Lot ${b.code} prêt à la vente`, sub: n < 0 ? `Date cible dépassée de ${-n} j` : `Date cible ${relDay(n)}`, act: [["Vendre", "sell", b.id]] }); }
  for (const r of S.reminders) if (!r.done && r.due <= t) out.push({ sev: r.prio === "Haute" ? "bad" : "warn", icon: "bell", title: r.title, sub: `Rappel — ${relDay(diff(t, r.due))}`, act: [["Fait", "remdone", r.id]] });
  const stock = feedStock(), rg = ration().grams;
  if (S.inventory.length && stock < 10) out.push({ sev: stock <= 0 ? "bad" : "warn", icon: "grain", title: stock <= 0 ? "Stock d'aliment épuisé" : `Stock d'aliment faible : ${nf1.format(stock)} kg`, sub: rg ? `Environ ${nf1.format(stock / (rg / 1000))} jours de ration` : "Pensez à réapprovisionner", act: [["Ajouter un achat", "newitem"]] });
  const order = { bad: 0, warn: 1, info: 2, ok: 3 };
  return out.sort((a, b) => order[a.sev] - order[b.sev]);
}

/* ---------- Offline Audio Chime & Vibration Engine ---------- */
function playAlertChime() {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    const ctx = new AudioContextClass();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // Ré 5
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12); // La 5

    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.45);
  } catch (e) {
    // Audio restricted prior to user touch
  }
}

function triggerVibration() {

}

const LS_NOTIF_PREFS = "abv_notif_prefs_v1";
const LS_NOTIF_LOG = "abv_notif_log_v1";

function getNotifPrefs() {
  try {
    return JSON.parse(localStorage.getItem(LS_NOTIF_PREFS) || '{"sound":true,"vibrate":true,"autoNotify":true}');
  } catch (e) {

function saveNotifPrefs(prefs) {
  try {
    localStorage.setItem(LS_NOTIF_PREFS, JSON.stringify(prefs));
  } catch (e) {}
}

async function requestNotificationPermission() {
  if (!("Notification" in window)) {
    toast("Les notifications système ne sont pas supportées par ce navigateur.");
    return false;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission === "granted") {
      toast("Notifications ABV Farm activées sur cet appareil !");
      playAlertChime();
      triggerVibration();
      sendOfflineNotification("ABV Farm • Notifications actives", {
        body: "Vos alertes de saillies, palpations, nids, mises bas et soins s'afficheront même hors-ligne.",
        tag: "abv-welcome"
      });
      return true;
    } else {
      toast("Autorisation refusée ou en attente.");
      return false;
    }
  } catch (err) {
    console.warn("Notification notice:", err);
    return false;
  }
}

function sendOfflineNotification(title, options = {}) {
  const prefs = getNotifPrefs();
  if (prefs.sound) playAlertChime();
  if (prefs.vibrate) triggerVibration();

  if (!("Notification" in window) || Notification.permission !== "granted") {
    return;
  }

  // 1. Envoi au Service Worker pour affichage fiable même en arrière-plan ou hors-ligne
  if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({
      type: "SHOW_NOTIFICATION",
      title,
      options: {
        body: options.body || "",
        icon: "./icon-192.png",
        badge: "./icon-192.png",
        tag: options.tag || "abv-alert",
        url: options.url || "./#rappels"
      }
    });
  } else if (navigator.serviceWorker && navigator.serviceWorker.ready) {
    navigator.serviceWorker.ready.then((reg) => {
      reg.showNotification(title, {
        body: options.body || "",
        icon: "./icon-192.png",
        badge: "./icon-192.png",
        tag: options.tag || "abv-alert",
        data: { url: options.url || "./#rappels" }
      });
    }).catch(() => {
      try { new Notification(title, { body: options.body, icon: "./icon-192.png" }); } catch (e) {}
    });
  } else {
    // 2. Repli direct Notification API
    try {
      new Notification(title, {
        body: options.body,
        icon: "./icon-192.png"
      });
    } catch (e) {}
  }
}

// Vérification et dispatch périodique des alertes urgentes
function checkAndNotifyUrgentAlerts(force = false) {
  const al = alerts();
  updateAlertBadges(al);

  const prefs = getNotifPrefs();
  if (!prefs.autoNotify && !force) return;
  if (!("Notification" in window) || Notification.permission !== "granted") return;

  const urgent = al.filter((a) => a.sev === "bad" || a.sev === "warn");
  if (!urgent.length) return;

  const todayKey = today();
  let log = {};
  try { log = JSON.parse(localStorage.getItem(LS_NOTIF_LOG) || "{}"); } catch (e) {}

  const toNotify = urgent.filter((a) => {
    const key = `${todayKey}_${a.title}`;
    return force || !log[key];
  });

  if (toNotify.length > 0) {
    const first = toNotify[0];
    const more = toNotify.length - 1;
    const body = more > 0 
      ? `${first.sub} (+ ${more} autre${more > 1 ? "s" : ""} alerte${more > 1 ? "s" : ""})`
      : first.sub;

    sendOfflineNotification(`ABV Farm • ${first.title}`, {
      body,
      tag: `abv-daily-${todayKey}`
    });

    toNotify.forEach((a) => {
      log[`${todayKey}_${a.title}`] = true;
    });
    try { localStorage.setItem(LS_NOTIF_LOG, JSON.stringify(log)); } catch (e) {}
  }
}

function updateAlertBadges(al) {
  if (!al) al = alerts();
  const count = al.length;
  const headerBadge = $("#headerAlertBadge");
  const sideBadge = $("#sideAlertBadge");

  if (headerBadge) {
    if (count > 0) {
      headerBadge.textContent = count > 99 ? "99+" : count;
      headerBadge.style.display = "flex";
      headerBadge.style.background = al.some((a) => a.sev === "bad") ? "var(--bad)" : "var(--warn)";
    } else {
      headerBadge.style.display = "none";
    }
  }

  if (sideBadge) {
    if (count > 0) {
      sideBadge.textContent = count;
      sideBadge.style.display = "inline-flex";
      sideBadge.className = `chip sm ${al.some((a) => a.sev === "bad") ? "bad" : "warn"}`;
    } else {
      sideBadge.style.display = "none";
    }
  }
}

  { id: "0-1m", label: "0 – 1 mois", desc: "< 30 j (au nid)", minD: 0, maxD: 29 },

VIEWS.lapins = () => {
  const q = (ui.q || "").trim().toLowerCase();
  const t = today();

  // Liste de base selon le statut (Actifs, Sortis / Archivés, ou Tous)
  const allAct = S.rabbits.filter(isActive);
  const allArch = S.rabbits.filter((r) => !isActive(r));
  let baseList = ui.st === "archives" ? allArch : ui.st === "all" ? S.rabbits : allAct;

  // Calcul statistique des tranches d'âge sur la base active/affichée
  const ageDistribution = AGE_BRACKETS.map((b) => {
    const rabbitsInB = baseList.filter((r) => {
      const a = age(r);
      return a >= b.minD && a <= b.maxD;
    });
    const males = rabbitsInB.filter((r) => r.sex === "Male").length;
    const females = rabbitsInB.filter((r) => r.sex === "Female").length;
    const indet = rabbitsInB.length - males - females;
    return {
      ...b,
      count: rabbitsInB.length,
      males,
      females,
      indet,
      percent: baseList.length ? Math.round((rabbitsInB.length / baseList.length) * 100) : 0
    };
  });

  // Pré-calcul des compteurs pour les puces rapides d'état
  const counts = {
    all: baseList.length,
    male: baseList.filter((r) => r.sex === "Male").length,
    female: baseList.filter((r) => r.sex === "Female").length,
    gest: baseList.filter((r) => S.matings.some((m) => m.female === r.id && ["Accouplé", "Gestation confirmée"].includes(m.status))).length,
    lact: baseList.filter((r) => S.matings.some((m) => m.female === r.id && m.status === "Mise bas" && m.birthDate && diff(m.birthDate, t) <= 45)).length,
    mature: baseList.filter((r) => age(r) >= MATURE_DAYS).length,
    young: baseList.filter((r) => { const a = age(r); return a >= 0 && a < MATURE_DAYS; }).length,
    treat: baseList.filter((r) => underWithdrawal(r.id) != null).length
  };

  let list = baseList.slice();

  // 1. Filtre par Tranche d'Âge cliquée dans la section répartition
  if (ui.ageBracket && ui.ageBracket !== "all") {
    const br = AGE_BRACKETS.find((b) => b.id === ui.ageBracket);
    if (br) {
      list = list.filter((r) => {
        const a = age(r);
        return a >= br.minD && a <= br.maxD;
      });
    }
  }

  // 2. Filtre par Stade / État physiologique
  if (ui.stage && ui.stage !== "all") {
    list = list.filter((r) => {
      const a = age(r);
      const isGest = S.matings.some((m) => m.female === r.id && ["Accouplé", "Gestation confirmée"].includes(m.status));
      const isLact = S.matings.some((m) => m.female === r.id && m.status === "Mise bas" && m.birthDate && diff(m.birthDate, t) <= 45);
      const isTreat = underWithdrawal(r.id) != null;
      switch (ui.stage) {
        case "male": return r.sex === "Male";
        case "female": return r.sex === "Female";
        case "gest": return isGest;
        case "lact": return isLact;
        case "mature": return a >= MATURE_DAYS;
        case "young": return a >= 0 && a < MATURE_DAYS;
        case "treat": return isTreat;
        default: return true;
      }
    });
  }

  // 3. Filtre par Sexe direct si sélectionné
  if (ui.sex && ui.sex !== "all") {
    list = list.filter((r) => r.sex === ui.sex);
  }

  // 4. Filtre par Race
  if (ui.breed && ui.breed !== "all") {
    list = list.filter((r) => (r.breed || "").trim().toLowerCase() === ui.breed.toLowerCase());
  }

  // 5. Filtre précis par Âge saisi par l'utilisateur (en mois)
  if (ui.minAgeM !== "" && !isNaN(Number(ui.minAgeM))) {
    const minDays = Number(ui.minAgeM) * 30.44;
    list = list.filter((r) => age(r) >= minDays);
  }
  if (ui.maxAgeM !== "" && !isNaN(Number(ui.maxAgeM))) {
    const maxDays = Number(ui.maxAgeM) * 30.44;
    list = list.filter((r) => {
      const a = age(r);
      return a >= 0 && a <= maxDays;
    });
  }

  // 6. Filtre précis par Poids saisi par l'utilisateur (en kg)
  if (ui.minWeight !== "" && !isNaN(Number(ui.minWeight))) {
    const minW = Number(ui.minWeight);
    list = list.filter((r) => {
      const w = lastWeight(r.id);
      return w != null && w >= minW;
    });
  }
  if (ui.maxWeight !== "" && !isNaN(Number(ui.maxWeight))) {
    const maxW = Number(ui.maxWeight);
    list = list.filter((r) => {
      const w = lastWeight(r.id);
      return w != null && w <= maxW;
    });
  }

  // 7. Recherche textuelle (Nom, Cage, Race, Notes)
  if (q) {
    list = list.filter((r) => [r.name, r.cage, r.breed, r.notes].some((v) => String(v || "").toLowerCase().includes(q)));
  }

  // 8. Tri intelligent
  list.sort((a, b) => {
    switch (ui.sort) {

    </summary>

      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:10px">
        <div class="field">

        <div class="field">
          <label style="font-size:0.75rem">Poids max (kg)</label>
          <input type="number" id="inpMaxWeight" step="0.1" min="0" placeholder="ex. 4.0" value="${esc(ui.maxWeight || '')}" style="padding:6px 9px;font-size:0.85rem">
        </div>
      </div>

        <div style="margin-top:8px;text-align:right">

        </div>

    </div>

  <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.82rem;color:var(--muted);padding:0 2px">
    <span>Affichage de <b>${list.length}</b> lapin${list.length > 1 ? "s" : ""} sur <b>${baseList.length}</b></span>
    ${(() => { const _pages = Math.max(1, Math.ceil(list.length / 24)); const _pg = Math.max(1, Math.min(_pages, Number(ui.rpage) || 1)); ui.rpage = _pg; return _pages > 1 ? `<span style="display:flex;gap:6px;align-items:center"><button class="btn sm ghost" data-act="ui" data-k="rpage" data-v="${_pg - 1}" ${_pg <= 1 ? "disabled" : ""}>← Précédent</button><span>Page ${_pg} / ${_pages}</span><button class="btn sm ghost" data-act="ui" data-k="rpage" data-v="${_pg + 1}" ${_pg >= _pages ? "disabled" : ""}>Suivant →</button></span>` : ""; })()}

                <th>Statut & Stade</th>

            </tbody>

      <div class="grid g3">${list.slice(((Number(ui.rpage) || 1) - 1) * 24, (Number(ui.rpage) || 1) * 24).map(rabbitCard).join("")}</div>

  ) : `
    <div class="card">

function rabbitCard(r) {
  const a = age(r), w = lastWeight(r.id), wd = underWithdrawal(r.id);
  const gest = S.matings.find((m) => m.female === r.id && ["Accouplé", "Gestation confirmée"].includes(m.status));

  return `<a class="rcard ${isActive(r) ? sexCls(r) : "off"}" href="#lapin-${r.id}">
    <div class="top"><div style="min-width:0"><div class="nm">${esc(r.name)}</div><div class="hint">${esc(r.breed || "Race non précisée")}</div></div><span class="sx">${sexSym(r)}</span></div>
    <div class="facts"><span>Âge <b>${ageLabel(a)}</b></span><span>Poids <b>${w != null ? nf2.format(w) + " kg" : "—"}</b></span></div>
    <div class="actions">
      ${r.cage ? `<span class="tag">CAGE ${esc(r.cage)}</span>` : ""}
      ${!isActive(r) ? statusChip(r.status) : ""}
      ${isActive(r) && a >= MATURE_DAYS ? `<span class="chip ok">Reproducteur</span>` : ""}
      ${gest ? `<span class="chip clay">Gestante · J${diff(gest.date, today())}</span>` : ""}
      ${lact ? `<span class="chip info">Allaitante</span>` : ""}
      ${wd ? `<span class="chip bad">Délai d'attente</span>` : ""}
    </div>
  </a>`;
}

function rabbitTableRow(r) {
  const a = age(r), w = lastWeight(r.id), wd = underWithdrawal(r.id);
  const gest = S.matings.find((m) => m.female === r.id && ["Accouplé", "Gestation confirmée"].includes(m.status));

  return `<tr>
    <td>
      <a href="#lapin-${r.id}" style="font-weight:700;color:inherit;text-decoration:none;display:flex;align-items:center;gap:6px">
        <span class="sx ${sexCls(r)}" style="font-size:1.15rem">${sexSym(r)}</span>
        <span>${esc(r.name)}</span>
      </a>
    </td>
    <td>${r.cage ? `<span class="tag">CAGE ${esc(r.cage)}</span>` : '<span class="hint">—</span>'}</td>

    <td class="r num"><b>${w != null ? nf2.format(w) + " kg" : "—"}</b></td>
    <td>
      ${!isActive(r) ? statusChip(r.status) : gest ? `<span class="chip clay">Gestante · J${diff(gest.date, today())}</span>` : lact ? `<span class="chip info">Allaitante</span>` : a >= MATURE_DAYS ? `<span class="chip ok">Reproducteur</span>` : `<span class="chip">Jeune</span>`}
      ${wd ? `<span class="chip bad">Délai d'attente</span>` : ""}
    </td>
    <td class="r">
      <div class="actions" style="justify-content:flex-end">
        <button class="btn sm ghost" data-act="newweight" data-id="${r.id}" title="Ajouter une pesée">${ICON.scale}</button>
        <button class="btn sm ghost" data-act="newtreat" data-id="${r.id}" title="Ajouter un soin">${ICON.syringe}</button>
        <a class="btn sm" href="#lapin-${r.id}">Fiche</a>
      </div>
    </td>
  </tr>`;
}

VIEWS.lapin = ({ id }) => {
  const r = rab(id);
  if (!r) return `<a class="btn ghost" href="#lapins">${ICON.back}Mes lapins</a><div class="card">${emptyBox("rabbit", "Ce lapin n'existe plus", "La fiche a peut-être été supprimée.")}</div>`;
  const a = age(r), ws = weightsOf(id), g = gmq(id), wd = underWithdrawal(id);
  const tr = S.treatments.filter((x) => x.rabbit === id).sort((x, y) => y.date.localeCompare(x.date));
  const mts = S.matings.filter((m) => m.male === id || m.female === id).sort((x, y) => y.date.localeCompare(x.date));
  const kids = S.rabbits.filter((k) => k.father === id || k.mother === id);
  const done = mts.filter((m) => m.status === "Mise bas"), failed = mts.filter((m) => m.status === "Échoué");
  const born = done.reduce((s, m) => s + (Number(m.alive) || 0), 0);
  const rate = done.length + failed.length ? Math.round((done.length / (done.length + failed.length)) * 100) : null;
  const matur = a >= MATURE_DAYS ? ["ok", "Apte à la reproduction", `Âge ≥ 5 mois (${ageLabel(a)}).`] : a >= 90 ? ["warn", "Sub-adulte", `Maturité dans ${MATURE_DAYS - a} jours.`] : ["info", "Jeune en croissance", `Reproduction possible à partir de 5 mois.`];
  const F = r.father && r.mother ? makeKinship().F(id) * 100 : 0;
  return `<div class="head"><a class="btn ghost" href="#lapins">${ICON.back}Mes lapins</a>
    <div class="actions"><button class="btn" data-act="editrabbit" data-id="${id}">${ICON.edit}Modifier</button><button class="btn" data-act="status" data-id="${id}">Statut</button><button class="btn ghost danger" data-act="delrabbit" data-id="${id}" aria-label="Supprimer">${ICON.trash}</button></div></div>
  <section class="rcard ${isActive(r) ? sexCls(r) : "off"}" style="padding:22px;cursor:default">
    <div class="top"><div style="min-width:0"><span class="eyebrow">${r.sex === "Male" ? "Mâle" : r.sex === "Female" ? "Femelle" : "Sexe indéterminé"} · ${esc(r.breed || "Race non précisée")}</span><div class="nm" style="font-size:2rem">${esc(r.name)}</div></div><span class="sx" style="font-size:2.2rem">${sexSym(r)}</span></div>
    <div class="actions">${statusChip(r.status)}${r.cage ? `<span class="tag">CAGE ${esc(r.cage)}</span>` : ""}<span class="chip ${matur[0]}">${matur[1]}</span>${wd ? `<span class="chip bad">Délai d'attente jusqu'au ${fmtShort(wd)}</span>` : ""}${F > 0 ? `<span class="chip warn">Consanguinité F = ${nf1.format(F)} %</span>` : ""}</div>
    <div class="actions"><button class="btn sm" data-act="newweight" data-id="${id}">${ICON.scale}Pesée</button><button class="btn sm" data-act="newtreat" data-id="${id}">${ICON.syringe}Soin</button>${isActive(r) && r.sex !== "Indéterminé" ? `<button class="btn sm" data-act="newmating" data-id="${id}">${ICON.heart}Saillie</button>` : ""}</div>
  </section>
  ${wd ? `<div class="banner warn"><span>${ICON.alert.replace("<svg", '<svg width="18" height="18"')} Ne pas vendre ni abattre avant le ${fmtDate(wd)} (délai d'attente après traitement).</span></div>` : ""}
  <div class="grid g2">

function pedigree(r) {

}
function weightChart(ws) {
  const W = 640, H = 210, L = 44, R = 14, T = 14, B = 28;
  const xs = ws.map((w) => parse(w.date).getTime()), ys = ws.map((w) => w.kg);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const span = y1 - y0 || 1;
  const step = span > 3 ? 1 : span > 1.2 ? 0.5 : span > 0.5 ? 0.25 : 0.1;
  y0 = Math.max(0, Math.floor(y0 / step) * step); y1 = Math.ceil(y1 / step) * step; if (y1 === y0) y1 = y0 + step;
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const X = (t) => L + ((t - x0) / (x1 - x0 || 1)) * (W - L - R), Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const ticks = []; for (let v = y0; v <= y1 + 1e-9; v += step) ticks.push(+v.toFixed(2));
  const pts = ws.map((w, i) => [X(xs[i]), Y(w.kg)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${Y(y0)} L${pts[0][0].toFixed(1)} ${Y(y0)} Z`;
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du poids">
    ${ticks.map((v) => `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${nf2.format(v)}</text>`).join("")}
    <text x="${L}" y="${H - 8}">${fmtShort(ws[0].date)}</text><text x="${W - R}" y="${H - 8}" text-anchor="end">${fmtShort(ws[ws.length - 1].date)}</text>
    <path d="${area}" fill="var(--sage)" fill-opacity=".14"/><path d="${line}" fill="none" stroke="var(--sage)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--surface)" stroke="var(--sage)" stroke-width="2"/>`).join("")}
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="var(--sage)"/><text x="${Math.min(last[0], W - R - 4)}" y="${Math.max(last[1] - 12, 12)}" text-anchor="end" style="fill:var(--ink);font-weight:700">${nf2.format(ws[ws.length - 1].kg)} kg</text></svg>`;
}
function treatRow(x) {
  const wEnd = Number(x.withdrawal) > 0 ? addDays(x.date, Number(x.withdrawal)) : null; const active = wEnd && wEnd > today();
  const cls = x.type === "Vaccin" ? "info" : x.type === "Antibiotique" ? "bad" : x.type === "Vitamines" ? "warn" : "ok";

}

};
function monthChart() {
  const W = 640, H = 220, L = 58, R = 10, T = 12, B = 28; const months = [];
  const d = new Date(); d.setDate(1);
  for (let i = 5; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); months.push({ k: `${x.getFullYear()}-${pad(x.getMonth() + 1)}`, l: MONTHS[x.getMonth()], i: 0, o: 0 }); }
  S.tx.forEach((t) => { const m = months.find((x) => t.date.startsWith(x.k)); if (m) m[t.type === "in" ? "i" : "o"] += Number(t.amount || 0); });
  const max = Math.max(...months.map((m) => Math.max(m.i, m.o)));
  if (!max) return `<p class="hint">Le graphique financier s'affichera dès vos premières entrées/sorties d'argent.</p>`;
  const mag = Math.pow(10, Math.floor(Math.log10(max))); const stepRaw = max / 4; const step = [1, 2, 2.5, 5, 10, 20, 25, 50].map((s) => s * mag / 10).find((s) => s >= stepRaw) || mag;
  const top = Math.ceil(max / step) * step; const Y = (v) => T + (1 - v / top) * (H - T - B); const cw = (W - L - R) / 6, bw = Math.min(22, cw / 3.2);
  const ticks = []; for (let v = 0; v <= top + 1e-6; v += step) ticks.push(v);
  const short = (v) => v >= 1e6 ? nf1.format(v / 1e6) + " M" : v >= 1e3 ? nf0.format(v / 1e3) + " k" : nf0.format(v);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Recettes et dépenses par mois">${ticks.map((v) => `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${short(v)}</text>`).join("")}
    ${months.map((m, i) => { const cx = L + cw * i + cw / 2; return `<rect x="${cx - bw - 2}" y="${Y(m.i)}" width="${bw}" height="${Y(0) - Y(m.i)}" rx="4" fill="var(--ok)"><title>${m.l} : ${fcfa(m.i)}</title></rect><rect x="${cx + 2}" y="${Y(m.o)}" width="${bw}" height="${Y(0) - Y(m.o)}" rx="4" fill="var(--bad)" fill-opacity=".8"><title>${m.l} : ${fcfa(m.o)}</title></rect><text x="${cx}" y="${H - 8}" text-anchor="middle">${m.l}</text>`; }).join("")}</svg>`;
}

/* ---------- PDF Export ---------- */
function exportHerdPDF() {
  try {
    const { jsPDF } = window.jspdf;
    if (!jsPDF) {
      toast("Chargement du générateur PDF... Veuillez patienter.");
      return;
    }
    const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const act = S.rabbits.filter(isActive);
    const males = act.filter((r) => r.sex === "Male").length;
    const fem = act.filter((r) => r.sex === "Female").length;
    const mature = act.filter((r) => age(r) >= MATURE_DAYS).length;
    const gest = S.matings.filter((m) => ["Accouplé", "Gestation confirmée"].includes(m.status));
    const fat = S.batches.filter((b) => b.status === "Actif").reduce((s, b) => s + (Number(b.current) || 0), 0);
    const stock = feedStock();
    const rt = ration();
    const m0 = today().slice(0, 7);
    const monthTx = S.tx.filter((x) => x.date.startsWith(m0));
    const bal = monthTx.reduce((s, x) => s + (x.type === "in" ? 1 : -1) * (Number(x.amount) || 0), 0);

    // Header banner
    doc.setFillColor(62, 90, 71);
    doc.rect(0, 0, 210, 32, "F");

    doc.setTextColor(255, 255, 255);
    doc.setFontSize(18);
    doc.setFont("helvetica", "bold");
    doc.text(`${userSession.farmName.toUpperCase()} • INVENTAIRE DU CHEPTEL`, 14, 16);

    doc.setFontSize(9);
    doc.setFont("helvetica", "normal");
    doc.text(`Registre Cunicole Officiel | Responsable : ${userSession.managerName} | Date : ${fmtDate(today())}`, 14, 25);

    // Summary block
    doc.setTextColor(36, 48, 42);
    doc.setFontSize(12);
    doc.setFont("helvetica", "bold");
    doc.text("1. Synthèse Globale de l'Élevage", 14, 42);

    const statsData = [
      ["Effectif reproducteur actif", `${act.length} sujets (${males} mâles ♂, ${fem} femelles ♀)`],
      ["Reproducteurs aptes (≥ 5 mois)", `${mature} sujets`],
      ["Gestations en cours", `${gest.length} portée(s) attendue(s)`],
      ["Lapins en engraissement", `${fat} lapereaux`],
      ["Stock d'aliment disponible", `${nf1.format(stock)} kg (${rt.grams ? Math.round(stock / (rt.grams / 1000)) : "—"} jours d'autonomie)`],
      ["Trésorerie mensuelle nette", `${bal >= 0 ? "+" : "−"}${fcfa(Math.abs(bal))}`]
    ];

    doc.autoTable({
      startY: 46,
      body: statsData,
      theme: "plain",
      styles: { fontSize: 9.5, cellPadding: 2.2, font: "helvetica" },
      columnStyles: { 0: { fontStyle: "bold", width: 70, textColor: [91, 104, 98] }, 1: { textColor: [36, 48, 42] } },
      margin: { left: 14, right: 14 }
    });

    // Rabbits inventory table
    const startRabbits = doc.lastAutoTable.finalY + 10;
    doc.setFontSize(12);
    doc.setFont("helvetica", "bold");
    doc.setTextColor(36, 48, 42);
    doc.text(`2. Fiches détaillées des reproducteurs (${act.length} sujets)`, 14, startRabbits);

    const rabbitsRows = act.map((r) => {
      const w = lastWeight(r.id);
      const g = gmq(r.id);
      return [
        r.name,
        r.sex === "Male" ? "Mâle" : r.sex === "Female" ? "Femelle" : "Indét.",
        r.breed || "—",
        r.cage || "—",
        fmtShort(r.birth),
        ageLabel(age(r)),
        w != null ? `${nf2.format(w)} kg` : "—",
        g != null ? `${Math.round(g)} g/j` : "—",
        r.status || "Actif"
      ];
    });

    doc.autoTable({
      startY: startRabbits + 4,
      head: [["Nom/Code", "Sexe", "Race", "Cage", "Naiss.", "Âge", "Dernier poids", "GMQ", "Statut"]],
      body: rabbitsRows.length ? rabbitsRows : [["Aucun lapin enregistré", "—", "—", "—", "—", "—", "—", "—", "—"]],
      theme: "striped",
      headStyles: { fillColor: [62, 90, 71], textColor: [255, 255, 255], fontStyle: "bold", fontSize: 8.5 },
      styles: { fontSize: 8, cellPadding: 2.2, font: "helvetica" },
      margin: { left: 14, right: 14 }
    });

    // Matings table
    if (gest.length > 0) {
      const startMatings = doc.lastAutoTable.finalY + 10;
      doc.setFontSize(12);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(36, 48, 42);
      doc.text("3. Suivi des gestations actives", 14, startMatings);

      const matingsRows = gest.map((m) => {
        const left = diff(today(), m.due);
        return [
          rname(m.female),
          rname(m.male),
          fmtDate(m.date),
          fmtDate(m.due),
          left >= 0 ? `Dans ${left} j` : `Retard ${-left} j`,
          m.status
        ];
      });

      doc.autoTable({
        startY: startMatings + 4,
        head: [["Femelle", "Mâle", "Date saillie", "Mise bas prévue", "Échéance", "Statut"]],
        body: matingsRows,
        theme: "striped",
        headStyles: { fillColor: [185, 95, 69], textColor: [255, 255, 255], fontStyle: "bold", fontSize: 8.5 },
        styles: { fontSize: 8, cellPadding: 2.2, font: "helvetica" },
        margin: { left: 14, right: 14 }
      });
    }

    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      doc.setFontSize(8);
      doc.setTextColor(150, 150, 150);
      doc.text(`${userSession.farmName} • Document officiel d'élevage • Page ${i} sur ${pageCount}`, 105, 290, { align: "center" });
    }

    const filename = `Inventaire_${userSession.farmName.replace(/\s+/g, '_')}_${today()}.pdf`;
    doc.save(filename);
    toast("Inventaire PDF téléchargé !");
  } catch (err) {
    console.error("PDF generation error:", err);
    toast("Erreur lors de la génération du PDF.");
  }
}

/* ---------- Theme Management & Modal ---------- */
function getActiveTheme() {
  return localStorage.getItem("abv_theme") || "sage";
}

function setTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("abv_theme", theme);
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) {
    if (theme === "dark") metaTheme.content = "#101512";
    else if (theme === "terracotta") metaTheme.content = "#B45309";
    else if (theme === "emerald") metaTheme.content = "#15803D";
    else metaTheme.content = "#3E5A47";
  }
  toast(`Thème appliqué : ${themeLabel(theme)}`);
}

function themeLabel(theme) {
  switch (theme) {
    case "dark": return "🌙 Nuit Éleveur (Sombre)";
    case "terracotta": return "🌾 Terre & Argile";
    case "emerald": return "🌲 Forêt Émeraude";
    default: return "🌿 Nature Sauge (Clair)";
  }
}

  // Display and copy current origin URL for Google Cloud Console authorization

  if (orgEl) orgEl.textContent = window.location.origin;

  const btnCopyOrg = $("#btnCopyOriginUrl");
  if (btnCopyOrg) {

/* ---------- Modals & Forms ---------- */
function closeModal() { $("#modal").innerHTML = ""; document.body.style.overflow = ""; }
function sheet(title, body) {
  $("#modal").innerHTML = `<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh"><h2>${esc(title)}</h2><button class="btn ghost sm" data-act="close" aria-label="Fermer">${ICON.x}</button></div>${body}</div></div>`;
  document.body.style.overflow = "hidden";
}
function field(f, v) {
  const id = "f_" + f.k; const val = v ?? f.def ?? "";
  let input;
  if (f.type === "select") input = `<select id="${id}" name="${f.k}" ${f.req ? "required" : ""} class="form-input">${f.opts.map((o) => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(val) ? "selected" : ""}>${esc(ol)}</option>`; }).join("")}</select>`;
  else if (f.type === "textarea") input = `<textarea id="${id}" name="${f.k}" class="form-input" rows="${f.rows || 3}" placeholder="${esc(f.ph || "")}">${esc(val)}</textarea>`;
  else if (f.type === "check") return `<label class="check full"><input type="checkbox" id="${id}" name="${f.k}" ${val ? "checked" : ""}><span>${esc(f.label)}</span></label>`;
  else if (f.type === "html") return `<div class="full" id="${id}">${f.html || ""}</div>`;
  else input = `<input id="${id}" name="${f.k}" type="${f.type || "text"}" value="${esc(val)}" ${f.req ? "required" : ""} ${f.step ? `step="${f.step}"` : ""} ${f.min != null ? `min="${f.min}"` : ""} ${f.ph ? `placeholder="${esc(f.ph)}"` : ""} class="form-input">`;
  return `<div class="field ${f.full ? "full" : ""}" id="wrap_${id}"><label for="${id}">${esc(f.label)}${f.req ? ' <span style="color:var(--bad);font-weight:700">*</span>' : ''}</label>${input}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ""}<span class="field-err" style="display:none;color:var(--bad);font-size:0.75rem;font-weight:600;margin-top:2px"></span></div>`;
}
function form({ title, fields, values = {}, submit = "Enregistrer", onSubmit, onInput }) {
  sheet(title, `<form class="form" id="mform" novalidate>${fields.map((f) => field(f, values[f.k])).join("")}<div class="full actions" style="justify-content:flex-end;margin-top:12px"><button type="button" class="btn ghost" data-act="close">Annuler</button><button type="submit" class="btn pri" id="btnFormSubmit">${esc(submit)}</button></div></form>`);
  const fm = $("#mform");
  const read = () => {
    const o = {};
    fields.forEach((f) => {
      const el = fm.elements[f.k];
      if (!el) return;
      if (f.type === "check") {
        o[f.k] = el.checked;
      } else if (f.type === "number") {
        const raw = String(el.value).trim().replace(",", ".");
        o[f.k] = raw === "" ? "" : Number(raw);
      } else {
        o[f.k] = el.value.trim();
      }
    });
    return o;
  };

  // Suppression instantanée de l'état d'erreur lors de la saisie
  fm.addEventListener("input", (e) => {
    const wrap = e.target.closest(".field");
    if (wrap) {
      e.target.style.borderColor = "";
      const errEl = wrap.querySelector(".field-err");
      if (errEl) errEl.style.display = "none";
    }
  });

  if (onInput) {
    fm.addEventListener("input", () => onInput(read(), fm));
    fm.addEventListener("change", () => onInput(read(), fm));
    onInput(read(), fm);
  }

  fm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = read();

    // Réinitialiser les indicateurs d'erreur
    fm.querySelectorAll(".field-err").forEach((el) => (el.style.display = "none"));
    fm.querySelectorAll("input, select, textarea").forEach((el) => (el.style.borderColor = ""));

    let firstInvalid = null;
    for (const f of fields) {
      if (f.req) {
        const val = v[f.k];
        const isBlank = val === "" || val == null || (typeof val === "number" && isNaN(val));
        if (isBlank) {
          const wrap = $(`#wrap_f_${f.k}`);
          const el = fm.elements[f.k];
          if (wrap && el) {
            el.style.borderColor = "var(--bad)";
            const errEl = wrap.querySelector(".field-err");
            if (errEl) {
              errEl.textContent = `Ce champ est requis.`;
              errEl.style.display = "block";
            }
            if (!firstInvalid) firstInvalid = el;
          }
        }
      }
    }

    if (firstInvalid) {
      toast("Veuillez renseigner les champs requis (*)");
      firstInvalid.focus();
      return;
    }

    const btn = $("#btnFormSubmit") || fm.querySelector('[type="submit"]');
    const origText = btn ? btn.innerHTML : submit;
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `Enregistrement…`;
    }

    try {
      const ok = await onSubmit(v);
      if (ok !== false) {
        closeModal();
      }
    } catch (err) {
      console.error("Form submit error:", err);
      toast("Une erreur est survenue lors de l'enregistrement.");
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = origText;
      }
    }
  });

  setTimeout(() => fm.querySelector("input:not([type=checkbox]),select")?.focus(), 40);
}

function generateAutoRabbitName(sex = "Female") {
  const yr = String(new Date().getFullYear()).slice(-2);
  const _nums = (S.rabbits || []).map(r => { const m = String(r.name || "").match(/ABV-\d{2}-(\d+)/); return m ? Number(m[1]) : 0; });
  const nextNum = Math.max(0, ..._nums) + 1;
  const numFormatted = String(nextNum).padStart(3, "0");
  const code = `ABV-${yr}-${numFormatted}`;

  const list = sex === "Female" ? RABBIT_NAMES_FEMALE : (sex === "Male" ? RABBIT_NAMES_MALE : RABBIT_NAMES_INDET);
  const usedNames = new Set((S.rabbits || []).map(r => (r.name || "").split(" ")[0]));
  const available = list.filter(n => !usedNames.has(n));
  const pool = available.length > 0 ? available : list;

  const baseName = pool[Math.floor(Math.random() * pool.length)];
  return `${baseName} (${code})`;
}

async function bulk(docs, label) {
  try {
    const _docs = []; for (const [kind, key] of Object.entries(KIND)) S[key].forEach((x) => { const { kind: _k, ...rest } = x; _docs.push({ kind, ...rest }); });
    const _blob = new Blob([JSON.stringify({ app: "ABV Farm", version: 2, exported: today(), farm: userSession.farmName, docs: _docs }, null, 1)], { type: "application/json" });
    const _url = URL.createObjectURL(_blob); const _a = document.createElement("a"); _a.href = _url; _a.download = `abvfarm-sauvegarde-avant-import-${today()}.json`;
    document.body.appendChild(_a); _a.click(); _a.remove(); setTimeout(() => URL.revokeObjectURL(_url), 1000);
  } catch (e) { console.warn("Sauvegarde avant import impossible", e); }
  let n = 0;
  const all = getLocalData();
  const batchDocsToCloud = [];

  for (const d of docs) {
    const { kind, ...rest } = d;
    if (!KIND[kind]) continue;
    const obj = { ...rest };
    if (!obj.id) obj.id = uid();
    const doc = { ...obj, kind, updatedAt: new Date().toISOString() };
    all[kind + "-" + obj.id] = doc;
    if (userSession.isLoggedIn && isOnline && window.firebaseDb && userSession.uid) {
      batchDocsToCloud.push(doc);
    }
    n++;
  }

  setLocalData(all);
  ingest(Object.values(all));

  if (batchDocsToCloud.length > 0 && window.firebaseDb && userSession.uid) {
    (async () => {
      try {
        const userRef = window.firebaseDb.collection("users").doc(userSession.uid).collection("cheptel");
        for (let i = 0; i < batchDocsToCloud.length; i += 450) {
          const chunk = batchDocsToCloud.slice(i, i + 450);
          const batch = window.firebaseDb.batch();
          chunk.forEach(doc => {
            batch.set(userRef.doc(doc.kind + "-" + doc.id), doc);
          });
          await batch.commit();
        }
        userSession.lastSync = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
        saveUserSession();
      } catch (err) {
        console.warn("Cloud bulk push notice:", err);
      }
    })();
  }

  return n;
}
