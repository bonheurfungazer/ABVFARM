[build]
  # Dossier contenant la version Web prête à être déployée
  publish = "public"
  functions = "netlify/functions"
  command = ""

[build.environment]
  NETLIFY_SKIP_COLLABORATIVE_PROMPTS = "true"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes de sécurité (section 12) : sans CSP — l'application est entièrement
# en scripts inline + onclick inline, une CSP sans 'unsafe-inline' la casserait
# et avec 'unsafe-inline' elle n'apporterait presque rien. À réévaluer seulement
# après externalisation du JS. Pas de SRI : les CDN (gstatic, cdnjs, Google)
# ne sont pas versionnés par hash ici et un hash erroné casserait le chargement.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# M102 : sw.js et manifest.json ne doivent JAMAIS être servis périmés par un
# cache intermédiaire — avant, aucun en-tête dédié : un déploiement pouvait
# rester invisible pour les clients. Revalidation obligatoire à chaque fois.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# m88 : les images (icônes, logo, écrans de démarrage) changent rarement —
# cache HTTP d'une semaine pour éviter de re-télécharger tout le précache à
# chaque changement de version du SW. Pas d'« immutable » : les noms de
# fichiers ne portent pas d'empreinte de version.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
